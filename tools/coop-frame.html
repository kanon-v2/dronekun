<script>
var forceReady = false, auto = false, unarmed = false, geared = -1, frames = 0, ticks = 0;
var shootPartner = false;   //ホスト：相方のすぐそばから弾を撃つ(相方のバリアに防がせる)
var wantJust = false;       //戦闘が始まったらジャスト衝撃波を1回出す
var wantGrab = false;       //ゲスト：報酬カプセルが見えたら拾いに行く
var wantCounter = false;    //ゲスト：突進が見えたらジャスト・カウンターで弾き返す
var gearList = ["gun","missile","tesla"];   //協力プレイの強化画面で付ける装備(親ページの gear で変える)
var keepHp = true;          //自動プレイで耐久を1より減らさない(natural で外し、ほんとうに倒れるようにする)
var rewardWait = -1, rewardT = 0;  //強化画面で報酬を選ぶまでのコマ(マイナスなら選ばずに準備完了にする)
var sturdy = false;         //自動プレイで耐久を満タンに保つ(倒れない)
var gearLv = 5;             //自動プレイの強化画面で上げる能力のレベル
var DUEL_TEST_HP = 40;       //一騎打ちの耐久(テストでは小さく)
//記録へ書き込んだ回数(名前ごと)。ゲストは何も書かないことを確かめる
var writes = {}, setItem0 = Storage.prototype.setItem;
Storage.prototype.setItem = function(k, v){ writes[k] = (writes[k] || 0) + 1; return setItem0.apply(this, arguments); };
function bot(){
    frames++; MouseIn = true;
    MouseX = 480 + 300*Math.cos(frames/60); MouseY = 270 + 170*Math.sin(frames/45);
    var tx = 0, ty = 0, list = enemyShots.concat(enemies.filter(function(e){ return !e.harmless; }));
    for(var i=0; i<list.length; i++){ var o = list[i], dx = drone.X - o.x, dy = drone.Y - o.y, d = Math.hypot(dx,dy) || 1, R = (o.r || 5) + 90; if(d < R){ tx += dx/d*(R-d); ty += dy/d*(R-d); } }
    if(tx || ty){ MouseX = drone.X + tx*2; MouseY = drone.Y + ty*2; }
    MouseX = Math.max(30, Math.min(CW-30, MouseX)); MouseY = Math.max(30, Math.min(CH-30, MouseY));
}
//自動で遊ぶ：ストーリーは送る・強化画面では装備して準備完了・戦闘はよけながら撃つ
function autoPlay(){
    if(page.number == 4){ MouseX = 480; MouseY = 270; if(time % 10 == 0) Click = 1; }
    else if(page.number == 2 && coop.active){
        if(geared != game.wave){
            geared = game.wave;
            if(unarmed){ game.owned = {}; game.slots = [null,null,null]; }
            else { game.owned = {}; gearList.forEach(function(w){ game.owned[w] = 3; }); game.slots = gearList.slice(); }
            game.slotCount = 3;
            for(var k in game.level) game.level[k] = gearLv;
        }
        //報酬は画面のとおり選んでから準備完了にする(rewardWait コマ待ってから選ぶ。ゲストをわざと遅くして、ホストだけ先に出撃しないかを見る)
        if(upgradeScreen.state == "reward" && rewardWait >= 0){
            if(++rewardT >= rewardWait){ rewardT = 0; upgradeScreen.takeReward(upgradeScreen.offers[0]); extra.rewards = (extra.rewards || 0) + 1; }
        }
        else if(!coop.localReady) coop.localReady = true;
        //相方が戦闘に入ったのに、自分は報酬を選んでいる(取り残された)
        if(coop.partner && coop.partner.page == 1 && upgradeScreen.state == "reward"){ extra.leftBehind = (extra.leftBehind || 0) + 1; extra.leftAt = "w" + game.wave + " pr" + game.pendingReward + " 相方w" + (coop.role == "guest" ? "?" : game.wave); }
    }
    else if(page.number == 1){
        bot(); if(keepHp) mainScreen.hp = Math.max(mainScreen.hp, 1); if(sturdy && !mainScreen.down) mainScreen.hp = mainScreen.maxHp; if(!unarmed && frames % 300 == 0) Click = 1;
        if(wantCounter && mainScreen.state == "play"){
            var cd = enemies.filter(function(e){ return e.type == "dasher" && !e.countered; })[0];
            if(cd){ wantCounter = false; mainScreen.counter(cd); }
        }
        if(coop.role == "guest" && enemies.some(function(e){ return e.countered; })) extra.cSeen++;
        //報酬カプセルを取りに行く(届いたカプセルの上へ動く)
        var cap = wantGrab && pickups.filter(function(p){ return p.kind == "capsule"; })[0];
        if(cap){ drone.X = drone.preX = cap.x; drone.Y = drone.preY = cap.y; MouseX = cap.x; MouseY = cap.y; wantGrab = false; mainScreen.invincible = Math.max(mainScreen.invincible, 60); }
        //ライバル(rival.js)：ゲストにも見えて、ワープの出発点・長さが届く
        var rv = enemies.filter(function(e){ return e.type == "chrono"; })[0];
        if(rv && coop.role == "guest" && rv.mid && rv.look) extra.rvSeen++;
        if(rv && coop.role == "guest" && rv.mode == "warp" && rv.wt > 0 && rv.harmless) extra.rvWarp++;
        if(coop.role == "guest" && enemies.some(function(e){ return e.clone && e.look && e.mode == "waltz"; })) extra.cloneSeen++;
        //写し(coopMirror.js)：ライバルの中身(ゲストでは作らない値)と、針の中身がゲストに届いている
        if(coop.role == "guest" && enemies.some(function(e){ return e.type == "chrono" && e.orbit != null && e.cycle != null; })) extra.mirrored++;
        if(coop.role == "guest" && enemyShots.some(function(b){ return b.kind == "chrono" && b.bk != null; })) extra.needleX++;
        if(coop.partnerStopped()) extra.pStop++;
        //最終局面(finaleTriumph.js)：ゲストにも改の第二形態と曲の時刻が写り、ゲストのジャスト衝撃波で突進を弾き返す
        var kai = enemies.filter(function(e){ return e.type == "kai"; })[0];
        if(coop.role == "guest" && kai && kai.trSong && kai.form == 2 && finaleTri.fakeT != null) extra.gFinale++;
        if(coop.role == "guest" && kai && kai.trApproach && kai.trHit != null && !guestParried && finaleTri.fakeT >= kai.trHit - 0.05){
            guestParried = true;
            drone.X = drone.preX = kai.trTx; drone.Y = drone.preY = kai.trTy;
            mainScreen.yaruki = YARUKI_MAX;
            mainScreen.blast();
            extra.gParry++;
        }
        if(coop.role == "host" && finaleTri.result) extra.fres = finaleTri.result;
        if(coop.role == "host" && finaleRun){
            var sig = kai ? kai.mode + "/" + kai.form + "/" + (kai.trSong ? "S" : "-") + "/" + Math.round(kai.hp/kai.maxHp*100) : "none";
            if(sig != lastSig){ lastSig = sig; kaiLog.push((finaleTri.fakeT || 0).toFixed(1) + ":" + sig); if(kaiLog.length > 14) kaiLog.shift(); extra.kaiLog = kaiLog.join(" "); }
        }
        //通しの確認(tour)：ホストが場面を順に進め、ゲストは見えた動き・区切りを数える(例外が出ず、止まらないこと)
        if(tour && coop.role == "host") tourStep();
        if(coop.role == "guest"){
            var rv = enemies.filter(function(e){ return e.type == "chrono"; })[0];
            if(rv && rv.mode) seenModes[rv.mode] = 1;
            if(rival.pull) extra.gPull = (extra.gPull || 0) + 1;     //時戻しで巻き戻されている(coopMirror.rewindWatch)
            if(kai && kai.trSong && finaleTri.fakeT != null){ var sec = finaleTri.section(finaleTri.fakeT); if(sec) seenModes["tr:" + sec.name] = 1; }
            if(finaleTri.cut) seenModes["tr:cut"] = 1;
            extra.gModes = Object.keys(seenModes).length;
            extra.gModeList = Object.keys(seenModes).join(",");
            //進んだ戦闘の時計の合計(WAVEが変わって時計が0に戻っても減らない)
            var ck = mainScreen.clock;
            extra.gClock = (extra.gClock || 0) + (ck >= lastClock ? ck - lastClock : ck);
            lastClock = ck;
        }
        if(wantJust && mainScreen.state == "play" && !special.holdFire() && !mainScreen.down){ wantJust = false; enemyShots.push({ x:drone.X - 30, y:drone.Y, vx:4, vy:0, r:5 }); mainScreen.yaruki = YARUKI_MAX; var jb = mainScreen.just, jb0 = enemyShots[enemyShots.length - 1], jPre = "ht" + mainScreen.hitTime(jb0.x, jb0.y, jb0.vx, jb0.vy, 5 + HIT_CORE) + " isJust" + mainScreen.isJust() + " down" + mainScreen.down + " dx" + Math.round(jb0.x - drone.X) + " shots" + enemyShots.length; mainScreen.blast(); extra.jPre = jPre; extra.jTry = "x" + Math.round(drone.X) + " just" + jb + "→" + mainScreen.just + " ev" + coop.events.map(function(e){ return e[1]; }).join("") + " slow" + (mainScreen.justSlowT || 0) + " st" + mainScreen.state + " pg" + page.number + " hf" + special.holdFire() + " " + extra.jPre; }
        if(shootPartner && coop.partner && frames % 15 == 0){
            var a = Math.random()*Math.PI*2, px = coop.partner.pos.X, py = coop.partner.pos.Y;
            fireShot(px + Math.cos(a)*60, py + Math.sin(a)*60, a + Math.PI, 3);
        }
    }
    //一騎打ち(coopDuel.js)：よけながら飛んで、ときどき衝撃波。決着を早めるため耐久を小さくする
    else if(page.number == 8){
        if(coopDuel.phase == "fight"){
            bot(); if(frames % 200 == 0) Click = 1;
            if(coopDuel.mh > DUEL_TEST_HP){ coopDuel.mh = DUEL_TEST_HP; coopDuel.hp = Math.min(coopDuel.hp, DUEL_TEST_HP); }
        }
        if(coopDuel.phase == "fight" || coopDuel.phase == "rebuild") extra.duelF = (extra.duelF || 0) + 1;
        if((coopDuel.rb || (coopDuel.other && coopDuel.other.rb)) && !extra.firstZero) extra.firstZero = extra.duelF;
        if(coopDuel.rb == 2) extra.rebuilt = 1;
        if(coopDuel.other && coopDuel.other.rb == 2) extra.otherRebuilt = 1;
    }
    //対戦：準備OKを押し、戦闘はよけながら飛んで、ときどき衝撃波
    else if(page.number == 7){
        if(versus.phase == "select" && !versus.ready && (versus.picks.length == VS_PICKS || forceReady)) versus.ready = true;
        if(versus.phase == "fight"){ bot(); if(frames % 400 == 0) Click = 1; }
    }
}
function step(){
    if(Click == 1 && sound.handleClick()) Click = 0;
    var pg = page.number;
    coop.update();
    //自動プレイの戦闘中のクリックが、相方に合わせて切り替わった次の画面(ゲームオーバーなど)のボタンを押さないように
    if(page.number != pg) Click = 0;
    screens[page.number].update();
    coop.send();
    Click = 0;
    time++;
    if(time >= MAXTIME) time = 0;
}
//ホストが反映した、ゲストからのダメージの回数(合計)
var partnerHits = 0, hitEnemy0 = mainScreen.hitEnemy;
mainScreen.hitEnemy = function(_e,_d,_src){ if(_src == "partner") partnerHits++; return hitEnemy0.apply(this, arguments); };
//ホストに届いた、ゲストの追加の装備の効果(armsExtra.js)：燃やした・凍らせた回数、渦の吸い寄せ、バリアで消えた弾
var extra = { burn:0, freeze:0, pull:0, block:0, justSlow:0 }, readGuest0 = coop.readGuest;
coop.readGuest = function(){
    var sum = function(n){ var t = 0; for(var k in coop.applied) t += coop.applied[k][n] || 0; return t; };
    var b0 = sum(3), f0 = sum(4), s0 = enemyShots.length, k0 = coop.blockDone;
    var ret = readGuest0.apply(this, arguments);
    extra.burn += Math.max(0, sum(3) - b0); extra.freeze += Math.max(0, sum(4) - f0);
    if(coop.blockDone > k0) extra.block += Math.max(0, s0 - enemyShots.length);
    return ret;
};
var pullWell0 = arms.pullWell;
arms.pullWell = function(_x,_y,_pull){ if(coop.role == "host" && _pull == 1.0) extra.pull++; return pullWell0.apply(this, arguments); };
//相方のジャスト衝撃波が届いて、ホストが敵と弾をゆっくりにした回数
var readEvents0 = coop.readEvents, inEvents = false;
coop.readEvents = function(){ inEvents = true; var ret = readEvents0.apply(this, arguments); inEvents = false; return ret; };
//相方のジャスト衝撃波が届いて、自分の画面もゆっくりになった回数(ホストもゲストも)
var startJustSlow0 = mainScreen.startJustSlow;
mainScreen.startJustSlow = function(){ if(inEvents) extra.justSlow++; return startJustSlow0.apply(this, arguments); };
//相方のジャスト・カウンターが届いて、ホストが突進を弾き返した回数(extra.counter)と、ゲストに弾き返した突進が見えた回数(extra.cSeen)
extra.counter = 0; extra.cSeen = 0; extra.rvSeen = 0; extra.rvWarp = 0; extra.cloneSeen = 0;
extra.pslow = 0; extra.cleared = 0; extra.pStop = 0; extra.mirrored = 0; extra.needleX = 0; extra.downSeen = 0; extra.revived = 0; extra.rebuilt = 0; extra.otherRebuilt = 0;
//ゲストの見切りで、ホストが敵と弾をゆっくりにした・ゲストが回避で消した弾をホストが消した
//相方の見切りを見ていて、敵と弾をゆっくりにした(ホスト)・見切りの演出が出た(ゲスト)コマ
var slowStep0 = dodge.slowStep;
dodge.slowStep = function(){ var w = dodge.watch, r = slowStep0.apply(this, arguments); if(w && r && coop.role == "host") extra.pslow++; if(w && dodge.slowPow > 0) extra.gWatch = (extra.gWatch || 0) + 1; return r; };
var removeShots0 = coop.removeShots;
coop.removeShots = function(){ var n0 = enemyShots.length; var r = removeShots0.apply(this, arguments); extra.cleared += n0 - enemyShots.length; return r; };
//倒れて、相方が生き残っていたので復活した
var reviveStep0 = coop.reviveStep;
coop.reviveStep = function(){ var d0 = mainScreen.down; if(d0) extra.downSeen++; var r = reviveStep0.apply(this, arguments); if(d0 && !mainScreen.down) extra.revived++; return r; };
var counter0 = mainScreen.counter;
mainScreen.counter = function(_e){ if(coop.role == "host" && inEvents && !_e.countered) extra.counter++; return counter0.apply(this, arguments); };
//対戦で与えたダメージの内訳(装備ごと。バランス調整用)
var vsSrc = {}, vsHit0 = versus.hit;
versus.hit = function(_e,_d,_src){ if(versus.live()) vsSrc[_src] = Math.round(((vsSrc[_src] || 0) + _d*(VS_DAMAGE_MUL[_src] || 1))*10)/10; return vsHit0.apply(this, arguments); };
var pendingPw = 0, finaleRun = false, guestParried = false;
var lastClock = 0, tour = null, seenModes = {}, kaiLog = [], lastSig = "";
//通しの確認：ライバル(第一形態 → 第二形態 → 時の前借り → 時ノ奔流)・最終局面(曲の区切りを順に飛ばし、体力の区切りのムービーも)
function tourStep(){
    var T = tour, rv = enemies.filter(function(e){ return e.type == "chrono"; })[0], kai = enemies.filter(function(e){ return e.type == "kai"; })[0];
    T.t++;
    mainScreen.invincible = 10;
    if(T.kind == "rival" && rv){
        if(T.t == 1800 && rv.form != 2) mainScreen.hitEnemy(rv, rv.hp + 1);        //第二形態へ
        if(T.t == 2300 && rv.form == 2) rv.cycle = RIVAL2_PATTERNS[rv.lv].indexOf("rewind");    //次の攻撃を時戻しに(ゲストも巻き戻される)
        if(T.t == 3600 && rv.form == 2) rv.hp = rv.maxHp*(RIVAL2_BORROW_HP - 0.05);   //時の前借り
        if(T.t == 5200 && rv.form == 2) rv.hp = rv.maxHp*(RIVAL2_OD_HP - 0.03);       //時ノ奔流
        if(rv.hp < rv.maxHp*0.1) rv.hp = rv.maxHp*0.1;
    }
    if(T.kind == "finale" && kai){
        var at = { 1500:60, 2100:93, 2700:100.5, 3300:129, 3700:140, 4300:156, 4900:178 }[T.t];
        if(at != null) finaleTri.fakeT = at;
        if(T.t == 3800) kai.hp = kai.maxHp*(TR_BREAKS[1].hp + 0.05);    //体力の区切りのムービー(夜明けへ)
        if(T.t == 3810) mainScreen.hitEnemy(kai, kai.maxHp*0.1);
    }
    extra.tourT = T.t;
}
extra.gFinale = 0; extra.gParry = 0; extra.fres = "";
//ホストが送る状態のいちばん大きいもの(バイト)と、そのうち写し(coopMirror.js)の分
extra.maxSize = 0; extra.maxMirror = 0;
var buildHost0 = coop.buildHost;
coop.buildHost = function(){ var s = buildHost0.apply(this, arguments); var n = JSON.stringify(s).length; if(n > extra.maxSize){ extra.maxSize = n; extra.maxMirror = s.mr ? JSON.stringify(s.mr).length : 0; } return s; };
function tick(){
    try{
        for(var i=0; i<4; i++){
            if(pendingPw && page.number == 2){ coop.playWave = pendingPw; pendingPw = 0; }
            if(auto) autoPlay();
            if(finaleRun && finaleTri.fakeT != null) finaleTri.fakeT += 1/60;    //曲は鳴らさず、曲の時刻を1コマずつ進める
            step();
        }
        if(++ticks % 4 == 0){ ctx.fillStyle = "white"; ctx.fillRect(0,0,CW,CH); screens[page.number].draw(); }
    }catch(e){ errors.push(String(e) + " " + String(e.stack || "").split(String.fromCharCode(10)).slice(1,3).join(" ").replace(/file:\/\/\/[^ ]*\//g,"")); }
}
//記録(能力・パーツ・装備・進み具合)は毎回空から(テスト用のプロフィールに前の回の分が残るため)
try{ localStorage.removeItem(save.META_KEY); localStorage.removeItem(save.KEY); }catch(e){}
var loop = setInterval(tick, 16);

//親ページへ状態を知らせる
setInterval(function(){
    top.postMessage({ st:true, name:window.name, page:page.number, active:coop.active, role:coop.role, inRoom:coop.inRoom,
        waiting:coop.waiting, code:coop.code, lag:coop.lagMs(), rc:coop.reconnects, pw:coop.playWave, pr:game.pendingReward || 0, wave:game.wave, diff:difficulty().id, msg:coop.msg, notice:startScreen.notice || "",
        partner:!!coop.partner, partnerHits:partnerHits, just:mainScreen.just, parts:game.parts, partsGot:coop.partsGot, partnerParts:coop.partnerParts, enemies:enemies.length, extra:extra, blocked:arms.blockLog[0],
        vs:{ a:versus.active, ph:versus.phase, r:versus.round, hp:versus.hp, res:versus.result, w:versus.wins, l:versus.losses, d:versus.draws, dealt:versus.dealt, mx:VS_HP, ft:versus.fightTime, t:versus.t, src:vsSrc },
        tint:drone.look.tint || "", ptint:coop.look.tint || "", down:mainScreen.down, ts:timeStop.code(), writes:writes,
        dbg:{ hp:mainScreen.hp, dT:mainScreen.downT, pd:coop.partner ? (coop.partner.down ? 1 : 0) + "/" + coop.partner.page : "-", rd:coop.localReady ? 1 : 0, prd:coop.partner ? coop.partner.rd : "-", cn:coop.wantContinue ? 1 : 0, hs:mainScreen.hitStop, ts:timeStop.active, tsp:timeStop.phase + ":" + timeStop.t, pg:page.number, ps:coop.partnerStopped(), wh:coopMirror.worldHeld(), clk:mainScreen.clock, st:mainScreen.state, q:coop.snapQ, ticks:ticks, n:enemies.length, modes:enemies.map(function(e){ return e.type + ":" + e.mode; }).join(" ").slice(0,200) },
        duel:{ a:coopDuel.active, ph:coopDuel.phase, rb:coopDuel.rb, res:coopDuel.result, hp:coopDuel.hp },
        story:page.number == 4 ? storyScreen.id : "", errors:errors.slice(0,5) }, "*");
}, 100);

//親ページからの指示
window.addEventListener("message", function(ev){
    var m = ev.data;
    if(!m || !m.cmd) return;
    if(m.cmd == "create"){ coop.init(); coop.mode = m.mode || "coop"; coop.diff = m.diff == null ? DEFAULT_DIFF : m.diff; page.change(6); coop.createRoom(); }
    if(m.cmd == "gear"){ gearList = m.w.slice(); geared = -1; }
    if(m.cmd == "shoot") shootPartner = !!m.on;
    if(m.cmd == "picks") versus.picks = m.p.slice();
    if(m.cmd == "again") versus.newRound();
    if(m.cmd == "forceReady") forceReady = true;
    if(m.cmd == "die" && page.number == 1){ timeStop.cd = 99999; mainScreen.hp = 1; mainScreen.invincible = 0; mainScreen.guard = 0; mainScreen.damage(); }   //時止めワープに防がれないように
    if(m.cmd == "continue") coop.wantContinue = true;
    if(m.cmd == "dieOne" && page.number == 1){ timeStop.cd = 99999; mainScreen.hp = 1; mainScreen.invincible = 0; mainScreen.guard = 0; mainScreen.damage(); }
    //回避ダッシュ(dodge.js)：ジャスト回避(見切り)と、まわりの弾を消す
    if(m.cmd == "dodgeJust" && page.number == 1){ dodge.t = 0; dodge.justDone = false; dodge.just(); }
    if(m.cmd == "dodgeClear" && page.number == 1) dodge.clearAround(260);
    //時止めワープ(timeStop.js)：買ってあることにして、被弾の瞬間に時が止まる(移動先は選ばずに待つ：協力プレイでは時間で決まる)
    if(m.cmd == "warp" && page.number == 1){ game.buffs.warp = 1; timeStop.cd = 0; mainScreen.invincible = 0; mainScreen.guard = 0; dodge.guard = 0; timeStop.trigger(); }
    if(m.cmd == "setWave") game.wave = m.w;
    //装備をすぐ付け替える(一騎打ちの前に。能力のレベルも m.lv に)
    if(m.cmd == "arm"){ unarmed = false; game.owned = {}; m.w.forEach(function(w){ game.owned[w] = m.wl || 3; }); game.slots = m.w.slice(); game.slotCount = 3; for(var k in game.level) game.level[k] = m.lv || 5; }
    //最終局面：改を出してすぐ倒し、Suno の第二形態を曲の時刻 m.t から(ホスト)
    if(m.cmd == "finale" && page.number == 1){
        bgmTrial.finale = bgmTrial.finales.map(function(f){ return f.v; }).indexOf("triumph");
        enemies = []; enemyShots = []; mainScreen.toSpawn = 0;
        var k = makeBoss("kai"); k.x = 480; k.y = 150; k.mode = "idle";
        enemies.push(k);
        var dead0 = false;
        Object.defineProperty(k, "dead", { get:function(){ return dead0; }, set:function(v){ if(v && !dead0) extra.kaiDead = String(new Error().stack).split(String.fromCharCode(10)).slice(1,5).join(" ").replace(/file:\/\/\/[^ ]*\//g,""); dead0 = v; } });
        finaleTri.fakeT = m.t; finaleRun = true;
        mainScreen.hitEnemy(k, k.hp + 1);
    }
    //最終局面の曲合わせ(coopMirror.followSong)：曲がまだ別のものでも、流し直しは1度だけ頼む(毎フレーム頼むと止まる)
    if(m.cmd == "songCheck"){
        var music0 = sound.music, ctx0 = sound.ctx, track0 = sound.trackName, asks = 0;
        sound.music = function(_n){ if(_n) asks++; }; sound.ctx = sound.ctx || {}; sound.trackName = "boss";
        coopMirror.songAsked = false; coopMirror.songWait = 0;
        for(var i=0; i<120; i++) coopMirror.followSong(30 + i/60);
        sound.music = music0; sound.ctx = ctx0; sound.trackName = track0;
        extra.songAsks = asks;
    }
    if(m.cmd == "tour"){ tour = { kind:m.kind, t:0 }; extra.tourT = 0; extra.tourKind = m.kind; if(m.kind == "rival" && page.number == 1){ enemies = []; enemyShots = []; mainScreen.toSpawn = 0; var rv = rival.make(); if(m.lv != null){ rv.lv = m.lv; rv.hp = rv.maxHp = Math.round(RIVAL_HP[m.lv]*difficulty().hp)*coop.hpMul(); } enemies.push(rv); } }   //m.lv：ライバルの段階(WAVEを変えずに強さだけ)
    //後始末(敵を消してもWAVEがクリアにならないよう、雑魚敵を少し出す)
    if(m.cmd == "tourOff"){ tour = null; seenModes = {}; finaleRun = false; finaleTri.fakeT = null; enemies = []; enemyShots = []; mainScreen.toSpawn = 5; }
    if(m.cmd == "finaleOff"){ finaleRun = false; finaleTri.fakeT = null; enemies = []; enemyShots = []; mainScreen.toSpawn = 5; }
    //ジャスト衝撃波：当たる直前の弾を置いてから衝撃波を出す
    if(m.cmd == "just") wantJust = true;
    //ジャスト・カウンター：ホストが止まった突進を出し、ゲストがそれを弾き返す
    if(m.cmd == "dasher" && page.number == 1){ var nd = makeEnemy("dasher"); nd.x = 480; nd.y = 60; nd.timer = 99999; enemies.push(nd); }
    if(m.cmd == "counter") wantCounter = true;
    if(m.cmd == "grab") wantGrab = true;
    if(m.cmd == "capsule" && page.number == 1 && coop.partner){ mainScreen.drop("capsule", coop.partner.pos.X, coop.partner.pos.Y); pickups[pickups.length - 1].vx = pickups[pickups.length - 1].vy = 0; }
    if(m.cmd == "rival" && page.number == 1){ enemies.push(rival.make()); }
    //ライバルの分身：今いるライバルを第二形態にして、分身の陣を出す
    if(m.cmd == "clones" && page.number == 1){ var rv = enemies.filter(function(e){ return e.type == "chrono"; })[0]; if(rv){ rv.lv = RIVAL2_FROM; rv.form = 2; rv.mode = "idle"; rival.flags(rv); aimAt = drone; rival.surround(rv, "waltz"); } }
    if(m.cmd == "clearSrc") vsSrc = {};
    if(m.cmd == "forfeit" && versus.phase == "fight") versus.hp = 0;
    if(m.cmd == "join"){ coop.init(); page.change(6); coop.joinRoom(m.code); }
    if(m.cmd == "auto"){ auto = true; unarmed = !!m.unarmed; }
    if(m.cmd == "rewardWait") rewardWait = m.f;
    if(m.cmd == "sturdy") sturdy = !!m.on;
    if(m.cmd == "natural"){ keepHp = !m.on; if(m.lv) gearLv = m.lv; geared = -1; }
    if(m.cmd == "leave"){ coop.leave(); page.change(0); }
    if(m.cmd == "stop"){ clearInterval(loop); auto = false; }
    //ウィンドウが隠れて描画が止まったときの代わり：ms ミリ秒のあいだ更新(と状態の送信)を止める
    if(m.cmd == "pause"){ clearInterval(loop); setTimeout(function(){ loop = setInterval(tick, 16); }, m.ms); }
    //回線が一瞬途切れて、仲介サーバーとのつながりが切れたときの代わり：PeerJS と同じ "network" のエラーを出す
    if(m.cmd == "netError" && coop.peer) coop.peer._emit("error", { type:"network", message:"Lost connection to server." });
    //出撃先：ホストが次に出撃するWAVEを選ぶ。強化画面で選ぶのと同じく、次に強化画面に入ったときに選ぶ(クリアすると選び直しになるため)
    if(m.cmd == "replay") pendingPw = m.w;
    //今のWAVEをすぐ終わらせる(敵を消して、もう出さない)
    if(m.cmd == "winWave" && page.number == 1){ enemies = []; enemyShots = []; mainScreen.toSpawn = 0; }
    //回線が悪くなって相方へ届かないときの代わり：ms ミリ秒のあいだ何も送らない(生きている合図も)
    if(m.cmd == "mute" && coop.conn){ var mc = coop.conn, ms0 = mc.send; mc.send = function(){}; setTimeout(function(){ mc.send = ms0; }, m.ms); }
});
</script>
</body></html>
