<!DOCTYPE html>
<!--
    ドローン君の絵を作る道具
    ・3Dの形(距離関数)をWebGLで光・影・つやまで計算して描く。どの向きも同じ形から描くので、向きごとの絵がずれない
    ・開くと候補の見比べページになる(案ごとの6方向・ゲーム中の大きさ・色違い・回転)
    ・#bake=A のように開くと、その案の全方向の絵を1枚の画像にまとめて、データURLとして #bake に書き出す(tools/bake-drone.ps1 が使う)
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ドローン君の絵の候補</title>
<style>
body{ margin:0; background:#e4e1da; color:#222; font:14px/1.6 "Hiragino Sans","Meiryo",sans-serif; }
h1{ font-size:20px; margin:0; padding:14px 20px 4px; }

    background:radial-gradient(circle at 50% 40%,#f7f7f5,#cfd2d6); }

<body>
<h1>ドローン君の絵の候補</h1>
<div class="lead">いずれも3Dの形から、光・影・つやを計算して描いています。どの向きも同じ形から描くので、向きごとの絵がずれません。</div>
<div id="cards"></div>
<pre id="bake" style="display:none"></pre>

<script id="vs" type="x-shader">#version 300 es
in vec2 p;
void main(){ gl_Position = vec4(p,0.0,1.0); }
</script>

<script id="fs" type="x-shader">#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uYaw;     //水平の向き(ラジアン。正で左を向く)
uniform float uElev;    //カメラの高さの角度(ラジアン。正で上から見下ろす)
uniform float uHalf;    //描く範囲の半分の幅(3D空間の長さ)
uniform float uCy;      //描く範囲の中心の高さ
out vec4 outColor;

//材質の番号
const float M_BODY = 1.0;   //胴体
const float M_LENS = 2.0;   //黒いガラスのレンズ
const float M_DARK = 3.0;   //黒い樹脂(マスト・プロペラ)
const float M_METAL = 4.0;  //磨いた金属
const float M_BEZEL = 5.0;  //目の縁(白い樹脂)
const float M_GLASS = 6.0;  //バイザー(光る目つき)
const float M_LED = 7.0;    //赤いランプ
const float M_TRIM = 8.0;   //差し色
const float M_EYE = 9.0;    //光るランプの目

#if VARIANT == 0
const vec3 BODY_B = vec3(0.92,0.58,0.66); const float BODY_R = 0.17;
#elif VARIANT == 1
const vec3 BODY_B = vec3(0.74,0.50,0.60); const float BODY_R = 0.30;
#elif VARIANT == 2
const vec3 BODY_B = vec3(0.94,0.56,0.68); const float BODY_R = 0.07;
#else
const vec3 BODY_B = vec3(0.95,0.56,0.62); const float BODY_R = 0.12;
#endif

//ふちどり(形の外側に、この太さで濃い線を引く。0なら引かない)
#if VARIANT == 3
const float OUTLINE = 0.028;
#else
const float OUTLINE = 0.0;
#endif
const vec3 INK = vec3(0.07,0.07,0.08);

vec3 camR, camU, camC, Lw;

float sdRoundBox(vec3 p, vec3 b, float r){ vec3 q = abs(p) - b + r; return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0) - r; }
float sdBox(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0); }
float sdCylY(vec3 p, float r, float h){ vec2 d = abs(vec2(length(p.xz),p.y)) - vec2(r,h); return min(max(d.x,d.y),0.0) + length(max(d,0.0)); }
float sdCapsule(vec3 p, vec3 a, vec3 b, float r){ vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0); return length(pa - ba*h) - r; }
float sdTorusY(vec3 p, float R, float r){ vec2 q = vec2(length(p.xz) - R, p.y); return length(q) - r; }
vec2 rot(vec2 v, float a){ float c = cos(a), s = sin(a); return vec2(c*v.x - s*v.y, s*v.x + c*v.y); }
vec2 U(vec2 a, vec2 b){ return a.x < b.x ? a : b; }

float hash(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x + p.y + p.z)); }
float noise(vec3 x){
    vec3 i = floor(x), f = fract(x); f = f*f*(3.0 - 2.0*f);
    return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float fbm(vec3 p){ float a = 0.5, s = 0.0; for(int i=0; i<4; i++){ s += a*noise(p); p *= 2.03; a *= 0.5; } return s; }

//プロペラ(マスト・根元・ハブ・2枚の羽根)。base は胴体の上面、top はマストの長さ
vec2 rotor(vec3 p, vec3 base, float top, float ang, float len, float wid, float mastR){
    vec3 q = p - base;
    vec2 r = vec2(sdCylY(q - vec3(0.0,top*0.5,0.0), mastR, top*0.5), M_DARK);
    r = U(r, vec2(sdCylY(q - vec3(0.0,0.03,0.0), mastR*2.1, 0.035) - 0.01, M_METAL));
    r = U(r, vec2(sdCylY(q - vec3(0.0,top,0.0), mastR*1.9, 0.04) - 0.008, M_METAL));
    vec3 b = q - vec3(0.0,top + 0.045,0.0);
    b.xz = rot(b.xz, ang);
    //先にいくほど細く、少しねじる
    float t = clamp(abs(b.x)/len,0.0,1.0);
    vec3 bb = b; bb.y -= sign(b.x)*b.z*0.25;
    r = U(r, vec2(sdRoundBox(bb, vec3(len,0.012,wid*(1.0 - 0.45*t)), 0.01), M_DARK));
    r = U(r, vec2(length(q - vec3(0.0,top + 0.075,0.0)) - mastR*1.3, M_METAL));
    return r;
}

#if VARIANT == 0
//A：いまの形(灰色の箱・白い縁の四角い目・上に3本のプロペラ)
vec2 map(vec3 p){
    vec2 r = vec2(sdRoundBox(p, BODY_B, BODY_R), M_BODY);
    vec3 e = p - vec3(0.0,0.06,0.66); e.x = abs(e.x) - 0.36;
    float bez = sdRoundBox(e, vec3(0.19,0.19,0.045), 0.035);
    bez = max(bez, -sdBox(e - vec3(0.0,0.0,0.05), vec3(0.125,0.125,0.08)));
    r = U(r, vec2(bez, M_BEZEL));
    r = U(r, vec2(sdRoundBox(e - vec3(0.0,0.0,-0.01), vec3(0.13,0.13,0.03), 0.015), M_LENS));
    r = U(r, vec2(length(p - vec3(0.0,-0.56,0.18)) - 0.15, M_LENS));
    r = U(r, vec2(sdCylY(p - vec3(0.0,-0.57,0.18), 0.19, 0.03) - 0.008, M_METAL));
    r = U(r, rotor(p, vec3(-0.58,0.56,0.26), 0.50, 0.4, 0.42, 0.06, 0.04));
    r = U(r, rotor(p, vec3( 0.58,0.56,0.26), 0.50, 2.0, 0.42, 0.06, 0.04));
    r = U(r, rotor(p, vec3( 0.00,0.56,-0.32), 0.68, 1.1, 0.42, 0.06, 0.04));
    r = U(r, vec2(length(p - vec3(0.62,0.32,-0.66)) - 0.05, M_LED));
    r = U(r, vec2(length(p - vec3(-0.62,0.32,-0.66)) - 0.05, M_LED));
    return r;
}
#elif VARIANT == 1
//B：つやのある白い機体・黒いバイザーに光る目・4本の腕とプロペラガード
vec2 arm(vec3 p, float sx, float sz, float ang){
    vec3 m = vec3(sx*0.82, 0.16, sz*0.46);
    vec2 r = vec2(sdCapsule(p, vec3(sx*0.45,0.12,sz*0.25), m - vec3(0.0,0.02,0.0), 0.055), M_BODY);
    r = U(r, vec2(sdCylY(p - m, 0.085, 0.07) - 0.01, M_METAL));
    r = U(r, vec2(sdTorusY(p - m - vec3(0.0,0.06,0.0), 0.30, 0.022), M_TRIM));
    r = U(r, vec2(sdCapsule(p, m + vec3(0.0,0.03,0.0), m + vec3(sx*0.212,0.06,sz*0.212), 0.016), M_TRIM));
    vec3 b = p - m - vec3(0.0,0.1,0.0); b.xz = rot(b.xz, ang);
    float t = clamp(abs(b.x)/0.27,0.0,1.0);
    vec3 bb = b; bb.y -= sign(b.x)*b.z*0.25;
    r = U(r, vec2(sdRoundBox(bb, vec3(0.27,0.01,0.05*(1.0 - 0.4*t)), 0.008), M_DARK));
    r = U(r, vec2(length(p - m - vec3(0.0,0.1,0.0)) - 0.04, M_METAL));
    return r;
}
vec2 map(vec3 p){
    vec2 r = vec2(sdRoundBox(p, BODY_B, BODY_R), M_BODY);
    r = U(r, vec2(sdRoundBox(p - vec3(0.0,0.04,0.42), vec3(0.60,0.27,0.22), 0.16), M_GLASS));
    r = U(r, vec2(sdCylY(p - vec3(0.0,0.5,-0.12), 0.2, 0.03) - 0.02, M_TRIM));
    r = U(r, arm(p,  1.0,  1.0, 0.3));
    r = U(r, arm(p, -1.0,  1.0, 1.4));
    r = U(r, arm(p,  1.0, -1.0, 2.2));
    r = U(r, arm(p, -1.0, -1.0, 0.9));
    r = U(r, vec2(length(p - vec3(0.0,-0.47,0.22)) - 0.14, M_LENS));
    r = U(r, vec2(sdCylY(p - vec3(0.0,-0.48,0.22), 0.18, 0.025) - 0.01, M_METAL));
    return r;
}
#elif VARIANT == 2
//C：重たい作業機械(角ばった鉄の箱・黄色と黒の帯・奥まったランプの目・脚)
vec2 map(vec3 p){
    float body = sdRoundBox(p, BODY_B, BODY_R);
    vec3 e = p - vec3(0.0,0.04,0.68); e.x = abs(e.x) - 0.36;
    body = max(body, -sdBox(e, vec3(0.15,0.12,0.07)));
    vec2 r = vec2(body, M_BODY);
    r = U(r, vec2(sdRoundBox(p - vec3(0.0,0.60,-0.06), vec3(0.66,0.08,0.48), 0.04), M_BODY));
    r = U(r, vec2(sdRoundBox(p - vec3(0.0,0.25,0.72), vec3(0.74,0.045,0.08), 0.025), M_TRIM));
    r = U(r, vec2(sdBox(e - vec3(0.0,0.0,-0.04), vec3(0.15,0.12,0.02)), M_EYE));
    for(int i=0; i<2; i++){
        float sx = i == 0 ? -1.0 : 1.0;
        r = U(r, vec2(sdCapsule(p, vec3(sx*0.5,-0.5, 0.35), vec3(sx*0.64,-0.80, 0.35), 0.035), M_DARK));
        r = U(r, vec2(sdCapsule(p, vec3(sx*0.5,-0.5,-0.35), vec3(sx*0.64,-0.80,-0.35), 0.035), M_DARK));
        r = U(r, vec2(sdCapsule(p, vec3(sx*0.64,-0.82,-0.55), vec3(sx*0.64,-0.82,0.58), 0.04), M_TRIM));
    }
    r = U(r, rotor(p, vec3(-0.60,0.62,0.30), 0.46, 0.6, 0.43, 0.08, 0.055));
    r = U(r, rotor(p, vec3( 0.60,0.62,0.30), 0.46, 2.3, 0.43, 0.08, 0.055));
    r = U(r, rotor(p, vec3( 0.00,0.66,-0.36), 0.60, 1.4, 0.43, 0.08, 0.055));
    r = U(r, vec2(length(p - vec3(0.0,1.31,-0.36)) - 0.045, M_LED));
    return r;
}
#else
//D：元の絵のテイスト(暗い灰色の箱・黒い縁と白い枠の四角い目・細い棒の先の平たいプロペラ・角の黒いガード)
vec2 map(vec3 p){
    vec2 r = vec2(sdRoundBox(p, BODY_B, BODY_R), M_BODY);
    //上のふた(少し明るい灰色)
    r = U(r, vec2(sdRoundBox(p - vec3(0.0,0.52,0.0), vec3(0.91,0.08,0.58), 0.07), M_TRIM));
    //角のガード(黒いゴム)
    r = U(r, vec2(sdRoundBox(abs(p) - vec3(0.87,0.48,0.54), vec3(0.1), 0.05), M_DARK));
    //目：黒い台・白い枠・黒いレンズ
    vec3 e = p - vec3(0.0,0.08,0.62); e.x = abs(e.x) - 0.42;
    r = U(r, vec2(sdRoundBox(e, vec3(0.215,0.215,0.03), 0.025), M_DARK));
    float fr = sdRoundBox(e - vec3(0.0,0.0,0.03), vec3(0.165,0.165,0.03), 0.015);
    fr = max(fr, -sdBox(e - vec3(0.0,0.0,0.05), vec3(0.105,0.105,0.1)));
    r = U(r, vec2(fr, M_BEZEL));
    r = U(r, vec2(sdRoundBox(e - vec3(0.0,0.0,0.015), vec3(0.11,0.11,0.03), 0.01), M_LENS));
    //細い棒と平たいプロペラ(後ろの1本だけ高い)
    r = U(r, rotor(p, vec3(-0.72,0.58,0.22), 0.78, 0.12, 0.32, 0.04, 0.03));
    r = U(r, rotor(p, vec3( 0.72,0.58,0.22), 0.78, -0.1, 0.32, 0.04, 0.03));
    r = U(r, rotor(p, vec3( 0.00,0.58,-0.30), 0.92, 0.05, 0.32, 0.04, 0.03));
    return r;
}
#endif

vec3 calcNormal(vec3 p){
    const vec2 k = vec2(1.0,-1.0);
    const float h = 0.0008;
    return normalize(k.xyy*map(p + k.xyy*h).x + k.yyx*map(p + k.yyx*h).x + k.yxy*map(p + k.yxy*h).x + k.xxx*map(p + k.xxx*h).x);
}
float softShadow(vec3 ro, vec3 rd){
    float res = 1.0, t = 0.02;
    for(int i=0; i<56; i++){
        float h = map(ro + rd*t).x;
        res = min(res, 10.0*h/t);
        t += clamp(h,0.01,0.15);
        if(res < 0.002 || t > 4.0) break;
    }
    return clamp(res,0.0,1.0);
}
float calcAO(vec3 p, vec3 n){
    float o = 0.0, s = 1.0;
    for(int i=0; i<5; i++){ float h = 0.01 + 0.07*float(i); o += (h - map(p + n*h).x)*s; s *= 0.75; }
    return clamp(1.0 - 2.4*o,0.0,1.0);
}

//カメラから見た向きのまわりの明るさ(スタジオの照明。カメラに対して固定なので、どの向きでも光の当たり方がそろう)
vec3 envCam(vec3 d){
    vec3 c = mix(vec3(0.05,0.05,0.06), vec3(0.40,0.43,0.50), smoothstep(-0.4,0.7,d.y));
    c += vec3(2.4,2.3,2.15)*smoothstep(0.80,0.93, dot(d, normalize(vec3(-0.55,0.75,0.45))));
    c += vec3(0.9,1.1,1.4)*smoothstep(0.82,0.95, dot(d, normalize(vec3(0.8,0.25,-0.5))));
    c += vec3(0.6)*smoothstep(0.90,0.99, dot(d, normalize(vec3(0.6,0.5,0.6))));
    return c;
}
vec3 toCam(vec3 d){ return vec3(dot(d,camR), dot(d,camU), dot(d,camC)); }
float line(float x, float w){ return 1.0 - smoothstep(w*0.5, w, abs(x)); }

struct Mat { vec3 alb; float metal; float rough; vec3 emit; };

Mat getMat(float m, vec3 po, vec3 no){
    Mat t; t.alb = vec3(0.5); t.metal = 0.0; t.rough = 0.4; t.emit = vec3(0.0);
    vec3 q = abs(po) - (BODY_B - BODY_R);
    //角のまるみにいるか(2方向以上はみ出している＝ふち)
    float edge = smoothstep(-0.02,0.03,q.x) + smoothstep(-0.02,0.03,q.y) + smoothstep(-0.02,0.03,q.z);
    if(m < M_BODY + 0.5){
#if VARIANT == 0
        t.alb = vec3(0.60,0.62,0.65)*(0.9 + 0.18*fbm(po*4.0));
        t.rough = 0.42 + 0.15*noise(po*20.0);
        float wear = smoothstep(1.6,2.4,edge)*smoothstep(0.55,0.68,fbm(po*14.0 + 2.0))*0.8;
        t.alb = mix(t.alb, vec3(0.80,0.80,0.78), wear); t.metal = wear; t.rough = mix(t.rough,0.28,wear);
        t.alb *= 1.0 - 0.3*smoothstep(0.55,0.8,fbm(po*3.0 + 5.0))*smoothstep(0.1,-0.5,po.y);
        float s = 0.0;
        if(no.y < 0.6) s = max(s, line(po.y - 0.24, 0.02));
        if(no.y > 0.6) s = max(s, line((max(abs(po.x)/0.42, abs(po.z + 0.02)/0.30) - 1.0)*0.3, 0.012));
        if(no.z < -0.6) s = max(s, line((max(abs(po.x)/0.5, abs(po.y + 0.05)/0.28) - 1.0)*0.4, 0.012));
        if(abs(no.x) > 0.6 && po.z > -0.42 && po.z < 0.22 && po.y > -0.36 && po.y < 0.04)
            s = max(s, 0.8*smoothstep(0.22,0.12,abs(fract(po.z/0.075) - 0.5)));
        if(no.z > 0.6){
            float d = length(abs(po.xy) - vec2(0.74,0.42));
            float sc = smoothstep(0.036,0.028,d);
            t.alb = mix(t.alb, vec3(0.75), sc); t.metal = max(t.metal, sc);
            s = max(s, sc*line(d - 0.03, 0.008));
        }
        t.alb *= 1.0 - 0.65*s;
#elif VARIANT == 1
        t.alb = vec3(0.93,0.93,0.92)*(0.96 + 0.06*fbm(po*5.0));
        t.rough = 0.22;
        float s = 0.0;
        if(no.y < 0.5) s = max(s, line(po.y + 0.12, 0.012));
        if(no.y > 0.6) s = max(s, line((length(po.xz - vec2(0.0,-0.12)) - 0.3), 0.012));
        t.alb *= 1.0 - 0.45*s;
        //横の差し色の線
        if(abs(no.x) > 0.5 && abs(po.y + 0.2) < 0.035) t.alb = vec3(0.95,0.42,0.08);
#elif VARIANT == 2
        t.alb = vec3(0.26,0.28,0.29)*(0.85 + 0.3*fbm(po*5.0));
        t.metal = 0.5; t.rough = 0.48 + 0.2*noise(po*25.0);
        //黄色と黒の帯(横と後ろの下側)
        if(no.y < 0.5 && no.z < 0.5 && po.y > -0.42 && po.y < -0.2){
            float st = step(0.5, fract((po.x + po.z + po.y)/0.16));
            t.alb = mix(vec3(0.05), vec3(0.92,0.66,0.08), st); t.metal = 0.0; t.rough = 0.5;
        }
        float wear = smoothstep(1.2,2.0,edge)*smoothstep(0.38,0.6,fbm(po*11.0));
        wear = max(wear, 0.35*smoothstep(0.74,0.8,noise(vec3(po.x*40.0,po.y*3.0,po.z*40.0))));
        t.alb = mix(t.alb, vec3(0.78,0.77,0.74), wear); t.metal = mix(t.metal,1.0,wear); t.rough = mix(t.rough,0.3,wear);
        t.alb *= 1.0 - 0.35*smoothstep(0.5,0.85,fbm(po*2.5 + 9.0));
        //リベット
        if(no.z > 0.6 || no.z < -0.6){
            vec2 g = vec2(abs(po.x), po.y);
            float d = min(length(vec2(mod(g.x + 0.075,0.15) - 0.075, abs(g.y) - 0.46)), 1.0);
            float rv = smoothstep(0.026,0.018,d);
            t.alb = mix(t.alb, vec3(0.6), rv); t.metal = max(t.metal, rv); t.rough = mix(t.rough,0.25,rv);
        }
        if(no.y < 0.6) t.alb *= 1.0 - 0.6*line(po.y - 0.4, 0.02);
#else
        //暗い灰色の塗装。ごく細かい地の揺らぎと、角だけうっすら明るく(塗装のすれ)
        t.alb = vec3(0.27,0.28,0.30)*(0.95 + 0.1*fbm(po*6.0));
        t.rough = 0.36 + 0.08*noise(po*vec3(4.0,60.0,4.0));
        float rub = smoothstep(1.5,2.3,edge)*smoothstep(0.45,0.7,fbm(po*16.0));
        t.alb = mix(t.alb, vec3(0.5,0.51,0.52), 0.4*rub);
#endif
    }else if(m < M_LENS + 0.5){
        t.alb = vec3(0.015); t.rough = 0.05;
#if VARIANT == 3
        //元の絵と同じ、目の左上の小さなハイライト
        if(no.z > 0.5){
            vec2 uv = vec2(po.x - sign(po.x)*0.42, po.y - 0.08) - vec2(-0.05,0.05);
            vec2 dq = abs(uv) - vec2(0.028);
            float d = length(max(dq,0.0)) + min(max(dq.x,dq.y),0.0);
            t.emit = vec3(0.55)*smoothstep(0.006,-0.006,d);
        }
#endif
    }else if(m < M_DARK + 0.5){
        t.alb = vec3(0.06,0.065,0.07); t.rough = 0.35;
    }else if(m < M_METAL + 0.5){
        t.alb = vec3(0.86,0.85,0.83); t.metal = 1.0; t.rough = 0.2 + 0.12*noise(po*vec3(80.0,6.0,80.0));
    }else if(m < M_BEZEL + 0.5){
        t.alb = vec3(0.9,0.9,0.87); t.rough = 0.3;
    }else if(m < M_GLASS + 0.5){
        t.alb = vec3(0.02,0.025,0.03); t.rough = 0.06;
        if(no.z > 0.15){
            vec2 uv = po.xy - vec2(0.0,0.06); uv.x = abs(uv.x) - 0.30;
            vec2 dq = abs(uv) - vec2(0.09);
            float d = length(max(dq,0.0)) + min(max(dq.x,dq.y),0.0) - 0.025;
            float scan = 0.82 + 0.18*step(0.5, fract(po.y*45.0));
            t.emit = vec3(0.35,0.9,1.3)*(smoothstep(0.006,-0.006,d)*1.7*scan + exp(-max(d,0.0)*30.0)*0.3);
        }
    }else if(m < M_LED + 0.5){
        t.alb = vec3(0.4,0.05,0.05); t.rough = 0.2; t.emit = vec3(2.6,0.25,0.15);
    }else if(m < M_TRIM + 0.5){
#if VARIANT == 1
        t.alb = vec3(0.96,0.45,0.1); t.rough = 0.3;
#elif VARIANT == 3
        t.alb = vec3(0.36,0.37,0.39)*(0.96 + 0.08*fbm(po*6.0)); t.rough = 0.32;
#else
        t.alb = vec3(0.9,0.64,0.1); t.rough = 0.45;
        float wear = smoothstep(0.55,0.7,fbm(po*12.0));
        t.alb = mix(t.alb, vec3(0.7,0.7,0.68), wear); t.metal = wear;
#endif
    }else{
        //奥まったランプの目：横の格子ごしに光る
        vec2 uv = po.xy - vec2(0.0,0.04); uv.x = abs(uv.x) - 0.36;
        float slat = smoothstep(0.30,0.42,abs(fract(uv.y/0.048) - 0.5)*2.0);
        float core = 1.0 - smoothstep(0.0,0.17,length(uv*vec2(0.8,1.0)));
        t.alb = vec3(0.05); t.rough = 0.3;
        t.emit = vec3(1.9,0.95,0.25)*(0.35 + 1.3*core)*(1.0 - 0.75*slat);
    }
    t.alb = pow(t.alb, vec3(2.2));
    return t;
}

vec3 shade(vec3 p, vec3 rd, float m){
    vec3 n = calcNormal(p);
    Mat mt = getMat(m, p, n);
    vec3 V = -rd, L = Lw;
    float ndl = max(dot(n,L),0.0);
    float sh = ndl > 0.0 ? softShadow(p + n*0.004, L) : 0.0;
    float ao = calcAO(p,n);
    vec3 nc = toCam(n);
    float ndv = max(dot(n,V),0.0);
    vec3 F0 = mix(vec3(0.04), mt.alb, mt.metal);
    vec3 F = F0 + (1.0 - F0)*pow(1.0 - ndv,5.0)*(1.0 - 0.8*mt.rough);
    vec3 kd = mt.alb*(1.0 - mt.metal);
    vec3 keyCol = vec3(1.25,1.18,1.08)*1.5;
    vec3 diff = kd*(keyCol*ndl*sh + vec3(0.30,0.34,0.42)*(0.55 + 0.45*nc.y)*ao + vec3(0.10,0.08,0.06)*max(-nc.y,0.0)*ao);
    vec3 H = normalize(L + V);
    float shin = 2.0/max(mt.rough*mt.rough,0.002);
    float spec = pow(max(dot(n,H),0.0), shin)*(shin + 8.0)/25.0;
    vec3 sp = keyCol*spec*F*ndl*sh;
    vec3 rc = toCam(reflect(rd,n));
    vec3 env = mix(envCam(rc), envCam(normalize(mix(rc,nc,0.6))), mt.rough);
    vec3 refl = env*F*ao;
    vec3 Rim = normalize(0.8*camR + 0.2*camU - 0.6*camC);
    float rim = pow(1.0 - ndv,3.0)*max(dot(n,Rim),0.0);
    return diff + sp + refl + vec3(0.6,0.75,1.0)*rim*0.5*ao + mt.emit;
}

//当たらなかったときは、いちばん近づいた距離を返す(ふちどりに使う)
vec2 march(vec3 ro, vec3 rd){
    float t = 0.0, near = 1e9;
    for(int i=0; i<160; i++){
        vec2 h = map(ro + rd*t);
        near = min(near, h.x);
        if(h.x < 0.0006) return vec2(t,h.y);
        t += h.x*0.8;
        if(t > 12.0) break;
    }
    return vec2(-1.0,near);
}

vec3 tone(vec3 x){
    x = (x*(2.51*x + 0.03))/(x*(2.43*x + 0.59) + 0.14);
    return pow(clamp(x,0.0,1.0), vec3(1.0/2.2));
}

void main(){
    camC = vec3(cos(uElev)*sin(uYaw), sin(uElev), cos(uElev)*cos(uYaw));
    camR = normalize(cross(-camC, vec3(0.0,1.0,0.0)));
    camU = cross(camR, -camC);
    vec3 Lc = normalize(vec3(-0.55,0.75,0.45));
    Lw = normalize(Lc.x*camR + Lc.y*camU + Lc.z*camC);
    vec3 tgt = vec3(0.0,uCy,0.0);
    vec4 acc = vec4(0.0);
    const int SS = 1;   //重ねがけはせず、大きく描いてから縮める(1回の処理が重いとGPUが止まる)
    for(int sy=0; sy<SS; sy++) for(int sx=0; sx<SS; sx++){
        vec2 off = (vec2(sx,sy) + 0.5)/float(SS) - 0.5;
        vec2 uv = ((gl_FragCoord.xy + off)/uRes*2.0 - 1.0)*uHalf;
        vec3 ro = tgt + camR*uv.x + camU*uv.y + camC*6.0;
        vec3 rd = -camC;
        vec2 h = march(ro, rd);
        if(h.x > 0.0) acc += vec4(tone(shade(ro + rd*h.x, rd, h.y)), 1.0);
        else if(h.y < OUTLINE) acc += vec4(INK,1.0);
    }
    outColor = acc/float(SS*SS);
}
</script>

<script>
//--- 候補 ---
var VARIANTS = [
    { id:"A", name:"A(保留)：いまの形を作り込む",
      desc:"灰色の箱・白い縁の四角い目・上の3本のプロペラという今の形のまま、塗装・継ぎ目・ねじ・角の塗装はげまで描き込む。",
      half:1.3, cy:0.3 },
    { id:"B", name:"B(保留)：つやのある白いドローン",
      desc:"白くてつやのある丸い機体に、黒いバイザーと青く光る四角い目。4本の腕の先にオレンジのガード付きプロペラ。今の形からは大きく変わる。",
      half:1.25, cy:0.0 },
    { id:"C", name:"C(保留)：使い込まれた作業機械",
      desc:"角ばった鉄の箱に黄色と黒の帯、リベット、はげた塗装。目はひさしの奥でオレンジに光るランプ。下に着地用の脚。",
      half:1.3, cy:0.24 },
    { id:"D", name:"D：元の絵のテイストで質感を上げる",
      desc:"暗い灰色の箱・黒い縁と白い枠の四角い目・細い棒の先の平たいプロペラ・角の黒いガードという元の絵の作りのまま、塗装のつや・角のすれ・ふちどりで質感を上げる。",
      half:1.26, cy:0.46 }
];
//向き：名前・水平の向き(度)・カメラの高さ(度)
var VIEWS = [["正面",0,15],["上へ",0,-25],["下へ",0,55],["左へ",67.5,15],["右へ",-67.5,15],["後ろ",180,15]];
var OLD = ["front2","up","down","left","right","back"];
var KIN_COLORS = ["80,140,230","60,170,110","220,160,30","150,90,210","230,100,60"];
var F = 160;    //1コマの大きさ(ゲームの40pxの4倍)
var SUPER = 3;  //この倍の大きさで描いてから縮める(ふちをなめらかにする)
var STRIPS = 32; //1回で描く帯の数(1回の処理が重すぎるとGPUが止まる)

var glc = document.createElement("canvas");
glc.width = glc.height = F*SUPER;
var gl = glc.getContext("webgl2", { preserveDrawingBuffer:true, premultipliedAlpha:true, antialias:false });

function compile(_v){
    function sh(_type,_src){
        var s = gl.createShader(_type);
        gl.shaderSource(s,_src);
        gl.compileShader(s);
        if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
    }
    var fs = document.getElementById("fs").textContent.trim().replace("precision highp float;", "precision highp float;\n#define VARIANT " + _v);
    var pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, document.getElementById("vs").textContent.trim()));
    gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    return pr;
}
var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);

//1コマ描いて、2Dキャンバスに写して返す
function render(_vi,_yaw,_elev,_out,_super){
    var S = _super || SUPER, W = F*S;
    var v = VARIANTS[_vi];
    if(!v.prog) v.prog = compile(_vi);
    var pr = v.prog;
    gl.useProgram(pr);
    var loc = gl.getAttribLocation(pr,"p");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    gl.viewport(0,0,W,W);
    gl.clearColor(0,0,0,0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(gl.getUniformLocation(pr,"uRes"),W,W);
    gl.uniform1f(gl.getUniformLocation(pr,"uYaw"),_yaw*Math.PI/180);
    gl.uniform1f(gl.getUniformLocation(pr,"uElev"),_elev*Math.PI/180);
    gl.uniform1f(gl.getUniformLocation(pr,"uHalf"),v.half);
    gl.uniform1f(gl.getUniformLocation(pr,"uCy"),v.cy);
    gl.enable(gl.SCISSOR_TEST);
    for(var i=0; i<STRIPS; i++){
        var y0 = Math.floor(W*i/STRIPS), y1 = Math.floor(W*(i + 1)/STRIPS);
        gl.scissor(0,y0,W,y1 - y0);
        gl.drawArrays(gl.TRIANGLES,0,3);
        gl.finish();
    }
    gl.disable(gl.SCISSOR_TEST);
    var c = _out || document.createElement("canvas");
    c.width = c.height = F;
    var g = c.getContext("2d");
    g.clearRect(0,0,F,F);
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
    g.drawImage(glc,0,glc.height - W,W,W,0,0,F,F);
    return c;
}
//ゲームと同じ色違い(絵のある部分だけに色を重ねる)
function tinted(_img,_color){
    var c = document.createElement("canvas");
    c.width = _img.width; c.height = _img.height;
    var g = c.getContext("2d");
    g.drawImage(_img,0,0);
    g.globalCompositeOperation = "source-atop";
    g.fillStyle = "rgba(" + _color + ",0.6)";
    g.fillRect(0,0,c.width,c.height);
    return c;
}
function el(_tag,_cls,_parent,_text){
    var e = document.createElement(_tag);
    if(_cls) e.className = _cls;
    if(_text) e.textContent = _text;
    if(_parent) _parent.appendChild(e);
    return e;
}
function viewBox(_parent,_label,_node){
    var d = el("div","view",_parent);
    d.appendChild(_node);
    el("div","",d,_label);
}
//戦闘画面(白地に方眼)と、ストーリー画面(暗い空)に、ゲーム中の大きさで置いてみる
function sceneCanvas(_frames,_dark){
    var c = el("canvas");
    c.width = 430; c.height = 120;
    var g = c.getContext("2d");
    if(_dark){
        var gr = g.createLinearGradient(0,0,0,120);
        gr.addColorStop(0,"#0b1020"); gr.addColorStop(1,"#26304a");
        g.fillStyle = gr; g.fillRect(0,0,430,120);
    }else{
        g.fillStyle = "#fff"; g.fillRect(0,0,430,120);
        g.strokeStyle = "#f0f0f0"; g.beginPath();
        for(var x=0; x<=430; x+=30){ g.moveTo(x + 0.5,0); g.lineTo(x + 0.5,120); }
        for(var y=0; y<=120; y+=30){ g.moveTo(0,y + 0.5); g.lineTo(430,y + 0.5); }
        g.stroke();
    }
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
    if(_dark){
        //ストーリーのように大きく(3倍)
        g.drawImage(_frames[0],10,0,120,120);
        g.drawImage(tinted(_frames[0],"190,20,30"),150,0,120,120);
        g.drawImage(tinted(_frames[3],KIN_COLORS[0]),300,20,80,80);
    }else{
        //戦闘中と同じ40px(6方向)と、色違い(同胞5色・ドローン君改)
        for(var i=0; i<6; i++) g.drawImage(_frames[i],10 + i*44,12,40,40);
        for(var i=0; i<5; i++) g.drawImage(tinted(_frames[0],KIN_COLORS[i]),10 + i*44,66,40,40);
        g.drawImage(tinted(_frames[0],"190,20,30"),280,10,100,100);
    }
    return c;
}

//#only=D のように開くと、その案だけを出す
var only = (location.hash.match(/only=(\w)/) || [])[1];
function buildPage(){
    var cards = document.getElementById("cards");
    //いまの絵
    var card = el("div","card",cards);
    el("h2","",card,"いまの絵(40×40px)");
    var vs = el("div","views",card);
    for(var i=0; i<6; i++){
        var im = new Image();
        im.src = "../images/game/Drone/Drone_" + OLD[i] + ".png";
        viewBox(vs,VIEWS[i][0],im);
    }
    for(var vi=0; vi<VARIANTS.length; vi++){
        if(only && VARIANTS[vi].id != only) continue;
        var v = VARIANTS[vi];
        card = el("div","card",cards);
        el("h2","",card,v.name);
        el("div","desc",card,v.desc);
        vs = el("div","views",card);
        var frames = [];
        for(var i=0; i<6; i++){
            var c = render(vi,VIEWS[i][1],VIEWS[i][2]);
            frames.push(c);
            viewBox(vs,VIEWS[i][0],c);
        }
        var row = el("div","row",card);
        var a = el("div","",row); a.appendChild(sceneCanvas(frames,false)); el("div","cap",a,"戦闘画面での大きさ(上：6方向／下：同胞の色違い／右：ドローン君改を拡大)");
        var b = el("div","",row); b.appendChild(sceneCanvas(frames,true)); el("div","cap",b,"ストーリー画面(3倍)");
        //ぐるっと回す
        var spin = el("canvas","",row);
        spin.width = spin.height = 120;
        spin.style.background = "radial-gradient(circle at 50% 40%,#f7f7f5,#cfd2d6)";
        v.spin = spin;
    }
    var t0 = performance.now();
    function loop(){
        var a = (performance.now() - t0)*0.06;
        for(var vi=0; vi<VARIANTS.length; vi++){
            if(!VARIANTS[vi].spin) continue;
            var s = VARIANTS[vi].spin;
            var f = render(vi,a,15 + 25*Math.sin(a*0.013),VARIANTS[vi].tmp || (VARIANTS[vi].tmp = document.createElement("canvas")),1);
            var g = s.getContext("2d");
            g.clearRect(0,0,120,120);
            g.drawImage(f,0,0,120,120);
        }
        //撮影用(#still)は1コマだけ描いて止める。回し続けるとヘッドレスの撮影が終わらない
        if(!still) requestAnimationFrame(loop);
    }
    var still = location.hash.indexOf("still") >= 0;
    loop();
}

//全方向を1枚にまとめる(横：水平の向き16段 × 縦：カメラの高さ5段)
var BAKE_YAWS = 16, BAKE_ELEVS = [-25,-5,15,35,55];
function bake(_id){
    var vi = 0;
    for(var i=0; i<VARIANTS.length; i++) if(VARIANTS[i].id == _id) vi = i;
    var sheet = document.createElement("canvas");
    sheet.width = F*BAKE_YAWS; sheet.height = F*BAKE_ELEVS.length;
    var g = sheet.getContext("2d");
    for(var r=0; r<BAKE_ELEVS.length; r++){
        for(var k=0; k<BAKE_YAWS; k++){
            g.drawImage(render(vi,k*360/BAKE_YAWS,BAKE_ELEVS[r]),k*F,r*F);
        }
    }
    document.getElementById("bake").textContent = sheet.toDataURL("image/png");
}

//#big：絵を2倍で並べて細かいところを見る
if(location.hash.indexOf("big") >= 0) document.head.insertAdjacentHTML("beforeend","<style>.view canvas,.view img{width:320px;height:320px}</style>");
try{
    var m = location.hash.match(/bake=(\w)/);
    if(m) bake(m[1]); else buildPage();
}catch(e){
    document.body.insertAdjacentHTML("afterbegin","<pre style='color:red'>" + e.message + "</pre>");
}
</script>
