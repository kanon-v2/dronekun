<!DOCTYPE html>
<!--
  協力プレイの長い通し(手で流す。run-smoke.ps1 からは流さない)
  ふたりとも自動プレイで、ほんとうに被弾しながら何WAVEも進め、ふたりとも倒れる → コンティニューをくり返す。
  止まった・食い違ったときに見えるよう、数秒ごとのようすを <pre id="result"> に書く。
  #waves=7 で進めるWAVEの数、lv=20 で能力のレベル、diff=0 で難易度、nodie で倒す確認を飛ばす(自然に倒れたときだけコンティニュー)
-->
<html lang="ja"><head><meta charset="UTF-8"><title>ドローン君 協力プレイの長い通し</title>
<style>body{margin:0} iframe{width:480px;height:270px;border:1px solid #888}</style></head>
<body>
<iframe id="host" name="host" src="coop-frame.html"></iframe><iframe id="guest" name="guest" src="coop-frame.html"></iframe>
<pre id="result">running...</pre>
<script>
var frames = { host:document.getElementById("host").contentWindow, guest:document.getElementById("guest").contentWindow };
var st = { host:null, guest:null };
var out = [], fails = 0;
function L(s){ out.push(s); }
function check(name, ok, detail){ if(!ok) fails++; L((ok ? "OK   " : "NG   ") + name + (detail ? "  (" + detail + ")" : "")); document.getElementById("result").textContent = out.concat(["running..."]).join(String.fromCharCode(10)); }   //途中で固まっても、どこまで進んだか見えるように
function cmd(who, m){ frames[who].postMessage(m, "*"); }

//------------------------------------------------ 偽PeerJSの中継(仲介サーバーと通信路の代わり)
var ids = {};   //PeerのID → そのPeerがいる画面
function toFrame(win, m){ m.fp = true; m.toFrame = true; win.postMessage(m, "*"); }
window.addEventListener("message", function(ev){
    var m = ev.data;
    if(!m) return;
    if(m.st){ st[m.name] = m; return; }
    if(!m.fp || m.toFrame) return;
    var src = ev.source;
    switch(m.type){
        case "register":
            if(ids[m.id] && ids[m.id] != src) toFrame(src, { type:"error", peer:m.id, etype:"unavailable-id" });
            else { ids[m.id] = src; toFrame(src, { type:"open", peer:m.id }); }
            break;
        case "connect":
            if(!ids[m.to]){ toFrame(src, { type:"error", peer:m.id, etype:"peer-unavailable" }); break; }
            toFrame(ids[m.to], { type:"incoming", peer:m.to, from:m.id, cid:m.cid });
            setTimeout(function(){ toFrame(src, { type:"connopen", cid:m.cid }); }, 5);
            break;
        case "data":
        case "close":
            if(ids[m.to]) toFrame(ids[m.to], { type:m.type, cid:m.cid, d:m.d });
            break;
        case "destroy":
            delete ids[m.id];
            break;
    }
});

//------------------------------------------------ 手順
//cond が成り立つまで待つ(最大 ms ミリ秒)
function waitFor(cond, ms, then){
    var t0 = Date.now();
    var iv = setInterval(function(){
        var ok = false;
        try{ ok = st.host && st.guest && cond(); }catch(e){}
        if(ok || Date.now() - t0 > ms){ clearInterval(iv); then(ok, Date.now() - t0); }
    }, 50);
}
function vsDesc(){ return ["host","guest"].map(function(k){ var v = st[k] && st[k].vs; return v ? k + ":p" + st[k].page + " " + v.ph + v.r + " hp" + Math.round(v.hp*10)/10 + " " + v.res : k + ":-"; }).join(" / "); }
function both(f){ return f(st.host) && f(st.guest); }
function desc(){ return ["host","guest"].map(function(k){ var s = st[k]; return s ? k + ":p" + s.page + " w" + s.wave + (s.active ? " active" : "") + (s.msg ? " 「" + s.msg + "」" : "") : k + ":-"; }).join(" / "); }


function opt(n, d){ var m = location.hash.match(new RegExp(n + "=(\\d+)")); return m ? Number(m[1]) : d; }
var WAVES = opt("waves", 7), LV = opt("lv", 20), DIFF = opt("diff", 0), NODIE = /nodie/.test(location.hash);
function dd(k){ var s = st[k]; if(!s) return k + ":-"; var d = s.dbg; return k[0] + ":p" + s.page + " w" + s.wave + " " + d.st + " hp" + d.hp + (s.down ? " DOWN" + d.dT : "") + " pd" + d.pd + " rd" + d.rd + "/" + d.prd + " cn" + d.cn + " n" + d.n + " pr" + s.pr + " parts" + s.parts + (s.errors.length ? " ERR" + s.errors.length : ""); }
var t0 = Date.now(), lastSig = "", same = 0;
setInterval(function(){
    if(!st.host || !st.guest) return;
    var sig = dd("host") + " | " + dd("guest");
    L("  [" + Math.round((Date.now() - t0)/1000) + "s] " + sig);
    document.getElementById("result").textContent = out.concat(["running..."]).join(String.fromCharCode(10));
}, 5000);
//ふたりともゲームオーバー画面なら、ふたりともコンティニュー
function rescue(){ if(both(function(s){ return s.page == 3; })){ L("  (ゲームオーバー → コンティニュー)"); cmd("host", { cmd:"continue" }); cmd("guest", { cmd:"continue" }); } }
function goWave(target, ms, then){
    var iv = setInterval(rescue, 3000);
    waitFor(function(){ return both(function(s){ return s.wave >= target && s.page == 1; }); }, ms, function(ok, t){ clearInterval(iv); then(ok, t); });
}
var steps = [
    function(next){ waitFor(function(){ return true; }, 5000, function(){ cmd("host", { cmd:"create", diff:DIFF }); next(); }); },
    function(next){
        waitFor(function(){ return st.host.waiting && st.host.code; }, 5000, function(){
            cmd("guest", { cmd:"join", code:st.host.code });
            waitFor(function(){ return both(function(s){ return s.active && s.page == 2; }); }, 8000, function(ok){ check("参加", ok, desc()); next(); });
        });
    },
    function(next){
        ["host","guest"].forEach(function(k){ cmd(k, { cmd:"natural", on:true, lv:LV }); cmd(k, { cmd:"auto" }); });
        cmd("guest", { cmd:"gear", w:["gun","laser","missile"] });
        cmd("guest", { cmd:"rewardWait", f:opt("rwait", 240) });     //ゲストは報酬をゆっくり選ぶ
        cmd("host", { cmd:"rewardWait", f:0 });
        next();
    }
];
for(var w=2; w<=WAVES; w++) (function(w){
    steps.push(function(next){
        goWave(w, 400000, function(ok, t){ check("WAVE" + (w - 1) + "をクリアしてWAVE" + w + "へ(ほんとうに被弾しながら)", ok, desc() + " " + Math.round(t/1000) + "秒"); next(); });
    });
})(w);
//ふたりとも倒れる(ゲストが先 → ホスト)→ コンティニュー → もう一度(ホストが先 → ゲスト)
function dieBoth(first, second, label){
    return function(next){
        waitFor(function(){ return both(function(s){ return s.page == 1 && s.dbg.st == "play"; }); }, 30000, function(){
            var w0 = st.host.wave;
            cmd(first, { cmd:"dieOne" });
            setTimeout(function(){
                cmd(second, { cmd:"dieOne" });
                waitFor(function(){ return both(function(s){ return s.page == 3; }); }, 15000, function(ok){
                    check(label + "：ふたりとも倒れてゲームオーバー", ok, desc());
                    cmd("host", { cmd:"continue" }); cmd("guest", { cmd:"continue" });
                    waitFor(function(){ return both(function(s){ return s.page == 1 && s.wave == w0; }); }, 30000, function(ok2){
                        check(label + "：コンティニューで同じWAVE" + w0 + "から", ok2, desc()); next();
                    });
                });
            }, 800);    //相方が復活する(COOP_REVIVE_TIME)より前に。テストの画面は1秒に約250コマ進む
        });
    };
}
if(!NODIE){
steps.push(dieBoth("guest", "host", "ゲストが先に倒れる"));
steps.push(dieBoth("host", "guest", "ホストが先に倒れる"));
steps.push(function(next){
    //片方が倒れ、相方が10秒生き残って復活 → そのあとふたりとも倒れる
    cmd("guest", { cmd:"dieOne" });
    waitFor(function(){ return st.guest.extra.revived > 0; }, 20000, function(ok){
        check("ゲストが倒れて10秒で復活", ok, dd("guest"));
        next();
    });
});
steps.push(dieBoth("host", "guest", "復活のあと"));
}
steps.push(function(next){
    var w = st.host.wave + 2;
    goWave(w, 600000, function(ok, t){ check("コンティニューのあとも2WAVE進む", ok, desc() + " " + Math.round(t/1000) + "秒"); next(); });
});
steps.push(function(next){
    var x = st.guest.extra;
    check("ゲストが報酬を選んでいる間に、ホストだけ先に出撃しない", !x.leftBehind, "取り残されたコマ" + (x.leftBehind || 0) + " " + (x.leftAt || "") + " 選んだ報酬 ホスト" + (st.host.extra.rewards || 0) + "・ゲスト" + (x.rewards || 0));
    next();
});
steps.push(function(next){
    var errs = st.host.errors.concat(st.guest.errors);
    check("スクリプトエラーなし", errs.length == 0, errs.join(" | "));
    next();
});
function run(i){
    if(i < steps.length){ steps[i](function(){ run(i + 1); }); return; }
    cmd("host", { cmd:"stop" }); cmd("guest", { cmd:"stop" });
    L(fails ? "RESULT: NG " + fails : "RESULT: OK");
    document.getElementById("result").textContent = out.join("\n");
}
window.addEventListener("load", function(){ run(0); });
</script>
</body></html>
