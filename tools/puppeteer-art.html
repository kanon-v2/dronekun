<!DOCTYPE html>
<!--
  傀儡師(ボスの試作。scripts/drone/puppeteer.js)の見た目の確認
  ゲームと同じ動きで戦いを進め、4つの場面(第1幕・投げつけの構え・第2幕と味方・一斉反撃)を1枚に並べる。
  ヘッドレスEdgeで撮る：msedge --headless=new --disable-gpu --allow-file-access-from-files --virtual-time-budget=3000
                        --window-size=1920,1080 --screenshot=<出力.png> file:///.../tools/puppeteer-art.html
  #only=番号(0～3) で1場面だけを等倍で出す(--window-size=960,540)
  #pup2d で前の図形の絵(Blender の絵を使わない)。#fire でドローン君が撃つ(装備の見た目の確認)
-->
<html lang="ja"><head><meta charset="UTF-8"><base href="../"><title>傀儡師の見た目</title>
<style>body{margin:0;background:#888}#Bigbox{position:absolute;left:-9999px}#out{display:block}</style></head>
<body><div id="Bigbox"><canvas id="Canvas"></canvas></div><canvas id="out"></canvas><pre id="log"></pre>
<script>
var errors = [];
window.addEventListener("error", function(e){ errors.push(e.message + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno); });
//乱数を決まった種から出す(毎回同じ結果にする。乱数の運でたまに落ちる項目をなくすため)。#seed=数 で種を変えられる
(function(){
    var m = /seed=(\d+)/.exec(location.hash), a = m ? +m[1] : 20261017;
    Math.random = function(){
        a = (a + 0x6D2B79F5) | 0;
        var t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0)/4294967296;
    };
})();
</script>
<script src="scripts/drone/common.js"></script>
<script src="scripts/drone/sound.js"></script>
<script src="scripts/drone/bgmTrial.js"></script>
<script>
//ふつうに遊ぶときは Suno の曲だが、テストは今の曲で行う(録音の曲を読み込まない・曲に合わせて動く最終局面にしない)
var bgmDefault = { finale:bgmTrial.finales[bgmTrial.finale].v, fight:bgmTrial.fightName() };
bgmTrial.finale = 0; bgmTrial.fight = 0;
</script>
<script src="scripts/drone/bgmFull.js"></script>
<script src="scripts/drone/equipment.js"></script>
<script src="scripts/drone/armsExtra.js"></script>
<script src="scripts/drone/bosses.js"></script>
<script src="scripts/drone/startScreen.js"></script>
<script src="scripts/drone/titleArt.js"></script>
<script src="scripts/drone/mainScreen.js"></script>
<script src="scripts/drone/forces.js"></script>
<script src="scripts/drone/enemyArt.js"></script>
<script src="scripts/drone/upgradeScreen.js"></script>
<script src="scripts/drone/gameoverScreen.js"></script>
<script src="scripts/drone/story.js"></script>
<script src="scripts/drone/battleBg.js"></script>
<script src="scripts/drone/bgScene.js"></script>
<script src="scripts/drone/bossDebug.js"></script>
<script src="scripts/drone/timeStop.js"></script>
<script src="scripts/drone/dodge.js"></script>
<script src="scripts/drone/rival.js"></script>
<script src="scripts/drone/rivalTime.js"></script>
<script src="scripts/drone/shotLab.js"></script>
<script src="scripts/drone/finaleSync.js"></script>
<script src="scripts/drone/finaleTriumph.js"></script>
<script src="scripts/drone/gunship.js"></script>
<script src="scripts/drone/puppeteer.js"></script>
<script src="scripts/drone/puppetStage.js"></script>
<script src="scripts/drone/emotion.js"></script>
<script src="scripts/drone/emotionHint.js"></script>
<script src="lib/peerjs.min.js"></script>
<script src="scripts/drone/coop.js"></script>

<script src="scripts/drone/draw.js"></script>
<script>
sound.mute = true;
var only = /only=(\d)/.exec(location.hash);
var outC = document.getElementById("out"), octx = outC.getContext("2d");
outC.width = only ? CW : CW*2; outC.height = only ? CH : CH*2;
var shotN = 0;
function snap(_label){
    document.getElementById("log").textContent += "snap " + _label + " f" + frames + "\n";
    var n = shotN++;
    if(only && +only[1] != n) return;
    ctx.fillStyle = "white"; ctx.fillRect(0,0,CW,CH); screens[page.number].draw();
    var x = only ? 0 : (n % 2)*CW, y = only ? 0 : Math.floor(n/2)*CH;
    octx.drawImage(canvas, 0, 0, canvas.width, canvas.height, x, y, CW, CH);
    if(!only){ octx.fillStyle = "rgba(0,0,0,0.6)"; octx.fillRect(x, y + CH - 26, 260, 26); octx.fillStyle = "#fff"; octx.font = "bold 15px sans-serif"; octx.fillText(_label, x + 8, y + CH - 8); }
}
var frames = 0;
function steer(){
    frames++; MouseIn = true;
    MouseX = 480 + 220*Math.cos(frames/70); MouseY = 400 + 60*Math.sin(frames/50);
}
function step(_n,_until){
    for(var i=0; i<_n; i++){ steer(); mainScreen.update(); if(_until && _until()) return true; }
    return false;
}
function boss(){ return enemies.filter(function(e){ return e.type == "puppeteer"; })[0]; }
function pups(){ return enemies.filter(function(e){ return e.type == "puppet" && !e.dead; }); }
//ドローン君は撃たない(人形の糸がすぐ切れて、場面が進みすぎないように)
var hold = !/fire/.test(location.hash), hold0 = special.holdFire;     //#fire なら撃つ(装備の見た目の確認。場面は進みやすい)
special.holdFire = function(){ return hold || hold0.apply(this, arguments); };
//Blender の絵(images/game/puppeteer/)を読み込んでから撮る(#pup2d なら図形の絵)
function waitArt(){
    var a = puppeteer.baked.ready(), s = puppetStage.ready();      //どちらも呼んで読み込みを始める
    if(/pup2d/.test(location.hash) || (a || puppeteer.baked.left < 0) && (s || puppetStage.left < 0)) droneSkin.prepare(STAGE_SKIN, run);
    else setTimeout(waitArt, 50);
}
setTimeout(waitArt, 0);
//#film：傀儡師の動きをコマ送りで並べる(上2段：攻撃の前のため → 身を乗り出す → 戻る。下の段：高笑い)
function film(){
    bossDebug.god = true; bossDebug.puppeteer = true; bossDebug.start(10);
    step(3000, function(){ var b = boss(); return b && b.mode == "act" && b.sub == "rest"; });
    var b = boss();
    outC.width = 1200; outC.height = 690;
    octx.fillStyle = "#222"; octx.fillRect(0, 0, outC.width, outC.height);
    var shot = function(_n, _label){
        ctx.fillStyle = "white"; ctx.fillRect(0,0,CW,CH); screens[page.number].draw();
        var x = (_n % 4)*300, y = Math.floor(_n/4)*230;
        if(/film=act/.test(location.hash)) octx.drawImage(canvas, 0, 0, CW*renderScale, CH*renderScale, x, y, 300, 169);
        else octx.drawImage(canvas, 120*renderScale, 30*renderScale, 680*renderScale, 510*renderScale, x, y, 300, 225);
        octx.fillStyle = "#fff"; octx.font = "bold 13px sans-serif"; octx.fillText(_label, x + 6, y + 16);
    };
    var n = 0;
    if(/film=act/.test(location.hash)){
        //幕間(緞帳が下りて舞台が変わる)と、最後のあがきで明かされる影
        puppeteer.bound().forEach(function(p){ p.hp = p.maxHp = 1e9; });
        b.count = 99999;
        b.stage = 2;
        [8, 30, 50, 75].forEach(function(at, i){ step(at - (i ? [8,30,50][i - 1] : 0)); shot(n++, "幕間 f" + at); });
        step(60); b.count = 99999; shot(n++, "第二幕");
        b.stage = 3; step(110); b.count = 99999; shot(n++, "第三幕");
        b.mode = "last"; b.count = 9999; puppeteer.twist = { t:0, x:b.x, cut:-1 };
        [40, 90, 150, 230].forEach(function(at, i){ step(at - (i ? [40,90,150][i - 1] : 0)); shot(n++, "影 f" + at); });
        puppeteer.twist.cut = 0; step(20); shot(n++, "糸が切れる");
        step(60); shot(n++, "影が退く");
        return;
    }
    if(/film=atk/.test(location.hash)){
        //手の攻撃：叩きつけ・なぎ払い・つまみ取り・指はじきを3コマずつ
        puppeteer.bound().forEach(function(p){ p.hp = p.maxHp = 1e9; });
        b.count = 99999;
        [["slam",[30,64,80]],["sweep",[30,58,70]],["grab",[60,84,92]],["flick",[25,40,52]]].forEach(function(a){
            puppeteer.stopHands(b);
            puppeteer.handAttack(b, a[0], false);
            var f = 0;
            a[1].forEach(function(at){ step(at - f); f = at; shot(n++, a[0] + " f" + at); });
            step(200, function(){ return !puppeteer.handBusy(b); });
        });
        return;
    }
    b.antic = PUP_ANTIC_T; b.sub = "film"; b.lastSub = "film";
    for(var i=0; i<8; i++){ shot(n++, "ため・乗り出し f" + i*6); step(6); }
    b.laugh = PUP_LAUGH_T;
    for(var i=0; i<4; i++){ step(5); shot(n++, "高笑い f" + i*5); }
}
function run(){
if(/film/.test(location.hash)){ try{ film(); }catch(ex){ document.getElementById("log").textContent += "EX " + ex.message; } return; }
try{
bossDebug.god = true;
bossDebug.puppeteer = true;
bossDebug.start(10);
//第1幕：人形が吊られて、傀儡師が見下す
step(3000, function(){ var b = boss(); return b && b.mode == "act" && b.sub == "volley" && b.count < 60; });
snap("第1幕：人形を盾にする");
//投げつけの構え(合図の光)
step(3000, function(){ return pups().some(function(p){ return p.mode == "wind" && p.count == 8; }); });
snap("投げつけの構え");
//2体解放して第2幕へ
pups().forEach(function(p){ mainScreen.hitEnemy(p, 999); });
step(3000, function(){ var b = boss(); return b && b.mode == "stun"; });
step(60);
var b = boss(); b.hp = b.maxHp*0.5;
step(3000, function(){ var b = boss(); return b && b.mode == "act" && b.sub == "thread" && puppeteer.threads.length && puppeteer.threads[0].t == 40; });
var ps = pups(); mainScreen.hitEnemy(ps[0], ps[0].hp*0.6); mainScreen.hitEnemy(ps[1], ps[1].hp*0.3);
step(1);
snap("第2幕：味方と糸の斬撃");
//第3幕 → 一斉反撃
pups().forEach(function(p){ mainScreen.hitEnemy(p, 999); });
step(3000, function(){ var b = boss(); return b && b.mode == "stun"; });
step(3000, function(){ var b = boss(); if(b && b.mode == "solo" && b.pat > 0) b.hp = Math.min(b.hp, b.maxHp*0.19); return b && b.mode == "last"; });
step(50);
mainScreen.blast();
step(PUP_RALLY_CUT + 40);
snap("一斉反撃");
}catch(ex){ document.getElementById("log").textContent += "EX " + ex.message + " " + ex.stack; }
document.getElementById("log").textContent += "shots " + shotN + " errors " + errors.join(" / ");
}
</script>
</body></html>
