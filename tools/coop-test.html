<!DOCTYPE html>
<!--
  協力プレイの動作確認
  ゲームを2つ(ホスト・ゲスト)iframe で開き、偽のPeerJS(tools/fake-peer.js)の通信をこのページが中継する。
  部屋を作る → コード違いで入れない → コードで入る → プロローグ → 強化 → 出撃 → WAVEクリアがそろう → 切断 を確かめる。
  tools/run-smoke.ps1 からヘッドレスで開き、結果を <pre id="result"> に書き出す。
-->
<html lang="ja"><head><meta charset="UTF-8"><title>ドローン君 協力プレイのテスト</title>
<style>body{margin:0} iframe{width:480px;height:270px;border:1px solid #888}</style></head>
<body>
<iframe id="host" name="host" src="coop-frame.html"></iframe><iframe id="guest" name="guest" src="coop-frame.html"></iframe>
<pre id="result">running...</pre>
<script>
var frames = { host:document.getElementById("host").contentWindow, guest:document.getElementById("guest").contentWindow };
var st = { host:null, guest:null };
var out = [], fails = 0;
function L(s){ out.push(s); }
function check(name, ok, detail){ if(!ok) fails++; L((ok ? "OK   " : "NG   ") + name + (detail ? "  (" + detail + ")" : "")); document.getElementById("result").textContent = out.concat(["running..."]).join(String.fromCharCode(10)); }   //途中で固まっても、どこまで進んだか見えるように
function cmd(who, m){ frames[who].postMessage(m, "*"); }

//------------------------------------------------ 偽PeerJSの中継(仲介サーバーと通信路の代わり)
var ids = {};   //PeerのID → そのPeerがいる画面
function toFrame(win, m){ m.fp = true; m.toFrame = true; win.postMessage(m, "*"); }
window.addEventListener("message", function(ev){
    var m = ev.data;
    if(!m) return;
    if(m.st){ st[m.name] = m; return; }
    if(!m.fp || m.toFrame) return;
    var src = ev.source;
    switch(m.type){
        case "register":
            if(ids[m.id] && ids[m.id] != src) toFrame(src, { type:"error", peer:m.id, etype:"unavailable-id" });
            else { ids[m.id] = src; toFrame(src, { type:"open", peer:m.id }); }
            break;
        case "connect":
            if(!ids[m.to]){ toFrame(src, { type:"error", peer:m.id, etype:"peer-unavailable" }); break; }
            toFrame(ids[m.to], { type:"incoming", peer:m.to, from:m.id, cid:m.cid });
            setTimeout(function(){ toFrame(src, { type:"connopen", cid:m.cid }); }, 5);
            break;
        case "data":
        case "close":
            if(ids[m.to]) toFrame(ids[m.to], { type:m.type, cid:m.cid, d:m.d });
            break;
        case "destroy":
            delete ids[m.id];
            break;
    }
});

//------------------------------------------------ 手順
//cond が成り立つまで待つ(最大 ms ミリ秒)
function waitFor(cond, ms, then){
    var t0 = Date.now();
    var iv = setInterval(function(){
        var ok = false;
        try{ ok = st.host && st.guest && cond(); }catch(e){}
        if(ok || Date.now() - t0 > ms){ clearInterval(iv); then(ok, Date.now() - t0); }
    }, 50);
}
function vsDesc(){ return ["host","guest"].map(function(k){ var v = st[k] && st[k].vs; return v ? k + ":p" + st[k].page + " " + v.ph + v.r + " hp" + Math.round(v.hp*10)/10 + " " + v.res : k + ":-"; }).join(" / "); }
function both(f){ return f(st.host) && f(st.guest); }
function desc(){ return ["host","guest"].map(function(k){ var s = st[k]; return s ? k + ":p" + s.page + " w" + s.wave + (s.active ? " active" : "") + (s.msg ? " 「" + s.msg + "」" : "") : k + ":-"; }).join(" / "); }

var COOP_MUTE_TEST = 25000;    //ホストの今のつながりから何も送らない時間(ミリ秒。COOP_TIMEOUT より短く、つなぎ直しより十分長く)
var COOP_LAG_SHOW = 2000;      //「通信が不安定です」を出し始める時間(coop.js と同じ)
var COOP_PAUSE_TEST = 12000;   //ゲストの画面を止める時間(ミリ秒。COOP_TIMEOUT より長く)
var steps = [
    function(next){
        waitFor(function(){ return true; }, 5000, function(){ cmd("host", { cmd:"create" }); next(); });
    },
    function(next){
        waitFor(function(){ return st.host.waiting && st.host.code; }, 5000, function(ok){
            check("部屋を作る(コードが出る)", ok, st.host.code); next();
        });
    },
    function(next){
        //ありえないコード(i・l は使わない文字なので、作られた部屋とぶつからない)
        cmd("guest", { cmd:"join", code:"iill" });
        waitFor(function(){ return st.guest.msg.indexOf("見つかりません") >= 0 && !st.guest.inRoom; }, 5000, function(ok){
            check("違うコードでは入れない", ok, st.guest.msg); next();
        });
    },
    function(next){
        cmd("guest", { cmd:"join", code:st.host.code.toUpperCase() });
        waitFor(function(){ return both(function(s){ return s.active && s.page == 2; }); }, 8000, function(ok){
            check("コードで入る → ふたりとも強化画面(ストーリーは流さない)", ok, desc()); next();
        });
    },
    function(next){
        cmd("host", { cmd:"auto", unarmed:true });   //ホストは武器なし：敵を倒せるのはゲストの攻撃だけにする
        cmd("guest", { cmd:"gear", w:["gun","gravity","tesla"] });   //重力弾の渦がホストの敵を吸い寄せるかも見る
        cmd("guest", { cmd:"auto" });
        waitFor(function(){ return both(function(s){ return s.page == 1 && s.wave == 1; }); }, 20000, function(ok){
            check("強化画面 → ふたりとも準備完了で出撃", ok, desc()); next();
        });
    },
    function(next){
        waitFor(function(){ return st.guest.partner && st.host.partner && st.guest.enemies > 0; }, 10000, function(ok){
            check("戦闘中に相手と敵が見える", ok, "ゲスト側の敵" + st.guest.enemies); next();
        });
    },
    function(next){
        //ゲストのウィンドウが隠れて描画が止まっても(状態を送れなくても)、生きている合図で切断とみなされない
        cmd("guest", { cmd:"pause", ms:COOP_PAUSE_TEST });
        setTimeout(function(){
            waitFor(function(){ return st.guest.page == 1; }, 3000, function(){
                var ok = st.host.partner && st.host.active && st.guest.active && st.host.msg.indexOf("途絶え") < 0;
                check("ゲストの画面が" + COOP_PAUSE_TEST/1000 + "秒止まっても切れない", ok, desc() + " 「" + st.host.msg + "」"); next();
            });
        }, COOP_PAUSE_TEST + 500);
    },
    function(next){
        //回線が途切れて前の経路が使えなくなった(ホストの今のつながりから、ずっと何も届かない)：
        //ゲストが「通信が不安定です」を出しながら同じ部屋へつなぎ直し、新しいつながりで続ける
        var lagMax = 0;
        cmd("host", { cmd:"mute", ms:COOP_MUTE_TEST });
        var iv = setInterval(function(){ lagMax = Math.max(lagMax, st.guest.lag || 0); }, 100);
        waitFor(function(){ return st.guest.rc >= 1 && st.host.rc >= 1 && st.guest.lag < 1000; }, COOP_MUTE_TEST, function(ok0, ms){
            clearInterval(iv);
            var ok = ok0 && lagMax >= COOP_LAG_SHOW && st.host.partner && st.guest.partner && st.host.active && st.guest.active;
            check("前の経路が使えなくなっても、つなぎ直して続ける", ok, "届かなかった最大" + Math.round(lagMax/100)/10 + "秒 つなぎ直し" + st.host.rc + "/" + st.guest.rc + " " + Math.round(ms/1000) + "秒で戻る " + desc());
            next();
        });
    },
    function(next){
        //回線が一瞬途切れて仲介サーバーとのつながりが切れても(PeerJS の "network" エラー)、相方との通信は閉じない
        cmd("host", { cmd:"netError" }); cmd("guest", { cmd:"netError" });
        setTimeout(function(){
            var ok = st.host.partner && st.guest.partner && st.host.active && st.guest.active && st.host.inRoom && st.guest.inRoom;
            check("仲介サーバーとのつながりが切れても、相方との通信は続く", ok, desc());
            next();
        }, 3000);
    },
    function(next){
        waitFor(function(){ return both(function(s){ return s.wave >= 2; }); }, 150000, function(ok, ms){
            check("WAVE1クリアがそろう", ok, desc() + " " + Math.round(ms/1000) + "秒");
            check("ゲストの攻撃がホストの敵に当たる", st.host.partnerHits > 0, st.host.partnerHits + "回");
            check("ゲストの重力弾の渦がホストの敵を吸い寄せる", st.host.extra.pull > 0, st.host.extra.pull + "回");
            next();
        });
    },
    function(next){
        waitFor(function(){ return both(function(s){ return s.page == 1 && s.wave == 2; }); }, 30000, function(ok){
            check("WAVE2へ一緒に出撃", ok, desc());
            //拾ったパーツはふたりとも受け取る(相手が拾った数が、自分にも足されている)。
            //拾った直後は相手にまだ届いていないことがあるので、数が合うまで少しだけ待つ(長く待つと WAVE2 が進んで、あとの確かめがずれる)
            var parts = function(){ var h = st.host, g = st.guest; return h.partnerParts == g.partsGot && g.partnerParts == h.partsGot; };
            waitFor(parts, 5000, function(ok2){
                var h = st.host, g = st.guest;
                check("拾ったパーツをふたりとも受け取る", ok2,
                      "ホストが拾った" + h.partsGot + "・ゲストが拾った" + g.partsGot + "　受け取り ホスト" + h.partnerParts + "・ゲスト" + g.partnerParts);
                next();
            });
        });
    },
    function(next){
        //ゲストのジャスト衝撃波が相方に届き、ホストが敵と弾をゆっくりにする
        var j0 = st.host.extra.justSlow;
        cmd("guest", { cmd:"just" });
        waitFor(function(){ return st.host.extra.justSlow > j0; }, 5000, function(ok){
            check("ゲストのジャスト衝撃波で、ホストの画面も同じようにゆっくりになる", ok && st.guest.just > 0, "ゲストのジャスト" + st.guest.just + "・ホストのスロー" + st.host.extra.justSlow);
            next();
        });
    },
    function(next){
        //ゲストのジャスト・カウンターが相方に届き、ホストが突進を弾き返す(ゲストにも弾き返した突進が見える)
        cmd("host", { cmd:"dasher" });
        cmd("guest", { cmd:"counter" });
        waitFor(function(){ return st.host.extra.counter > 0 && st.guest.extra.cSeen > 0; }, 5000, function(ok){
            check("ゲストのジャスト・カウンターで、ホストが突進を弾き返す", ok, "ホストが弾き返した" + st.host.extra.counter + "・ゲストに見えた" + st.guest.extra.cSeen);
            next();
        });
    },
    function(next){
        //ライバル(中ボス。rival.js)：ホストに出すと、ゲストにも見えて、ワープ(出発点・長さ)が届く
        cmd("host", { cmd:"rival" });
        waitFor(function(){ return st.guest.extra.rvSeen > 0 && st.guest.extra.rvWarp > 0; }, 12000, function(ok){
            check("ライバルがゲストにも見え、ワープが届く", ok, "見えた" + st.guest.extra.rvSeen + "・ワープ" + st.guest.extra.rvWarp);
            next();
        });
    },
    function(next){
        //ライバルの第二形態の分身：ゲストにも分身が見え、動き(分身の輪舞)が届く
        cmd("host", { cmd:"clones" });
        waitFor(function(){ return st.guest.extra.cloneSeen > 0; }, 8000, function(ok){
            check("ライバルの分身がゲストにも見える", ok, "見えた" + st.guest.extra.cloneSeen);
            next();
        });
    },
    function(next){
        //ライバルの中身・針の中身がゲストに写る(coopMirror.js)
        waitFor(function(){ return st.guest.extra.mirrored > 0 && st.guest.extra.needleX > 0; }, 8000, function(ok){
            check("ライバルと針の中身がゲストに写る", ok, "ライバル" + st.guest.extra.mirrored + "・針" + st.guest.extra.needleX);
            next();
        });
    },
    function(next){
        //ゲスト(P2)のドローン君は違う色(自分の画面でも、ホストの画面の相方としても)
        var ok = st.guest.tint && st.host.ptint == st.guest.tint && !st.host.tint && !st.guest.ptint;
        check("ゲスト(P2)のドローン君は違う色", ok, "ゲスト自分:" + st.guest.tint + " ホストから見た相方:" + st.host.ptint + " ホスト自分:" + st.host.tint);
        next();
    },
    function(next){
        //ホストだけ倒れる → ゲストが10秒生き残ると、ホストが耐久1で復活する
        cmd("host", { cmd:"dieOne" });
        waitFor(function(){ return st.host.extra.downSeen > 0 && st.host.extra.revived > 0 && !st.host.down && st.host.page == 1; }, 16000, function(ok, ms){
            check("倒れても、相方が10秒生き残ると復活する", ok, "倒れていた" + st.host.extra.downSeen + "コマ・復活" + st.host.extra.revived + " " + Math.round(ms/100)/10 + "秒 " + desc());
            next();
        });
    },
    function(next){
        //ゲストのジャスト回避(見切り)：ホストが敵と弾をゆっくりにする
        var p0 = st.host.extra.pslow;
        cmd("guest", { cmd:"dodgeJust" });
        waitFor(function(){ return st.host.extra.pslow > p0 + 10; }, 5000, function(ok){
            check("ゲストのジャスト回避で、ホストも見切りの演出になり、敵と弾がゆっくりになる", ok, "ゆっくりにしたコマ" + (st.host.extra.pslow - p0));
            next();
        });
    },
    function(next){
        //ホストのジャスト衝撃波・ジャスト回避で、ゲストの画面も同じ演出になる
        var j0 = st.guest.extra.justSlow, w0 = st.guest.extra.gWatch || 0;
        cmd("host", { cmd:"just" });
        setTimeout(function(){ cmd("host", { cmd:"dodgeJust" }); }, 2500);
        waitFor(function(){ return st.guest.extra.justSlow > j0 && (st.guest.extra.gWatch || 0) > w0 + 10; }, 9000, function(ok){
            check("ホストのジャスト衝撃波・ジャスト回避で、ゲストの画面も同じようにゆっくりの演出になる", ok, "ジャスト衝撃波" + (st.guest.extra.justSlow - j0) + "・見切りの演出" + ((st.guest.extra.gWatch || 0) - w0) + "コマ");
            next();
        });
    },
    function(next){
        //ゲストが回避で消した弾は、ホストの画面でも消える
        cmd("host", { cmd:"shoot", on:true });
        var tries = 0;
        var iv = setInterval(function(){ cmd("guest", { cmd:"dodgeClear" }); if(++tries > 20) clearInterval(iv); }, 300);
        waitFor(function(){ return st.host.extra.cleared > 0; }, 8000, function(ok){
            clearInterval(iv);
            cmd("host", { cmd:"shoot", on:false });
            check("ゲストが回避で消した弾を、ホストも消す", ok, "消えた弾" + st.host.extra.cleared);
            next();
        });
    },
    function(next){
        //ゲストの時止めワープ：ホストも止まった時の中に入り、ワープが終わると動き出す
        var s0 = st.host.extra.pStop;
        cmd("guest", { cmd:"warp" });
        waitFor(function(){ return st.host.extra.pStop > s0 + 20 && st.guest.ts == 0 && st.host.extra.pStop == (st.host.__last = st.host.extra.pStop) ; }, 15000, function(){
            setTimeout(function(){
                var stopped = st.host.extra.pStop - s0, ended = st.guest.ts == 0 && st.host.page == 1;
                check("ゲストが時を止めると、ホストも止まり、ワープのあと動き出す", stopped > 20 && ended, "ホストが止まっていたコマ" + stopped + " ゲストの段階" + st.guest.ts);
                next();
            }, 1500);
        });
    },
    function(next){
        //ホストの時止めワープ：ゲストも止まった時の中に入る
        var s0 = st.guest.extra.pStop;
        cmd("host", { cmd:"warp" });
        waitFor(function(){ return st.guest.extra.pStop > s0 + 20 && st.host.ts == 0; }, 15000, function(ok){
            check("ホストが時を止めると、ゲストも止まる", ok, "ゲストが止まっていたコマ" + (st.guest.extra.pStop - s0) + " ホストの段階" + st.host.ts);
            next();
        });
    },
    function(next){
        //最終局面(Suno)の始まり：第一形態が倒れ、曲の頭から再構築して第二形態になるまで、ゲストも止まらずに写る
        var t0 = st.guest.extra.gFinale, e0 = st.guest.errors.length;
        cmd("guest", { cmd:"songCheck" });
        cmd("host", { cmd:"finale", t:0 });
        waitFor(function(){ return st.guest.extra.gFinale > t0 + 30; }, 30000, function(ok){
            check("最終局面の再構築から第二形態まで、ゲストも止まらずに写る(曲の流し直しは1度だけ)", ok && st.guest.errors.length == e0 && st.guest.extra.songAsks == 1 && st.guest.page == 1,
                  "第二形態が写ったコマ" + (st.guest.extra.gFinale - t0) + "・曲を頼んだ回数" + st.guest.extra.songAsks + " " + desc() + " " + st.guest.errors.join(" | "));
            cmd("host", { cmd:"finaleOff" }); cmd("guest", { cmd:"finaleOff" });
            setTimeout(next, 500);
        });
    },
    function(next){
        //最終局面(Suno)：ゲストにも第二形態と曲の時刻が写り、迫ってくる改の突進をゲストのジャスト衝撃波で弾き返す
        cmd("host", { cmd:"finale", t:97 });
        waitFor(function(){ return st.guest.extra.gFinale > 30 && st.guest.extra.gParry > 0 && st.host.extra.fres; }, 30000, function(ok){
            var r = st.host.extra.fres;
            check("最終局面がゲストに写り、ゲストのジャスト衝撃波で改の突進を弾き返す", ok && (r == "perfect" || r == "just"),
                  "写ったコマ" + st.guest.extra.gFinale + "・ゲストの衝撃波" + st.guest.extra.gParry + "・ホストの判定" + r + " ホストの改" + st.host.extra.kaiLog + " 倒れた所" + st.host.extra.kaiDead);
            cmd("host", { cmd:"finaleOff" }); cmd("guest", { cmd:"finaleOff" });
            setTimeout(next, 500);
        });
    },
    function(next){
        //通しの確認：ライバル(WAVE19の強さ)を、第一形態 → 第二形態 → 時の前借り → 時ノ奔流まで。ゲストで例外が出ず、止まらない
        var e0 = st.guest.errors.length;
        cmd("host", { cmd:"tour", kind:"rival", lv:3 });
        var c0 = st.guest.extra.gClock || 0;
        waitFor(function(){ return st.host.extra.tourKind == "rival" && st.host.extra.tourT >= 7000; }, 90000, function(ok){
            var x = st.guest.extra;
            check("通し：ライバルの全段階(時戻しで自分も巻き戻されるのも)を、ゲストも止まらずに写す", ok && st.guest.errors.length == e0 && x.gClock > c0 + 5000 && /over/.test(x.gModeList) && /awaken/.test(x.gModeList) && /rstop/.test(x.gModeList) && x.gPull > 0,
                  "巻き戻された" + (x.gPull || 0) + "コマ 見えた動き" + x.gModes + "(" + x.gModeList + ") ゲストの進み" + (x.gClock - c0) + " " + st.guest.errors.slice(e0).join(" | ") + " ゲスト" + JSON.stringify(st.guest.dbg) + " ホスト" + JSON.stringify(st.host.dbg) + " ホストの進み" + st.host.extra.tourT);
            cmd("host", { cmd:"tourOff" }); cmd("guest", { cmd:"tourOff" });
            setTimeout(next, 500);
        });
    },
    function(next){
        //通しの確認：最終局面を曲の頭から最後の突進まで(区切りを飛ばし、体力の区切りのムービーも)。ゲストで例外が出ず、止まらない
        var e0 = st.guest.errors.length;
        cmd("host", { cmd:"finale", t:0 });
        cmd("host", { cmd:"tour", kind:"finale" });
        var c0 = st.guest.extra.gClock || 0;
        waitFor(function(){ return st.host.extra.tourKind == "finale" && st.host.extra.tourT >= 5600; }, 90000, function(ok){
            var x = st.guest.extra;
            check("通し：最終局面の全区切りを、ゲストも止まらずに写す", ok && st.guest.errors.length == e0 && x.gClock > c0 + 4000 && /tr:dawn/.test(x.gModeList) && /tr:last/.test(x.gModeList) && /tr:cut/.test(x.gModeList),
                  "見えた区切り(" + x.gModeList + ") ゲストの進み" + (x.gClock - c0) + " " + st.guest.errors.slice(e0).join(" | ") + " ゲスト" + JSON.stringify(st.guest.dbg) + " ホスト" + JSON.stringify(st.host.dbg) + " ホストの進み" + st.host.extra.tourT + " 改" + st.host.extra.kaiLog);
            cmd("host", { cmd:"tourOff" }); cmd("guest", { cmd:"tourOff" });
            setTimeout(next, 500);
        });
    },
    function(next){
        cmd("host", { cmd:"die" }); cmd("guest", { cmd:"die" });
        waitFor(function(){ return both(function(s){ return s.page == 3; }); }, 15000, function(ok){
            check("ふたりとも撃墜でゲームオーバー", ok, desc()); next();
        });
    },
    function(next){
        //やり直すWAVE2では、ゲストは追加の装備(燃やす・凍らせる・弾を防ぐ)を付ける
        cmd("guest", { cmd:"gear", w:["fire","freeze","barrier"] });
        //片方だけ押しても始まらない
        cmd("guest", { cmd:"continue" });
        setTimeout(function(){
            var waiting = both(function(s){ return s.page == 3; });
            cmd("host", { cmd:"continue" });
            waitFor(function(){ return both(function(s){ return s.page == 1 && s.wave == 2; }); }, 20000, function(ok){
                check("コンティニュー：ふたりとも押すとWAVE2からやり直す", waiting && ok, (waiting ? "" : "片方だけで始まった ") + desc()); next();
            });
        }, 1000);
    },
    function(next){
        var h0 = st.host.partnerHits;
        cmd("host", { cmd:"shoot", on:true });   //よける自動プレイでもバリアに当たるよう、ホストがゲストのすぐそばから撃つ
        waitFor(function(){ var x = st.host.extra; return x.burn > 0 && x.freeze > 0 && x.block > 0; }, 60000, function(ok, ms){
            var x = st.host.extra;
            cmd("host", { cmd:"shoot", on:false });
            check("ゲストの火炎放射・冷凍・バリアがホストに届く", ok && st.host.partnerHits > h0,
                  "燃やした" + x.burn + "・凍らせた" + x.freeze + "・バリアで消えた弾" + x.block + "(ゲストが防いだ" + st.guest.blocked + ")・当たった" + (st.host.partnerHits - h0) + "回 " + Math.round(ms/1000) + "秒");
            next();
        });
    },
    function(next){
        //出撃先：ホストが強化画面で WAVE1(クリア済み)を選ぶと、次の出撃はふたりとも WAVE1 になる
        cmd("host", { cmd:"replay", w:1 });
        cmd("host", { cmd:"winWave" });
        waitFor(function(){ return both(function(s){ return s.page == 1 && s.wave == 1 && s.pw == 1; }); }, 30000, function(ok){
            check("出撃先：ホストが選んだクリア済みのWAVEへ、ふたりとも出撃する", ok, desc() + " 出撃先 " + st.host.pw + "/" + st.guest.pw);
            var pr0 = { host:st.host.pr, guest:st.guest.pr };
            setTimeout(function(){ cmd("host", { cmd:"winWave" }); }, 1500);
            //クリアすると、ふたりとも報酬を1回もらって、選んだWAVEの次へ進む(ひとり用と同じ)
            waitFor(function(){ return both(function(s){ return s.wave == 2 && s.pw == 0; }); }, 30000, function(ok2){
                var got = st.host.pr == pr0.host + 1 && st.guest.pr == pr0.guest + 1;
                check("出撃先：クリアすると報酬をもらって、選んだWAVEの次へ進む", ok2 && got, desc() + " 報酬 " + pr0.host + "→" + st.host.pr + "/" + pr0.guest + "→" + st.guest.pr);
                next();
            });
        });
    },
    function(next){
        //最終決戦：WAVE20をクリアすると、ふたりの一騎打ち → 先に倒れた側は再構築して復活 → 決着 → エンディング
        cmd("host", { cmd:"setWave", w:20 }); cmd("guest", { cmd:"setWave", w:20 });
        cmd("host", { cmd:"arm", w:["gun","missile","tesla"], wl:4, lv:10 }); cmd("guest", { cmd:"arm", w:["laser","bug","fire"], wl:4, lv:10 });
        setTimeout(function(){ cmd("host", { cmd:"winWave" }); }, 500);
        waitFor(function(){ return both(function(s){ return s.page == 8 && s.duel.a; }); }, 30000, function(ok){
            check("WAVE20クリアで、ふたりの一騎打ちになる", ok, desc());
            waitFor(function(){ return both(function(s){ return s.duel.ph == "result"; }); }, 240000, function(ok2, ms){
                var h = st.host.duel, g = st.guest.duel, pair = h.res + "/" + g.res;
                check("一騎打ちの決着がつき、勝敗が食い違わない", ok2 && (pair == "win/lose" || pair == "lose/win" || pair == "draw/draw"), pair + " " + Math.round(ms/1000) + "秒 耐久" + Math.round(h.hp) + "/" + Math.round(g.hp) + " 戦い" + Math.round((st.host.extra.duelF || 0)/60) + "秒(最初に倒れるまで" + Math.round((st.host.extra.firstZero || 0)/60) + "秒)");
                var rb = (st.host.extra.rebuilt || st.guest.extra.rebuilt) && (st.host.extra.otherRebuilt || st.guest.extra.otherRebuilt);
                check("先に倒れた側が再構築して復活し、相手の画面にも見える", rb, "ホスト" + st.host.extra.rebuilt + "/" + st.host.extra.otherRebuilt + " ゲスト" + st.guest.extra.rebuilt + "/" + st.guest.extra.otherRebuilt);
                waitFor(function(){ return both(function(s){ return s.page == 5; }); }, 15000, function(ok3){
                    check("一騎打ちのあと、ふたりともエンディングへ", ok3, desc());
                    //進み具合・能力はホストのひとり用の記録に書き、ゲストは何も書かない
                    var hw = st.host.writes, gw = st.guest.writes;
                    var gKeys = Object.keys(gw).filter(function(k){ return /^dronekun_(save|meta|best|cleared|coop)/.test(k); });
                    check("記録：ホストはひとり用の記録に書き、ゲストは書かない", (hw.dronekun_meta || 0) > 0 && (hw.dronekun_save || 0) > 0 && !hw.dronekun_coop && gKeys.length == 0,
                          "ホスト:" + JSON.stringify(hw) + " ゲスト:" + JSON.stringify(gw));
                    next();
                });
            });
        });
    },
    function(next){
        cmd("guest", { cmd:"leave" });
        waitFor(function(){ return !st.host.partner && st.host.active && st.host.msg.indexOf("退出") >= 0; }, 12000, function(ok){
            check("ゲストが抜けるとホストはひとりで続ける", ok, st.host.msg + " partner=" + st.host.partner); next();
        });
    },
    function(next){
        //もう一度、部屋を作り直してつなぐ(今度はホストがハードを選ぶ。ゲストも同じ難易度になる)
        cmd("host", { cmd:"leave" });
        setTimeout(function(){ cmd("host", { cmd:"create", diff:2 }); }, 300);
        waitFor(function(){ return st.host.waiting && st.host.code; }, 5000, function(){
            cmd("guest", { cmd:"join", code:st.host.code });
            waitFor(function(){ return both(function(s){ return s.active; }); }, 8000, function(ok){
                check("作り直した部屋に入れる", ok, desc());
                waitFor(function(){ return both(function(s){ return s.diff == "hard"; }); }, 3000, function(ok2){
                    check("ホストが選んだ難易度にゲストも合わせる", ok2, "host:" + st.host.diff + " guest:" + st.guest.diff); next();
                });
            });
        });
    },
    function(next){
        cmd("host", { cmd:"leave" });
        waitFor(function(){ return st.guest.page == 0 && !st.guest.active && st.guest.notice; }, 12000, function(ok){
            check("ホストが抜けるとゲストはタイトルへ", ok, st.guest.notice || desc()); next();
        });
    },

    //------------------------------------------------ 対戦(versus.js)
    function(next){
        cmd("host", { cmd:"picks", p:["gun","missile","tesla"] });
        cmd("guest", { cmd:"picks", p:["laser","bug","blade"] });
        cmd("host", { cmd:"create", mode:"vs" });
        waitFor(function(){ return st.host.waiting && st.host.code; }, 5000, function(){
            cmd("guest", { cmd:"join", code:st.host.code });
            waitFor(function(){ return both(function(s){ return s.vs.a && s.page == 7; }); }, 8000, function(ok){
                check("対戦：コードで入る → ふたりとも装備選び", ok, vsDesc()); next();
            });
        });
    },
    function(next){
        //auto はまだ有効なので、準備OKを押して戦闘が始まる
        waitFor(function(){ return both(function(s){ return s.vs.ph == "fight" && s.vs.r == 1; }); }, 10000, function(ok){
            check("対戦：ふたりとも準備OKで戦闘開始", ok, vsDesc()); next();
        });
    },
    function(next){
        waitFor(function(){ return both(function(s){ return s.vs.ph == "result"; }); }, 200000, function(ok, ms){
            var h = st.host.vs, g = st.guest.vs;
            var pair = h.res + "/" + g.res;
            check("対戦：決着がつく", ok, vsDesc() + " 戦闘" + Math.round(h.ft/60) + "秒");
            check("対戦：勝敗が食い違わない", pair == "win/lose" || pair == "lose/win" || pair == "draw/draw", pair);
            check("対戦：おたがいの攻撃が届く", h.dealt > 0 && g.dealt > 0 && h.hp < h.mx && g.hp < g.mx,
                  "与えたダメージ " + h.dealt/10 + " / " + g.dealt/10);
            next();
        });
    },
    function(next){
        cmd("host", { cmd:"again" }); cmd("guest", { cmd:"again" });
        waitFor(function(){ return both(function(s){ return s.vs.ph == "fight" && s.vs.r == 2; }); }, 10000, function(ok){
            check("対戦：もう一度 → 第2戦", ok, vsDesc()); next();
        });
    },
    function(next){
        cmd("guest", { cmd:"leave" });
        waitFor(function(){ return st.host.page == 0 && !st.host.vs.a && st.host.notice; }, 12000, function(ok){
            check("対戦：相手が抜けるとタイトルへ", ok, st.host.notice || vsDesc()); next();
        });
    },
    function(next){
        check("送る状態の大きさが上限に収まる", st.host.extra.maxSize <= 12000*1.05, "いちばん大きいもの" + st.host.extra.maxSize + "バイト(うち写し" + st.host.extra.maxMirror + ")");
        var errs = st.host.errors.concat(st.guest.errors);
        check("スクリプトエラーなし", errs.length == 0, errs.join(" | "));
        next();
    }
];
function run(i){
    if(i < steps.length){ steps[i](function(){ run(i + 1); }); return; }
    cmd("host", { cmd:"stop" }); cmd("guest", { cmd:"stop" });
    L(fails ? "RESULT: NG " + fails : "RESULT: OK");
    document.getElementById("result").textContent = out.join("\n");
}
window.addEventListener("load", function(){ run(0); });
</script>
</body></html>
