<!DOCTYPE html>
<!--
  動作確認(スモークテスト)
  tools/run-smoke.ps1 からヘッドレスのブラウザで開き、結果を <pre id="result"> に書き出す。
  ブラウザで直接開いても実行できる(画面の下に結果が出る)。
-->
<html lang="ja"><head><meta charset="UTF-8"><base href="../"><!-- 画像などのパスをプロジェクト直下から解決する --><title>ドローン君 スモークテスト</title><style>body{margin:0}</style></head>
<body><div id="Bigbox"><canvas id="Canvas"></canvas></div><pre id="result">running...</pre>
<script>
var errors = [];
window.addEventListener("error", function(e){ errors.push(e.message + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno); });
</script>
<script src="scripts/drone/common.js"></script>
<script src="scripts/drone/sound.js"></script>
<script src="scripts/drone/equipment.js"></script>
<script src="scripts/drone/armsExtra.js"></script>
<script src="scripts/drone/bosses.js"></script>
<script src="scripts/drone/startScreen.js"></script>
<script src="scripts/drone/mainScreen.js"></script>
<script src="scripts/drone/forces.js"></script>
<script src="scripts/drone/enemyArt.js"></script>
<script src="scripts/drone/upgradeScreen.js"></script>
<script src="scripts/drone/gameoverScreen.js"></script>
<script src="scripts/drone/story.js"></script>
<script src="scripts/drone/bossDebug.js"></script>
<script src="scripts/drone/timeStop.js"></script>
<script src="lib/peerjs.min.js"></script>
<script src="scripts/drone/coop.js"></script>
<script src="scripts/drone/versus.js"></script>
<script src="scripts/drone/draw.js"></script>
<script>
var out = [], fails = 0;
function L(s){ out.push(s); }
function check(name, ok, detail){ if(!ok) fails++; L((ok ? "OK   " : "NG   ") + name + (detail ? "  (" + detail + ")" : "")); }
function draw1(){ ctx.fillStyle = "white"; ctx.fillRect(0,0,CW,CH); screens[page.number].draw(); }
var frames = 0;
//よけながら円を描いて飛ぶボット
function bot(){
    frames++; MouseIn = true;
    MouseX = 480 + 300*Math.cos(frames/60); MouseY = 270 + 170*Math.sin(frames/45);
    var tx = 0, ty = 0, list = enemyShots.concat(enemies.filter(function(e){ return !e.harmless; }));
    for(var i=0; i<list.length; i++){ var o = list[i], dx = drone.X - o.x, dy = drone.Y - o.y, d = Math.hypot(dx,dy) || 1, R = (o.r || 5) + 90; if(d < R){ tx += dx/d*(R-d); ty += dy/d*(R-d); } }
    if(tx || ty){ MouseX = drone.X + tx*2; MouseY = drone.Y + ty*2; }
    MouseX = Math.max(30, Math.min(CW-30, MouseX)); MouseY = Math.max(30, Math.min(CH-30, MouseY));
}
function skipStory(){ var n = 0; while(page.number == 4 && n < 300){ Click = 1; storyScreen.update(); Click = 0; n++; } }
function setup(w, owned, slots, lv){ save.clear(); game.reset(); game.wave = w; game.owned = owned; game.slots = slots; game.slotCount = 3; for(var k in game.level) game.level[k] = lv; game.seen = { prologue:true, s3:true, s5:true, s8:true, s10:true, s12:true, reveal:w > REVEAL_WAVE, s17:true, s19:true }; }

try{
    var keepSave = localStorage.getItem("dronekun_save"), keepBest = localStorage.getItem("dronekun_best"), keepClear = localStorage.getItem("dronekun_cleared");

    // 1. ストーリーと画面の流れ
    save.clear(); game.reset(); page.change(0); draw1();
    MouseIn = true; MouseX = startButton.X + 10; MouseY = startButton.Y + 10; Click = 1; startScreen.update(); Click = 0;
    check("はじめから → プロローグ", page.number == 4 && storyScreen.id == "prologue");
    draw1(); skipStory();
    check("プロローグ → WAVE1", page.number == 1 && game.wave == 1);
    var flow = [];
    [3,5,15,19].forEach(function(w){
        game.wave = w; page.change(1);
        enemies = []; mainScreen.toSpawn = 0; mainScreen.state = "clear"; mainScreen.stateTime = 149; mainScreen.update();
        flow.push(w + ":" + (page.number == 4 ? storyScreen.id : "-"));
        draw1(); skipStory();
    });
    check("WAVEクリア後のストーリー", flow.join(" ") == "3:s3 5:s5 15:reveal 19:s19", flow.join(" "));
    game.wave = FINAL_WAVE; page.change(1); enemies = []; mainScreen.toSpawn = 0; mainScreen.state = "clear"; mainScreen.stateTime = 149; mainScreen.update();
    skipStory(); draw1();
    check("WAVE20クリア → エンディング", page.number == 5);

    // 2. 通常の戦闘(序盤・人間との戦い・ボス)
    [[2,"序盤"],[17,"人間との戦い"],[5,"ボス 女王蜂"],[10,"ボス 移動要塞"],[20,"ボス ドローン君改"]].forEach(function(c){
        setup(c[0], { gun:3, missile:2, tesla:2 }, ["gun","missile","tesla"], 4);
        page.change(1); var f = 0, before = errors.length;
        while(page.number == 1 && f < 60*25){ bot(); f++; mainScreen.hp = 9; if(f % 200 == 0) Click = 1; mainScreen.update(); Click = 0; if(f % 10 == 0) draw1(); }
        check("戦闘 WAVE" + c[0] + "（" + c[1] + "）を25秒", errors.length == before, "敵" + enemies.length + " 弾" + enemyShots.length);
    });

    // 燃料切れ：遅くなり、ドローン君のまわりに知らせが出て、燃料が戻ると解除
    setup(2, { gun:1 }, ["gun",null,null], 1);
    page.change(1); mainScreen.update();
    mainScreen.fuel = 0.01; MouseX = drone.X + 200; MouseY = drone.Y;
    mainScreen.update(); mainScreen.update(); draw1();
    var outNow = mainScreen.fuelOut && drone.slow;
    mainScreen.fuel = FUEL_RESUME + 1; MouseX = drone.X; MouseY = drone.Y;
    mainScreen.update();
    check("燃料切れで遅くなり、回復で戻る", outNow && !mainScreen.fuelOut && !drone.slow);

    // ジャスト衝撃波：当たる直前の弾があればはね返して燃料が戻る。遠い弾だけならふつうの衝撃波
    setup(2, { gun:1 }, ["gun",null,null], 1);
    page.change(1); MouseIn = true;
    while(mainScreen.state != "play") mainScreen.update();
    enemies = []; enemyShots = [];
    var je = makeEnemy(pickEnemyType()); je.x = drone.X + 220; je.y = drone.Y; je.vx = je.vy = 0; je.hp = je.maxHp = 999; enemies.push(je);
    var je2 = makeEnemy(pickEnemyType()); je2.x = drone.X + 80; je2.y = drone.Y; je2.hp = je2.maxHp = 999; enemies.push(je2);     //衝撃波の範囲内の敵
    enemyShots.push({ x:drone.X - 200, y:drone.Y, vx:-3, vy:0, r:5 });     //遠ざかる弾
    mainScreen.maxFuel = 200; mainScreen.fuel = 100; mainScreen.blast();
    var normalOk = mainScreen.just == 0 && mainScreen.fuel == 100 - BLAST_COST && enemyShots.length == 1 && je2.hp == 999 - BLAST_DMG;
    enemies.splice(enemies.indexOf(je2),1);
    enemyShots = [{ x:drone.X - 30, y:drone.Y + 2, vx:4, vy:0, r:5 }, { x:drone.X + 50, y:drone.Y - 60, vx:0, vy:0, r:5 }];
    mainScreen.maxFuel = 200; mainScreen.fuel = 100; mainScreen.blast();
    var justBullets = arms.bullets.filter(function(b){ return b.just; }).length, jf = mainScreen.fuel, jn = mainScreen.just, jh = mainScreen.justSlow + "/" + mainScreen.justT;
    var justOk = mainScreen.just == 1 && mainScreen.fuel == Math.min(mainScreen.maxFuel, 100 - BLAST_COST + JUST_REFUND) && justBullets == 2 && mainScreen.justSlow > 0 && mainScreen.justT > 0;
    var st0 = mainScreen.stateTime, jerr = errors.length;
    for(var i=0; i<20; i++){ mainScreen.update(); if(i % 5 == 0) draw1(); }
    var slowOk = mainScreen.stateTime - st0 < 14;      //ゆっくりの間は20コマで14コマより少なく進む
    for(var i=0; i<80; i++){ mainScreen.update(); if(i % 5 == 0) draw1(); }
    check("衝撃波は周りの敵にダメージ(龍は出ない)。ジャスト衝撃波は直前の弾をはね返して敵に当て、燃料が戻り、ゆっくりになる(遠い弾だけならふつう)", normalOk && justOk && slowOk && mainScreen.justHits > 0 && je.hp < 999 && errors.length == jerr,
          "ふつう" + normalOk + " ジャスト" + justOk + " 反射" + justBullets + " 敵" + je.hp + " 燃料" + jf + " 回数" + jn + " ゆっくり" + jh + "/" + slowOk + " 命中" + mainScreen.justHits);

    // ジャスト・カウンター：ぶつかる直前の突進は、衝撃波で敵の方へ弾き返す(遠ざかる突進・虫はそのまま)
    setup(2, { gun:1 }, ["gun",null,null], 1);
    page.change(1); MouseIn = true;
    while(mainScreen.state != "play") mainScreen.update();
    enemies = []; enemyShots = []; MouseX = drone.X; MouseY = drone.Y;
    var kerr = errors.length;
    var kt = makeEnemy("bug"); kt.x = drone.X - 260; kt.y = drone.Y - 20; kt.vx = kt.vy = 0; kt.speed = 0; kt.hp = kt.maxHp = 999; enemies.push(kt);
    var kd = makeEnemy("dasher"); kd.x = drone.X + 40; kd.y = drone.Y; kd.timer = 0; kd.vx = -5; kd.vy = 0; enemies.push(kd);    //ぶつかる直前の突進
    var kf = makeEnemy("dasher"); kf.x = drone.X + 400; kf.y = drone.Y + 120; kf.timer = 0; kf.vx = 5; kf.vy = 0; enemies.push(kf);  //遠ざかる突進
    mainScreen.maxFuel = 200; mainScreen.fuel = 100; var kj = mainScreen.just;
    var kJust = mainScreen.isJust();
    mainScreen.blast();
    var kStart = mainScreen.just == kj + 1 && mainScreen.justRamN == 1 && kd.countered > 0 && kd.vx < 0 && !kf.countered;
    var kHp = mainScreen.hp, kScore = game.score;
    for(var i=0; i<300 && !kd.dead; i++){ mainScreen.update(); if(i % 10 == 0) draw1(); }
    var kHitT = kd.cHit && kd.cHit.indexOf(kt) >= 0;
    check("ジャスト・カウンター：ぶつかる直前の突進を敵へ弾き返し、通り道の敵にダメージ、最後は砕けて倒した扱い(ドローン君は無傷)",
          kJust && kStart && kHitT && kd.dead && kt.hp < 999 && mainScreen.hp == kHp && game.score > kScore && mainScreen.justHits > 0 && errors.length == kerr,
          "判定" + kJust + " 開始" + kStart + " 命中" + kHitT + " 砕けた" + kd.dead + " 敵" + kt.hp + " 体力" + kHp + "→" + mainScreen.hp + " 点" + kScore + "→" + game.score);

    // ジャスト・カウンター：人間のドローンも、ぶつかる直前なら弾き返す
    setup(16, { gun:1 }, ["gun",null,null], 1);
    page.change(1); MouseIn = true;
    while(mainScreen.state != "play") mainScreen.update();
    enemies = []; enemyShots = []; MouseX = drone.X; MouseY = drone.Y;
    var merr = errors.length;
    var mt = makeEnemy("panzer"); mt.x = drone.X - 260; mt.y = drone.Y - 20; mt.vx = mt.vy = 0; mt.speed = 0; mt.timer = 9999; mt.hp = mt.maxHp = 999; enemies.push(mt);
    var md = makeEnemy("mdrone"); md.x = drone.X + 40; md.y = drone.Y; md.vx = -2.2; md.vy = 0; enemies.push(md);    //ぶつかる直前の人間のドローン
    mainScreen.maxFuel = 200; mainScreen.fuel = 100;
    var mJust = mainScreen.isJust() && mainScreen.justRams[0] == md;
    mainScreen.blast();
    var mStart = mainScreen.justRamN == 1 && md.countered > 0 && md.vx < 0;
    var mHp = mainScreen.hp;
    for(var i=0; i<300 && !md.dead; i++){ mainScreen.update(); if(i % 10 == 0) draw1(); }
    check("ジャスト・カウンター：ぶつかる直前の人間のドローンも敵へ弾き返す(ドローン君は無傷)",
          mJust && mStart && md.dead && mt.hp < 999 && mainScreen.hp == mHp && errors.length == merr,
          "判定" + mJust + " 開始" + mStart + " 砕けた" + md.dead + " 敵" + mt.hp + " 体力" + mHp + "→" + mainScreen.hp);

    // かすりコンボ：かするとコンボが増えて威力が上がり、時間切れ・被弾で途切れる
    setup(2, { gun:1 }, ["gun",null,null], 1);
    page.change(1); MouseIn = true;
    while(mainScreen.state != "play") mainScreen.update();
    enemies = []; enemyShots = []; MouseX = drone.X; MouseY = drone.Y;
    var cerr = errors.length;
    enemyShots.push({ x:drone.X + 18, y:drone.Y, vx:0, vy:0, r:5 });    //当たらずにかすめる位置
    mainScreen.update();
    var grazed = mainScreen.combo == 1;
    for(var i=0; i<COMBO_TIERS[1] - 1; i++) mainScreen.addCombo();
    var tierOk = mainScreen.combo == COMBO_TIERS[1] && mainScreen.comboTier() == 2 && Math.abs(mainScreen.comboMul() - (1 + COMBO_TIERS[1]*COMBO_POWER)) < 1e-9;
    var ce = makeEnemy(pickEnemyType()); ce.hp = ce.maxHp = 999; enemies.push(ce);
    mainScreen.hitEnemy(ce,1,"gun");
    var mulOk = Math.abs((999 - ce.hp) - mainScreen.comboMul()) < 1e-9;
    draw1();
    for(var i=0; i<COMBO_TIME + 2; i++) mainScreen.comboStep();
    var timeOut = mainScreen.combo == 0 && mainScreen.comboEnd && !mainScreen.comboEnd.broke && mainScreen.comboBest == COMBO_TIERS[1];
    for(var i=0; i<5; i++) mainScreen.addCombo();
    mainScreen.hp = 99; mainScreen.invincible = 0; mainScreen.guard = 0; mainScreen.damage();
    var broke = mainScreen.combo == 0 && mainScreen.comboEnd && mainScreen.comboEnd.broke;
    draw1();
    check("かすりコンボ：かすると増えて威力が上がり、時間切れ・被弾で途切れる", grazed && tierOk && mulOk && timeOut && broke && errors.length == cerr,
          "かすり" + grazed + " 段階" + tierOk + " 威力" + mulOk + " 時間切れ" + !!timeOut + " 被弾" + !!broke);
    // かすりバースト：SKILL_EVERY コンボで金色の星を放ち、敵に当たる
    enemies = []; enemyShots = []; arms.bullets = []; mainScreen.combo = 0; mainScreen.hitStop = 0;
    var se = makeEnemy(pickEnemyType()); se.x = drone.X + 200; se.y = drone.Y - 80; se.vx = se.vy = 0; se.hp = se.maxHp = 999; enemies.push(se);
    var serr = errors.length;
    for(var i=0; i<SKILL_EVERY - 1; i++) mainScreen.addCombo();
    var before = arms.bullets.filter(function(b){ return b.skill; }).length;
    mainScreen.addCombo();
    var stars = arms.bullets.filter(function(b){ return b.skill; }).length;
    for(var i=0; i<90; i++){ mainScreen.update(); if(i % 10 == 0) draw1(); }
    // 星の数は賢さで増える(Lv1で8・Lv5で上限の20)
    var keepBrain = game.level.brain;
    game.level.brain = 1; var starsByBrain = mainScreen.skillShots();
    game.level.brain = 5; starsByBrain += "," + mainScreen.skillShots();
    game.level.brain = keepBrain;
    check("かすりバースト：" + SKILL_EVERY + "コンボで星を放ち(数は賢さで増える)、敵に当たる", before == 0 && stars == mainScreen.skillShots() && se.hp < 999 && starsByBrain == "8,20" && errors.length == serr,
          "星" + before + "→" + stars + " 賢さLv1/5で" + starsByBrain + " 敵" + Math.round(se.hp));
    // コンボの待ち時間：弾が濃くても、コンボは COMBO_CD ごとに1つしか増えない(かすりの数・燃料は毎回増える)
    enemies = []; enemyShots = []; arms.bullets = []; mainScreen.combo = 0; mainScreen.comboCd = 0; mainScreen.hitStop = 0;
    mainScreen.breakCombo(false); mainScreen.comboEnd = null;
    var cdErr = errors.length, cdGraze = mainScreen.graze, cdFrames = COMBO_CD*6;
    MouseX = drone.X; MouseY = drone.Y;
    for(var i=0; i<cdFrames; i++){
        enemyShots = [];
        for(var k=0; k<3; k++) enemyShots.push({ x:drone.X + 18, y:drone.Y, vx:0, vy:0, r:5 });
        mainScreen.update();
    }
    var cdGrazed = mainScreen.graze - cdGraze;
    enemyShots = []; arms.bullets = [];
    check("コンボの待ち時間：弾が濃くても、コンボは" + COMBO_CD + "フレームごとに1つだけ増える", mainScreen.combo == cdFrames/COMBO_CD && cdGrazed > cdFrames*2 && COMBO_CD*SKILL_EVERY > SKILL_GUARD && errors.length == cdErr,
          "コンボ" + mainScreen.combo + "(期待" + cdFrames/COMBO_CD + ") かすり" + cdGrazed);

    // ボスの登場：WARNINGから着地までは、ボスと演出以外は止まる。着地したら動き出す
    setup(5, { gun:2 }, ["gun",null,null], 2);
    page.change(1); MouseIn = true;
    var fz = 0; while(!mainScreen.bossFreeze && fz < 400){ mainScreen.update(); fz++; }
    var dx0 = drone.X, dy0 = drone.Y; MouseX = dx0 + 250; MouseY = dy0 + 100;
    for(var i=0; i<40; i++) mainScreen.update();
    var stillOk = drone.X == dx0 && drone.Y == dy0 && enemies.length == 1 && enemies[0].boss && enemyShots.length == 0;
    fz = 0; while(mainScreen.bossFreeze && fz < 400){ mainScreen.update(); fz++; draw1(); }
    var landed = !mainScreen.bossFreeze && enemies[0] && enemies[0].mode == "idle" && mainScreen.donT > 0;
    for(var i=0; i<40; i++) mainScreen.update();
    check("ボスの登場：演出中は止まり、着地すると動き出す", stillOk && landed && drone.X != dx0, "停止" + stillOk + " 着地" + landed);

    // 3. 全シナジー
    SYNERGIES.forEach(function(s){
        setup(7, {}, [s.a, s.b, null], 5); game.owned[s.a] = 3; game.owned[s.b] = 3;
        page.change(1); var f = 0, before = errors.length;
        while(page.number == 1 && f < 60*12){ bot(); f++; mainScreen.hp = 9; mainScreen.update(); if(f % 10 == 0) draw1(); }
        check("シナジー " + s.name, errors.length == before);
    });

    // 4. 強化画面・報酬・能力リセット
    setup(4, { gun:1 }, ["gun",null,null], 3); game.parts = 50; game.pendingReward = 2;
    page.change(2); draw1();
    MouseX = rewardCards[0].X + 20; MouseY = rewardCards[0].Y + 20; Click = 1; upgradeScreen.update(); Click = 0;
    MouseX = rewardCards[1].X + 20; MouseY = rewardCards[1].Y + 20; Click = 1; upgradeScreen.update(); Click = 0;
    check("報酬を2回選べる", upgradeScreen.state == "main" && game.pendingReward == 0);
    upgradeScreen.tab = "stats"; var refund = upgradeScreen.refundValue();
    MouseX = resetButton.X + 10; MouseY = resetButton.Y + 10; Click = 1; upgradeScreen.update(); Click = 0; Click = 1; upgradeScreen.update(); Click = 0;
    check("能力リセットでパーツ返却", game.level.speed == 1 && refund > 0, "返却 " + refund);
    upgradeScreen.tab = "equip"; draw1();

    // ショップ：パーツで装備を買う。同じWAVEの間は品ぞろえが変わらず、次のWAVEで入れ替わる
    setup(6, { gun:1, laser:3 }, ["gun",null,null], 3); game.slotCount = 2; game.parts = 100;
    page.change(2); upgradeScreen.tab = "shop"; draw1();
    var items = game.shop.items.slice(), id0 = items[0], lv0 = game.owned[id0] || 0, price0 = upgradeScreen.shopPrice(id0);
    var noMax = items.length == SHOP_ITEMS && items.indexOf("laser") < 0;
    var buy0 = function(){ MouseX = shopBuyButtons[0].X + 10; MouseY = shopBuyButtons[0].Y + 10; Click = 1; upgradeScreen.update(); Click = 0; };
    buy0();
    var bought = game.owned[id0] == lv0 + 1 && game.parts == 100 - price0 && game.shop.sold[0] && (lv0 > 0 || game.slots[1] == id0);
    buy0();
    var once = game.owned[id0] == lv0 + 1 && game.parts == 100 - price0;
    draw1();
    save.load(); page.change(2);
    var kept = game.shop.items.join() == items.join() && game.shop.sold[0];
    game.wave++; page.change(2);
    var restock = game.shop.wave == game.wave && !game.shop.sold[0];
    check("ショップ：パーツで装備を買い、売り切れになる・同じWAVEでは品ぞろえが変わらず、次のWAVEで入れ替わる",
          noMax && bought && once && kept && restock, items.join(",") + " " + id0 + " Lv" + lv0 + "→" + game.owned[id0] + " -" + price0 + " " + [noMax,bought,once,kept,restock].join(""));

    // ショップのバフ：買うと能力・ダメージに効き、セーブに残る。買える回数には上限があり、はじめからで消える
    setup(6, { gun:1 }, ["gun",null,null], 3); game.parts = 500;
    page.change(2); upgradeScreen.tab = "shop"; draw1();
    var armor0 = game.stat("armor"), fuel0 = game.stat("fuel"), rate0 = arms.rate();
    var tapBuff = function(k){ var i = BUFFS.map(function(b){ return b.key; }).indexOf(k); MouseX = buffCards[i].X + 10; MouseY = buffCards[i].Y + 10; Click = 1; upgradeScreen.update(); Click = 0; };
    tapBuff("power"); tapBuff("rapid"); tapBuff("plate"); tapBuff("tank");
    for(var i=0; i<5; i++) tapBuff("plate");    //上限より多く押しても増えない
    var spent = 500 - game.parts, maxPlate = BUFFS[2].cost.length;
    var statsUp = game.stat("armor") == armor0 + BUFF_PLATE*maxPlate && game.stat("fuel") == fuel0 + BUFF_TANK && arms.rate() < rate0;
    draw1();
    page.change(1);
    var tgt = { hp:10, maxHp:10, x:100, y:100, r:10 }; mainScreen.hitEnemy(tgt, 1, "gun");
    var dmgUp = Math.abs(tgt.hp - (10 - (1 + BUFF_POWER))) < 1e-9;
    var hpUp = mainScreen.maxHp == armor0 + BUFF_PLATE*maxPlate;
    save.load();
    var keptBuff = game.buff("power") == 1 && game.buff("plate") == maxPlate;
    game.reset();
    check("ショップのバフ：能力・ダメージに効き、上限まで買え、セーブに残り、はじめからで消える",
          statsUp && dmgUp && hpUp && keptBuff && game.buff("power") == 0 && spent == 30 + 30 + 40 + 70 + 15,
          "使ったパーツ" + spent + " " + [statsUp,dmgUp,hpUp,keptBuff].join(""));

    // ショップの時止めワープ：被弾の瞬間に自動で時が止まってワープし、BUFF_WARP_CD 秒は使えない(その間はふつうに被弾)

    check(_name, droneSheets.length == 3 && droneSheets[0].width*4 == droneSheets[2].width
        && droneSheets[2].width == DRONE_SIZE*4*droneSheets.yaws && droneSheets[2].height == DRONE_SIZE*4*droneSheets.elevs && droneSheets.elevs % 2 == 1 && Drone_front.width == DRONE_SIZE*2,
        droneSheets.id + " " + droneSheets.yaws + "x" + droneSheets.elevs + "段");
}
function clickAt(_r){ MouseIn = true; MouseX = _r.X + _r.width/2; MouseY = _r.Y + _r.height/2; Click = 1; startScreen.update(); Click = 0; }
function finish(){
    try{
        checkSheets("ドローン君の絵を用意する(等倍・2倍・4倍)");
        var lk2 = new DroneLook(); lk2.tint = "190,20,30";
        for(var i=0; i<20; i++){ lk2.update(i % 6,0); lk2.draw(100,100,i % 4 + 1); }
        var lv = droneSheets.pixel ? 0 : 1, tk = 0, oneFrame = true;
        for(var key in tintFrames) if(key.indexOf("drone" + droneSheets.id + "/" + lv + "|") == 0 && key.indexOf("|190,20,30") > 0){ tk++; if(tintFrames[key].width != DRONE_SIZE << lv) oneFrame = false; }
        check("色違い・拡大して描ける(色違いは使ったコマだけ1コマずつ作る)", tk > 0 && oneFrame, tk + "コマ");
        //タイトルの設定：開く → クラシックを選ぶ
        page.change(0);
        clickAt(settingsButton);
        var opened = startScreen.settings;
        startScreen.draw();
        clickAt(skinCards[1]);
        check("設定を開いてクラシックを選ぶ", opened && droneSkin.current == "O" && localStorage.getItem(droneSkin.KEY) == "O");
    }catch(e){ fails++; L("NG   例外 " + e.stack); report(); return; }
    droneSkin.onReady(finish2);
}
function finish2(){
    try{
        checkSheets("クラシックの絵(元のドット絵)を用意する");
        check("クラシックはドット絵としてくっきり描く", droneSheets.pixel === true && droneSheets.id == "O");
        var lk3 = new DroneLook();
        for(var i=0; i<20; i++){ lk3.update(i % 6,0); lk3.draw(100,100,i % 3 + 1); }
        startScreen.draw();
        //標準に戻して、Escで閉じる
        clickAt(skinCards[0]);
        var backE = droneSkin.current == "E" && droneSheets.id == "E";
        document.dispatchEvent(new KeyboardEvent("keydown",{ code:"Escape" }));
        check("標準に戻して、Escで設定を閉じる", backE && !startScreen.settings);
        clickAt(settingsButton);
        clickAt(settingsClose);
        check("閉じるボタンで設定を閉じる", !startScreen.settings);
    }catch(e){ fails++; L("NG   例外 " + e.stack); }
    //テスト前の見た目の設定を戻す
    try{ if(keepSkin) localStorage.setItem(droneSkin.KEY, keepSkin); else localStorage.removeItem(droneSkin.KEY); }catch(e){}
    report();
}
function report(){
    check("スクリプトエラーなし", errors.length == 0, errors.slice(0,5).join(" / "));
    L("");
    L(fails == 0 ? "RESULT: OK" : "RESULT: NG (" + fails + "件)");
    document.getElementById("result").textContent = out.join("\n");
}
droneSkin.onReady(finish);
</script>
</body></html>
