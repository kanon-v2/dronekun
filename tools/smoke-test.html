<html lang="ja"><head><meta charset="UTF-8"><base href="../"><!-- 画像などのパスをプロジェクト直下から解決する --><title>ドローン君 スモークテスト</title><style>body{margin:0}</style></head>
<body><div id="Bigbox"><canvas id="Canvas"></canvas></div><pre id="result">running...</pre>
<script>
var errors = [];
window.addEventListener("error", function(e){ errors.push(e.message + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno); });
</script>
<script src="scripts/drone/common.js"></script>
<script src="scripts/drone/sound.js"></script>
<script src="scripts/drone/equipment.js"></script>
<script src="scripts/drone/armsExtra.js"></script>
<script src="scripts/drone/bosses.js"></script>
<script src="scripts/drone/startScreen.js"></script>
<script src="scripts/drone/mainScreen.js"></script>
<script src="scripts/drone/forces.js"></script>
<script src="scripts/drone/enemyArt.js"></script>
<script src="scripts/drone/upgradeScreen.js"></script>
<script src="scripts/drone/gameoverScreen.js"></script>
<script src="scripts/drone/story.js"></script>
<script src="scripts/drone/battleBg.js"></script>
<script src="scripts/drone/bossDebug.js"></script>
<script src="scripts/drone/timeStop.js"></script>
<script src="scripts/drone/rival.js"></script>
<script src="scripts/drone/shotLab.js"></script>
<script src="lib/peerjs.min.js"></script>
<script src="scripts/drone/coop.js"></script>

<script>
var out = [], fails = 0;
function L(s){ out.push(s); }
function check(name, ok, detail){ if(!ok) fails++; L((ok ? "OK   " : "NG   ") + name + (detail ? "  (" + detail + ")" : "")); }
function draw1(){ ctx.fillStyle = "white"; ctx.fillRect(0,0,CW,CH); screens[page.number].draw(); }
var frames = 0;
//よけながら円を描いて飛ぶボット
function bot(){
    frames++; MouseIn = true;
    MouseX = 480 + 300*Math.cos(frames/60); MouseY = 270 + 170*Math.sin(frames/45);
    var tx = 0, ty = 0, list = enemyShots.concat(enemies.filter(function(e){ return !e.harmless; }));
    for(var i=0; i<list.length; i++){ var o = list[i], dx = drone.X - o.x, dy = drone.Y - o.y, d = Math.hypot(dx,dy) || 1, R = (o.r || 5) + 90; if(d < R){ tx += dx/d*(R-d); ty += dy/d*(R-d); } }
    if(tx || ty){ MouseX = drone.X + tx*2; MouseY = drone.Y + ty*2; }
    MouseX = Math.max(30, Math.min(CW-30, MouseX)); MouseY = Math.max(30, Math.min(CH-30, MouseY));
}
function skipStory(){ var n = 0; while(page.number == 4 && n < 300){ Click = 1; storyScreen.update(); Click = 0; n++; } }
function setup(w, owned, slots, lv){ save.clearAll(); game.reset(); game.wave = w; game.owned = owned; game.slots = slots; game.slotCount = 3; for(var k in game.level) game.level[k] = lv; game.seen = { prologue:true, s3:true, s5:true, s8:true, s10:true, s12:true, reveal:w > REVEAL_WAVE, s17:true, s19:true }; }

try{
    var keepSave = localStorage.getItem("dronekun_save"), keepMeta = localStorage.getItem("dronekun_meta"), keepBest = localStorage.getItem("dronekun_best"), keepClear = localStorage.getItem("dronekun_cleared");

    // 1. ストーリーと画面の流れ
    save.clearAll(); game.reset(); page.change(0); draw1();
    MouseIn = true; MouseX = startButton.X + 10; MouseY = startButton.Y + 10; Click = 1; startScreen.update(); Click = 0;
    var diffOpen = startScreen.diffSel && page.number == 0;
    MouseX = diffCards[2].X + 10; MouseY = diffCards[2].Y + 10; Click = 1; startScreen.update(); Click = 0;     //ハードを選ぶ
    check("出撃 → 難易度を選ぶ → プロローグ", diffOpen && page.number == 4 && storyScreen.id == "prologue" && game.diff == 2 && difficulty().id == "hard", "窓" + diffOpen + " 難易度" + game.diff);
    game.diff = DEFAULT_DIFF;
    draw1(); skipStory();
    check("プロローグ → WAVE1", page.number == 1 && game.wave == 1);
    var flow = [];
    [3,5,15,19].forEach(function(w){
        game.wave = w; page.change(1);
        enemies = []; mainScreen.toSpawn = 0; mainScreen.state = "clear"; mainScreen.stateTime = 149; mainScreen.update();
        flow.push(w + ":" + (page.number == 4 ? storyScreen.id : "-"));
        draw1(); skipStory();
    });
    check("WAVEクリア後のストーリー", flow.join(" ") == "3:s3 5:s5 15:reveal 19:s19", flow.join(" "));
    game.wave = FINAL_WAVE; page.change(1); enemies = []; mainScreen.toSpawn = 0; mainScreen.state = "clear"; mainScreen.stateTime = 149; mainScreen.update();
    skipStory(); draw1();
    check("WAVE20クリア → エンディング", page.number == 5);

    // 2. 通常の戦闘(序盤・人間との戦い・ボス)
    [[2,"序盤"],[17,"人間との戦い"],[5,"ボス 女王蜂"],[10,"ボス 移動要塞"],[20,"ボス ドローン君改"]].forEach(function(c){
        setup(c[0], { gun:3, missile:2, tesla:2 }, ["gun","missile","tesla"], 4);
        page.change(1); var f = 0, before = errors.length;
        while(page.number == 1 && f < 60*25){ bot(); f++; mainScreen.hp = 9; if(f % 200 == 0) Click = 1; mainScreen.update(); Click = 0; if(f % 10 == 0) draw1(); }
        check("戦闘 WAVE" + c[0] + "（" + c[1] + "）を25秒", errors.length == before, "敵" + enemies.length + " 弾" + enemyShots.length);
    });

    // やる気：動くとたまり、止まっていると増えも減りもしない
    setup(2, { gun:1 }, ["gun",null,null], 1);
    page.change(1); mainScreen.update();
    MouseX = drone.X; MouseY = drone.Y;
    drone.wobble = 0;      //狙いのぶれで漂わないように(ぶれが大きいと、止まっていても少し動く)
    for(var i=0; i<120; i++) mainScreen.update();     //ドローン君が止まりきるまで待つ
    enemies = []; enemyShots = []; pickups = []; mainScreen.toSpawn = 0;     //かすり・拾うことでたまらないように
    mainScreen.yaruki = 10;
    for(var i=0; i<30; i++) mainScreen.update();
    var fStill = mainScreen.yaruki;
    MouseX = drone.X + 300; MouseY = drone.Y;
    for(var i=0; i<30; i++) mainScreen.update();
    draw1();
    check("やる気は動くとたまり、止まっていると変わらない", fStill == 10 && mainScreen.yaruki > 10 && !drone.slow, "止まって" + fStill + " 動いて" + mainScreen.yaruki.toFixed(2));

    // 序盤の敵の攻撃：虫はときどき狙って撃ち、虫・突進は倒れるときに撃ち返す(WAVE1から)
    setup(1, {}, [null,null,null], 1);
    page.change(1); MouseIn = true;
    while(mainScreen.state != "play") mainScreen.update();
    enemies = []; enemyShots = []; mainScreen.toSpawn = 0; MouseX = drone.X; MouseY = drone.Y;
    var be = makeEnemy("bug"); be.x = drone.X > CW/2 ? drone.X - 250 : drone.X + 250; be.y = drone.Y; be.shotT = 1; be.hp = be.maxHp = 999; enemies.push(be);
    mainScreen.update();
    var bugShot = enemyShots.length == 1 && enemyShots[0].vx*(drone.X - be.x) > 0 && be.shotT >= BUG_SHOT_EVERY[0];     //ドローン君の方へ撃つ
    enemyShots = [];
    var rv = 0, rand0 = Math.random;
    Math.random = function(){ return 0; };      //撃ち返しの確率を必ず通す
    for(var i=0; i<3; i++){ var ve = makeEnemy("bug"); ve.x = drone.X - 300; ve.y = drone.Y - 100; enemies.push(ve); mainScreen.hitEnemy(ve, 999); }
    Math.random = rand0;
    rv = enemyShots.length;
    check("序盤から、虫はときどき狙って撃ち、倒れた虫は撃ち返す", bugShot && rv >= 3, "虫の弾" + bugShot + " 撃ち返し" + rv);

    // 試作の弾(shotLab.js)：分裂・ため・跳ね・ブーメランの動き
    enemies = []; enemyShots = []; mainScreen.toSpawn = 0;
    var lerr = errors.length;
    var sp = shotLab.fire(200,200,0,2,"split");
    for(var i=0; i<SPLIT_FUSE; i++) mainScreen.updateShots();
    var splitOk = enemyShots.indexOf(sp) < 0 && enemyShots.filter(function(b){ return b.kind == "small"; }).length == SPLIT_N;
    enemyShots = [];
    MouseX = drone.X; MouseY = drone.Y;
    var ra = shotLab.fire(drone.X > CW/2 ? 150 : CW - 150, 120, Math.PI/2, 3, "reaim"), stopped = false;
    for(var i=0; i<200 && !(stopped && ra.wait <= 0); i++){ mainScreen.updateShots(); if(ra.vx == 0 && ra.vy == 0) stopped = true; }
    var reaimOk = stopped && ra.vx*(drone.X - ra.x) > 0;     //止まってから、ドローン君の方へ撃ち出された
    enemyShots = [];
    var bo = shotLab.fire(CW - 20, 20, 0, 4, "bounce");
    for(var i=0; i<5; i++) mainScreen.updateShots();
    var bounceOk = bo.vx < 0 && bo.left == BOUNCE_TIMES - 1;
    var bm = shotLab.fire(400, 300, 0, 4, "boomer");
    for(var i=0; i<40; i++) mainScreen.updateShots();
    var boomerOk = bm.vx < 0;
    enemyShots = [];
    // ジャスト不可弾：当たる直前でもジャストにならず、衝撃波でははね返らずに消えて「ジャスト不可」と出る
    mainScreen.down = false;
    var nj = shotLab.fire(drone.X - 20, drone.Y, 0, 4, "nojust");
    var njNoJust = !mainScreen.isJust();
    fireShot(drone.X + 20, drone.Y, Math.PI, 4, "normal");
    var njMixed = mainScreen.isJust();      //ふつうの弾が混ざればジャストになる
    enemyShots = [nj]; popups = [];
    mainScreen.yaruki = 100; var njJ = mainScreen.just;
    mainScreen.blast();
    var njBlast = enemyShots.length == 0 && mainScreen.just == njJ && popups.some(function(p){ return p.text == "ジャスト不可"; });
    var njOk = njNoJust && njMixed && njBlast;
    enemyShots = []; popups = [];
    // 範囲攻撃：スキャンとためのあと、範囲の中にいれば被弾、外なら無傷
    mainScreen.invincible = 0; mainScreen.guard = 0; mainScreen.hp = 5;
    shotLab.zone("circle", drone.X, drone.Y);
    shotLab.zone("band", 0, drone.Y > CH/2 ? 40 : CH - 40);     //ドローン君のいない帯
    for(var i=0; i<ZONE_SCAN + ZONE_WAIT - 1; i++) mainScreen.updateShots();
    var zHp0 = mainScreen.hp;
    mainScreen.updateShots();
    var zoneOk = zHp0 == 5 && mainScreen.hp == 4;
    for(var i=0; i<ZONE_STRIKE + 2; i++) mainScreen.updateShots();
    zoneOk = zoneOk && shotLab.zones.length == 0;
    // バケツ：傾けて液体を流し(続いた粒は同じ流れの番号)、口にしずくがたまってから落ち、床で飛び散る
    mainScreen.hp = 9;
    var bk = shotLab.bucket(drone.X), gooN = 0, flowOk = false, dripFell = false, splat = false;
    for(var i=0; i<420; i++){
        mainScreen.invincible = 99;     //液体に当たって消えないように
        mainScreen.updateShots();
        var goos = enemyShots.filter(function(b){ return b.kind == "goo"; });
        gooN = Math.max(gooN, goos.length);
        if(goos.some(function(b){ return b.pour && b.seq >= 3; })) flowOk = true;
        if(goos.some(function(b){ return b.big && !(b.hang > 0) && b.vy > 0.5; })) dripFell = true;
        if(goos.some(function(b){ return b.small; })) splat = true;
        if(i % 20 == 0) draw1();
    }
    var bucketOk = gooN > 5 && flowOk && dripFell && splat && bk.mode != null;
    mainScreen.invincible = 0; shotLab.clear(); enemyShots = [];
    // 雨攻撃：雲が集まってから雲の下に硫酸の雨が降り、雲はドローン君へ寄ってきて、床に落ちた粒は煙になり、やがて晴れる
    var rainFar = drone.X > CW/2 ? 100 : CW - 100;
    shotLab.rain(rainFar);
    var acidN = 0, gatherDry = true, puddle = false, rainD0 = Math.abs(rainFar - drone.X);
    for(var i=0; i<RAIN_TIMES.gather + RAIN_TIMES.rain + RAIN_TIMES.clear + 2; i++){
        mainScreen.invincible = 99;
        mainScreen.updateShots();
        var acids = enemyShots.filter(function(b){ return b.kind == "acid"; });
        if(i < RAIN_TIMES.gather - 1 && acids.length) gatherDry = false;
        acidN = Math.max(acidN, acids.length);
        if(shotLab.puddles.length) puddle = true;
        if(i == RAIN_TIMES.gather + 60) var rainD1 = Math.abs(shotLab.storm.x - drone.X);
        if(i % 30 == 0) draw1();
    }
    var rainOk = gatherDry && acidN > 10 && puddle && rainD1 < rainD0 && shotLab.storm == null;
    enemyShots = [];
    // 岩投げ：山なりに飛んで、着く時刻にねらった所を通り、床で砕けて破片が飛び散る
    var rk = shotLab.throwRock(200, 70, 330, 380), rkHit = 1e9, rkGone = false, pebbleN = 0;
    for(var i=0; i<400 && !(rkGone && pebbleN == 0 && i > 300); i++){
        mainScreen.invincible = 99;
        mainScreen.updateShots();
        if(rk.t == rk.eta) rkHit = Math.hypot(rk.x - 330, rk.y - 380);
        if(enemyShots.indexOf(rk) < 0 && !rkGone){ rkGone = true; pebbleN = enemyShots.filter(function(b){ return b.kind == "pebble"; }).length; var pebbleMax = pebbleN; }
        if(rkGone) pebbleN = enemyShots.filter(function(b){ return b.kind == "pebble"; }).length;
    }
    var rockOk = rkHit < 3 && rkGone && pebbleMax == ROCK_PIECES && rk.y > 300;
    enemyShots = []; mainScreen.invincible = 0;
    // 打ち上げ花火：玉はちょうど開く所で開き、種類ごとに星が動く(牡丹は輪・柳は尾を引いて垂れる・花雷ははじける・型物はドローン君の形に止まる)
    var fwOk = {}, fwInfo = [];
    ["botan","yanagi","hanarai","kata"].forEach(function(id){
        enemyShots = [];
        var sh = shotLab.firework(id, 100, CH + 10), at = null, stars = [], popped = false, droop = false, shapeErr = 0;
        for(var i=0; i<FW_RISE + 60; i++){
            mainScreen.invincible = 99;
            if(enemyShots.indexOf(sh) >= 0) at = { x:sh.x, y:sh.y };
            mainScreen.updateShots();
            stars = enemyShots.filter(function(b){ return b.kind == "star"; });
            if(stars.some(function(b){ return b.pop > 0 && b.r > FW_POP_R*0.6; })) popped = true;
            if(stars.some(function(b){ return b.trail && b.trail.length >= FW_TYPES.yanagi.tail && b.fw == "yanagi" && b.vy > 0.3; })) droop = true;
            if(id == "kata" && i == FW_RISE + 40){
                for(var j=0; j<stars.length; j++){
                    var P = FW_KATA_SHAPE[j];
                    shapeErr = Math.max(shapeErr, Math.hypot(stars[j].x - (sh.tx + P[0]*FW_KATA_SCALE), stars[j].y - (sh.ty + P[1]*FW_KATA_SCALE)));
                }
            }
        }
        var arrived = at && Math.hypot(at.x - sh.tx, at.y - sh.ty) < 4 && enemyShots.indexOf(sh) < 0;
        var ok = arrived;
        if(id == "botan") ok = ok && stars.length >= FW_TYPES.botan.n;
        if(id == "yanagi") ok = ok && droop;
        if(id == "hanarai") ok = ok && popped;
        if(id == "kata") ok = ok && stars.length > 0 && shapeErr < 2;
        fwOk[id] = ok;
        fwInfo.push(id + ok + (id == "kata" ? "(形のずれ" + shapeErr.toFixed(2) + ")" : ""));
    });
    var fireworkOk = fwOk.botan && fwOk.yanagi && fwOk.hanarai && fwOk.kata;
    enemyShots = []; mainScreen.invincible = 0;
    // 迎撃：範囲に入ったドローン君の弾を、1秒に INTERCEPT_PER_SEC 発まで撃ち落とす(範囲の外の弾は落とさない)
    arms.bullets = [];
    for(var i=0; i<8; i++) arms.bullets.push({ x:480 + 60 + i, y:100, vx:0, vy:0, life:999, pierce:0, hit:[] });
    arms.bullets.push({ x:480, y:100 + INTERCEPT_RANGE + 20, vx:0, vy:0, life:999, pierce:0, hit:[] });
    var ic = { x:480, y:100, r:15, intercept:{ cd:0, zap:0 } };
    for(var i=0; i<60; i++) shotLab.enemyStep(ic);
    var interceptOk = arms.bullets.length == 9 - INTERCEPT_PER_SEC && arms.bullets.some(function(b){ return b.y > 100 + INTERCEPT_RANGE; });
    arms.bullets = [];
    check("試作の弾：分裂弾は割れ、ため弾は止まって狙い直し、跳ね弾は端で跳ね、ブーメラン弾は戻ってくる。ジャスト不可弾はジャストにならず、衝撃波では消えて「ジャスト不可」と出る。範囲攻撃は範囲の中だけ当たり、バケツは液体を流してしずくを垂らす",
          splitOk && reaimOk && bounceOk && boomerOk && njOk && zoneOk && bucketOk && errors.length == lerr,
          "分裂" + splitOk + " ため" + reaimOk + " 跳ね" + bounceOk + " ブーメラン" + boomerOk + " ジャスト不可" + njNoJust + "/" + njMixed + "/" + njBlast +
          " 範囲" + zoneOk + " バケツ" + bucketOk + "(粒" + gooN + " 流れ" + flowOk + " しずく" + dripFell + " 飛び散り" + splat + ")");
    check("試作の攻撃：雨攻撃は雲が集まってから雲の下に降り、雲が寄ってきて、やがて晴れる。岩投げは狙った所を通って床で砕ける。打ち上げ花火は開く所で開き、牡丹・柳・花雷・型物で星の動きが違う。迎撃は範囲の弾を1秒に" + INTERCEPT_PER_SEC + "発まで撃ち落とす",
          rainOk && rockOk && fireworkOk && interceptOk && errors.length == lerr,
          "雨" + rainOk + "(集まる間は降らない" + gatherDry + " 粒" + acidN + " 煙" + puddle + " 雲の距離" + Math.round(rainD0) + "→" + Math.round(rainD1) + ")" +
          " 岩" + rockOk + "(ずれ" + rkHit.toFixed(1) + " 破片" + pebbleMax + ")" + " 花火 " + fwInfo.join(" ") + " 迎撃" + interceptOk);

    // 画面の前後を使う攻撃
    lerr = errors.length;
    var drawDepth = function(){ shotLab.drawUnder(); shotLab.drawFront(); };
    enemyShots = []; enemies = []; shotLab.clear();
    mainScreen.invincible = 0; mainScreen.guard = 0; mainScreen.hp = 9;
    // 奥からの砲撃：着くまでは当たらず、着いた瞬間に着く所の輪の中だけ当たり、破片が散る
    shotLab.deep(drone.X, drone.Y); shotLab.deep(drone.X > CW/2 ? 60 : CW - 60, 60);
    for(var i=0; i<DEEP_TIME - 1; i++){ shotLab.update(); if(i % 20 == 0) drawDepth(); }
    var deepHp0 = mainScreen.hp;
    shotLab.update();
    var deepOk = deepHp0 == 9 && mainScreen.hp == 8 && enemyShots.length >= DEEP_SHARDS && shotLab.deeps.length == 0;
    // 奥からの突進：着く直前に衝撃波を出すと弾き返す(被弾しない)。出さなければ被弾する
    enemyShots = []; mainScreen.invincible = 0; mainScreen.guard = 0; mainScreen.hp = 9;
    var ram1 = shotLab.ram();
    for(var i=0; i<RAM_TIME - 3; i++){ shotLab.update(); if(i % 20 == 0) drawDepth(); }
    mainScreen.yaruki = YARUKI_MAX; mainScreen.blast();
    for(var i=0; i<10; i++) shotLab.update();
    var parried = ram1.mode == "back" && mainScreen.hp == 9;
    mainScreen.invincible = 0; mainScreen.guard = 0;
    var ram2 = shotLab.ram();
    for(var i=0; i<RAM_TIME + RAM_PASS + 2; i++){ shotLab.update(); if(i % 10 == 0) drawDepth(); }
    var ramOk = parried && mainScreen.hp == 8 && shotLab.rams.length == 0;
    // 立体の輪：手前の弾と奥の弾がある。奥を通る弾は重なっても当たらない。時間が来るとほどけて飛んでいく
    enemyShots = []; mainScreen.invincible = 99;
    var hp1 = shotLab.hoop(drone.X, drone.Y - 120, 0), hoopFront = 0, hoopBack = 0;
    for(var i=0; i<HOOP_LIFE + 1; i++){
        mainScreen.updateShots();
        if(i == 150){
            hoopFront = enemyShots.filter(function(b){ return b.kind == "hoop" && !b.behind; }).length;
            hoopBack = enemyShots.filter(function(b){ return b.kind == "hoop" && b.behind; }).length;
            drawDepth(); draw1();
        }
    }
    var hoopFree = enemyShots.filter(function(b){ return b.kind == "hoop"; }).every(function(b){ return !b.ring && Math.hypot(b.vx,b.vy) > 0.5; });
    mainScreen.invincible = 0; mainScreen.guard = 0; mainScreen.hp = 9;
    enemyShots = [{ x:drone.X, y:drone.Y, vx:0, vy:0, r:5, kind:"hoop", behind:true }];
    mainScreen.updateShots();
    var behindSafe = mainScreen.hp == 9;
    enemyShots = [{ x:drone.X, y:drone.Y, vx:0, vy:0, r:5, kind:"hoop", behind:false }];
    mainScreen.updateShots();
    var hoopOk = hoopFront > 0 && hoopBack > 0 && hoopFree && behindSafe && mainScreen.hp == 8 && shotLab.hoops.length == 0;
    enemyShots = []; mainScreen.invincible = 99;
    // 奥へ潜る敵：潜っている間は攻撃が効かず、別の場所から出てきて弾の輪を撃つ
    var dv = shotLab.diver(300, 150), dvModes = {}, dvSafe = true, dvT = DIVER_TIMES;
    for(var i=0; i<dvT.surface + dvT.dive + dvT.deep + dvT.rise + 2; i++){
        mainScreen.updateEnemies();
        dvModes[dv.dive.mode] = true;

    check("大きな表示では細かく描き、重いと1段下げる", hiRes && dropped, "×" + renderScale);
    renderCap = RENDER_MAX; canvas.style.width = "960px"; canvas.style.height = "540px"; fitCanvas();
    canvas.style.width = keepCssW; canvas.style.height = keepCssH;
    fps.count = keepFps.count; fps.last = keepFps.last; fps.value = keepFps.value; fps.low = keepFps.low;

    //タイトル画面のタッチ：ボタン以外はドラッグした分だけ目標が動き(戦闘中と同じ)、ボタンはタップで押せて目標は飛ばない
    page.change(0); startScreen.settings = false; bossDebug.menu = false;
    var crect = canvas.getBoundingClientRect();
    var pe = function(_type,_x,_y){ canvas.dispatchEvent(new PointerEvent(_type,{ pointerType:"touch", pointerId:7, bubbles:true, cancelable:true,
        clientX:crect.left + _x*crect.width/CW, clientY:crect.top + _y*crect.height/CH })); };
    MouseX = 480; MouseY = 270; Click = 0;
    pe("pointerdown",150,450);
    var tNoJump = MouseX == 480 && MouseY == 270 && Click == 0;
    pe("pointermove",190,430);
    var tMoved = Math.abs(MouseX - (480 + 40*TOUCH_SPEED)) < 0.01 && Math.abs(MouseY - (270 - 20*TOUCH_SPEED)) < 0.01;
    pe("pointerup",190,430);
    var tx = MouseX, ty = MouseY;
    pe("pointerdown",settingsButton.X + 20,settingsButton.Y + 10);
    var tTap = Click == 1;
    startScreen.update(); Click = 0; endTap();
    pe("pointerup",settingsButton.X + 20,settingsButton.Y + 10);
    var tOpen = startScreen.settings && MouseX == tx && MouseY == ty;
    pe("pointerdown",settingsClose.X + 20,settingsClose.Y + 10);
    startScreen.update(); Click = 0; endTap();
    pe("pointerup",settingsClose.X + 20,settingsClose.Y + 10);
    var tClose = !startScreen.settings && MouseX == tx && MouseY == ty;
    check("タイトル画面のタッチ：ドラッグで目標が動き、ボタンはタップで押せる(目標は飛ばない)", tNoJump && tMoved && tTap && tOpen && tClose,
          [tNoJump, tMoved, tTap, tOpen, tClose].map(function(b){ return b ? 1 : 0; }).join(""));
    inputMode = "mouse";

    //戦闘画面の右下：かすり範囲・当たり判定・ポインタの表示ボタン
    var keepView = localStorage.getItem(viewOpt.KEY), keepHit = viewOpt.hitbox, keepGraze = viewOpt.graze, keepPtr = viewOpt.pointer;
    viewOpt.hitbox = true; viewOpt.graze = true; viewOpt.pointer = true;
    var btn = function(_key){ for(var i=0; i<sound.buttons.length; i++) if(sound.buttons[i].key == _key) return sound.buttons[i]; };
    var press = function(_key){ var r = btn(_key).rect; inputMode = "mouse"; MouseX = r.X + r.width/2; MouseY = r.Y + r.height/2; Click = 1; var ok = sound.handleClick(); Click = 0; return ok; };
    page.change(0);
    var titleHidden = sound.shown().indexOf(btn("hitbox")) < 0 && sound.shown().indexOf(btn("graze")) < 0 && sound.shown().indexOf(btn("pointer")) < 0;
    setup(3, game.owned, game.slots, 1); page.change(1); draw1();
    var shownInBattle = sound.shown().length == 5;
    var hitOff = press("hitbox") && !viewOpt.hitbox && btn("hitbox").label() == "当たり判定：非表示";
    var ptrOff = press("pointer") && !viewOpt.pointer && !viewOpt.showPointer();
    var grazeOff = press("graze") && !viewOpt.graze && btn("graze").label() == "かすり範囲：非表示";
    draw1();
    var saved = JSON.parse(localStorage.getItem(viewOpt.KEY) || "{}");
    check("戦闘画面の右下でかすり範囲・当たり判定・ポインタを非表示にする", titleHidden && shownInBattle && hitOff && ptrOff && grazeOff && saved.hitbox === false && saved.graze === false && saved.pointer === false);
    page.change(0);
    var ptrMenu = viewOpt.showPointer();
    page.change(1);
    press("hitbox"); press("pointer"); press("graze");
    check("ポインタはメニューでは出す・もう一度押すと表示に戻る", ptrMenu && viewOpt.hitbox && viewOpt.graze && viewOpt.pointer && viewOpt.showPointer());
    //テスト前の設定に戻す
    viewOpt.hitbox = keepHit; viewOpt.graze = keepGraze; viewOpt.pointer = keepPtr;
    if(keepView) localStorage.setItem(viewOpt.KEY, keepView); else localStorage.removeItem(viewOpt.KEY);
    page.change(0);
    //新しい装備(armsExtra.js)：それぞれの効果が働く
    var mkE = function(_type,_x,_y,_hp){ var e = makeEnemy(_type); e.x = _x; e.y = _y; e.vx = 0; e.vy = 0; e.hp = e.maxHp = _hp || 50; e.timer = 9999; enemies.push(e); return e; };
    var prep = function(_id){ setup(7, {}, [_id,null,null], 3); game.owned[_id] = 3; page.change(1); enemies = []; enemyShots = []; mainScreen.toSpawn = 0;
                              arms.reset(); arms.cd[_id] = 0; drone.X = 300; drone.Y = 270; };
    var run = function(_n){ for(var i=0; i<_n; i++){ arms.update(true); if(i % 10 == 0) draw1(); } };
    //火炎放射：当たった敵が燃え、炎が届かなくなっても削れ続ける
    prep("fire");
    var fe = mkE("tank",360,270); run(30);
    var fBurn = fe.burn > 0 && fe.hp < 50;
    drone.X = 40; var fh = fe.hp; run(60);
    check("火炎放射：敵が燃えて削れ続ける", fBurn && fe.hp < fh, "残り" + fe.hp.toFixed(1));
    //円盤：行きと帰りで当たり、戻ってくる
    prep("disc");
    var de = mkE("tank",430,270); run(1);
    var dThrown = arms.discs.length == 2;
    arms.cd.disc = 99999;   //1回だけ投げて、戻ってくるまでを見る
    run(200);
    check("円盤：投げて戻り、行きと帰りで当たる", dThrown && arms.discs.length == 0 && de.hp <= 50 - DISC_DMG*3 + 0.01 && de.hp >= 50 - DISC_DMG*4 - 0.01, "残り" + de.hp.toFixed(1));
    //重力弾：渦がまわりの敵を吸い寄せる
    prep("gravity");
    var g1 = mkE("tank",420,270), g2 = mkE("tank",430,350); run(60);
    var gw = arms.wells[0], gd0 = gw && gw.open ? Math.hypot(g2.x - gw.x, g2.y - gw.y) : 0;
    run(40);
    var gd1 = gw ? Math.hypot(g2.x - gw.x, g2.y - gw.y) : 0;
    check("重力弾：渦がまわりの敵を吸い寄せる", gw && gw.open && gd1 < gd0 - 20, Math.round(gd0) + "→" + Math.round(gd1));
    //バリア：板に触れた敵の弾が消え、その板はしばらく消える
    prep("barrier");
    run(1);
    var bp = arms.platePos(0, arms.plates.length);
    enemyShots.push({ x:bp.x, y:bp.y, vx:0, vy:0, r:5, kind:"normal", grazed:false });
    run(1);
    var bDown = arms.plates.filter(function(p){ return p.down > 0; }).length;
    check("バリア：敵の弾を消し、板がしばらく消える", arms.plates.length == 4 && enemyShots.length == 0 && bDown == 1);
    //狙撃：いちばん体力の多い敵だけを大きく削る
    prep("sniper");
    var sWeak = mkE("bug",350,200,3), sTough = mkE("tank",700,450,80); run(1);
    check("狙撃：いちばん体力の多い敵を削る", sTough.hp == 80 - SNIPE_DMG[2] && sWeak.hp == 3);
    //冷凍：凍った敵は動かず、次の一撃が2倍で砕ける
    prep("freeze");
    var ze = mkE("bug",380,270,50), zf = 0;
    while(!(ze.frozen > 0) && zf < 60){ run(1); zf++; }
    var zFrozen = ze.frozen > 0;
    ze.vx = 3; var zx = ze.x;
    for(var i=0; i<5; i++) mainScreen.updateEnemies();
    var zStill = ze.x == zx;
    var zh = ze.hp; mainScreen.hitEnemy(ze,1,"gun");
    check("冷凍：凍った敵は止まり、次の一撃が2倍で砕ける", zFrozen && zStill && zh - ze.hp == 2 && !(ze.frozen > 0), "凍" + zFrozen + " 止" + zStill + " 差" + (zh - ze.hp));
    enemies = []; enemyShots = []; page.change(0);

    //テスト前のセーブ等を戻す
    save.clear();
    if(keepSave) localStorage.setItem("dronekun_save", keepSave);
    if(keepMeta) localStorage.setItem("dronekun_meta", keepMeta); else localStorage.removeItem("dronekun_meta");
    if(keepBest) localStorage.setItem("dronekun_best", keepBest);
    if(keepClear) localStorage.setItem("dronekun_cleared", keepClear); else localStorage.removeItem("dronekun_cleared");
    //ドローン君の振り向き：左から右へは正面を通って回り、止まると目標の向きになる(ばねなので少し行きすぎてから落ち着く)
    var lk = new DroneLook(), passFront = false, over = false;
    for(var i=0; i<90; i++){ lk.update(3,0); if(lk.yaw > DIR_YAW[3] + 1) over = true; }
    var atLeft = Math.abs(lk.yaw - DIR_YAW[3]) < 1 && Math.abs(lk.elev - DIR_ELEV[3]) < 0.05;
    for(var i=0; i<90; i++){ lk.update(4,0); if(Math.abs(lk.yaw) < 10) passFront = true; }
    check("振り向き：左 → 正面を通って右", atLeft && over && passFront && Math.abs(lk.yaw - DIR_YAW[4]) < 1, "yaw " + lk.yaw.toFixed(2));
    for(var i=0; i<90; i++) lk.update(1,0);
    check("振り向き：上を向くと見上げる高さ", Math.abs(lk.elev - DIR_ELEV[1]) < 0.05 && Math.abs(lk.yaw) < 1);
    //速さを渡すと、斜めに動けば横を向きつつ見下ろす。遅い動きでは向きを変えない
    var lk4 = new DroneLook();
    for(var i=0; i<90; i++) lk4.update(4, 2, 2);
    var diag = lk4.yaw < -40 && lk4.yaw > -55 && lk4.elev > 0.6 && lk4.elev < 0.8;
    for(var i=0; i<30; i++) lk4.update(4, 0.01, -0.01);
    check("振り向き：斜めに動くと斜めを向く", diag && lk4.elev > 0.6, "yaw " + lk4.yaw.toFixed(1) + " elev " + lk4.elev.toFixed(2));
}catch(e){ fails++; L("NG   例外 " + e.stack); }

//ドローン君の絵の用意を待ってから確かめるもの
var keepSkin = null;
try{ keepSkin = localStorage.getItem(droneSkin.KEY); }catch(e){}
function checkSheets(_name){
    check(_name, droneSheets.length == 3 && droneSheets[0].width*4 == droneSheets[2].width
        && droneSheets[2].width == DRONE_SIZE*4*droneSheets.yaws && droneSheets[2].height == DRONE_SIZE*4*droneSheets.elevs && droneSheets.elevs % 2 == 1 && Drone_front.width == DRONE_SIZE*2,
        droneSheets.id + " " + droneSheets.yaws + "x" + droneSheets.elevs + "段");
}
function clickAt(_r){ MouseIn = true; MouseX = _r.X + _r.width/2; MouseY = _r.Y + _r.height/2; Click = 1; startScreen.update(); Click = 0; }
function finish(){
    try{
        checkSheets("ドローン君の絵を用意する(等倍・2倍・4倍)");
        var lk2 = new DroneLook(); lk2.tint = "190,20,30";
        for(var i=0; i<20; i++){ lk2.update(i % 6,0); lk2.draw(100,100,i % 4 + 1); }
        var lv = droneSheets.pixel ? 0 : 1, tk = 0, oneFrame = true;
        for(var key in tintFrames) if(key.indexOf("drone" + droneSheets.id + "/" + lv + "|") == 0 && key.indexOf("|190,20,30") > 0){ tk++; if(tintFrames[key].width != DRONE_SIZE << lv) oneFrame = false; }
        check("色違い・拡大して描ける(色違いは使ったコマだけ1コマずつ作る)", tk > 0 && oneFrame, tk + "コマ");
        //タイトルの設定：開く → クラシックを選ぶ
        page.change(0);
        clickAt(settingsButton);
        var opened = startScreen.settings;
        startScreen.draw();
        clickAt(skinCards[1]);
        check("設定を開いてクラシックを選ぶ", opened && droneSkin.current == "O" && localStorage.getItem(droneSkin.KEY) == "O");
    }catch(e){ fails++; L("NG   例外 " + e.stack); report(); return; }
    droneSkin.onReady(finish2);
}
function finish2(){
    try{
        checkSheets("クラシックの絵(元のドット絵)を用意する");
        check("クラシックはドット絵としてくっきり描く", droneSheets.pixel === true && droneSheets.id == "O");
        var lk3 = new DroneLook();
        for(var i=0; i<20; i++){ lk3.update(i % 6,0); lk3.draw(100,100,i % 3 + 1); }
        startScreen.draw();
        //標準に戻して、Escで閉じる
        clickAt(skinCards[0]);
        var backE = droneSkin.current == "E" && droneSheets.id == "E";
        document.dispatchEvent(new KeyboardEvent("keydown",{ code:"Escape" }));
        check("標準に戻して、Escで設定を閉じる", backE && !startScreen.settings);
        //戦闘画面の方眼：なし・細かい・大きいを選ぶと覚え、背景の目の大きさが変わる。どの設定でも背景の演出が描ける
        //(ボタン：0 あり 1 なし 2 細かい 3 普通 4 大きい)
        var keepView = localStorage.getItem(viewOpt.KEY), keepGrid = viewOpt.grid, keepSize = viewOpt.gridSize;
        clickAt(settingsButton);
        clickAt(gridButtons[1].rect); clickAt(gridButtons[2].rect);
        startScreen.draw();
        var savedView = JSON.parse(localStorage.getItem(viewOpt.KEY) || "{}");
        var gridOk = viewOpt.grid === false && viewOpt.gridSize == "fine" && savedView.grid === false && savedView.gridSize == "fine" && battleBg.cell() == GS/4;
        var bgErr2 = errors.length;
        battleBg.reset();
        battleBg.graze(300,200,1);
        var fineN = battleBg.glows.length;      //細かい方眼では、普通の方眼の2倍のマス数のひし形(まわり6マス → 85マス)
        battleBg.ripple(300,200,22,7,55,"255,150,60"); battleBg.justSpread(300,200,BG_JUST_COLOR);
        battleBg.step(20); battleBg.render(0); battleBg.draw();   //なしの設定の draw は白地だけ(線もなし)
        battleBg.skyName = null; battleBg.draw();
        var classicFx = mainScreen.justFx() === JUST_FX.classic && battleBg.skyName != null;   //なし：ジャストの演出は公開版のまま。空と街の絵は出す
        clickAt(gridButtons[0].rect); clickAt(gridButtons[3].rect);
        var backGrid = viewOpt.grid === true && viewOpt.gridSize == "normal" && battleBg.cell() == GS/2 && mainScreen.justFx() === JUST_FX.bg;
        clickAt(gridButtons[4].rect); startScreen.draw(); battleBg.skyName = null; battleBg.draw();   //大きい：空と街の絵の上に公開版と同じごく薄い方眼、ジャストの演出も公開版
        var largeOk = viewOpt.gridSize == "large" && battleBg.classic() && mainScreen.justFx() === JUST_FX.classic && battleBg.skyName != null;
        clickAt(gridButtons[3].rect);
        battleBg.reset();
        check("設定で戦闘画面の方眼を「なし」「細かい」「大きい」(公開版と同じ方眼・ジャストの演出。空と街の絵はどれも出す)にでき、覚える。戻せる", gridOk && backGrid && largeOk && classicFx && fineN == 85 && errors.length == bgErr2, "細かいのひし形 " + fineN + "マス");
        viewOpt.grid = keepGrid; viewOpt.gridSize = keepSize;
        try{ if(keepView) localStorage.setItem(viewOpt.KEY, keepView); else localStorage.removeItem(viewOpt.KEY); }catch(e){}
        clickAt(settingsClose);
        check("閉じるボタンで設定を閉じる", !startScreen.settings);
    }catch(e){ fails++; L("NG   例外 " + e.stack); }
    //テスト前の見た目の設定を戻す
    try{ if(keepSkin) localStorage.setItem(droneSkin.KEY, keepSkin); else localStorage.removeItem(droneSkin.KEY); }catch(e){}
    report();
}
function report(){
    check("スクリプトエラーなし", errors.length == 0, errors.slice(0,5).join(" / "));
    L("");
    L(fails == 0 ? "RESULT: OK" : "RESULT: NG (" + fails + "件)");
    document.getElementById("result").textContent = out.join("\n");
}
droneSkin.onReady(finish);
</script>
</body></html>
