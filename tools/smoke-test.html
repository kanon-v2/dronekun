<!DOCTYPE html>
<!--
  動作確認(スモークテスト)
  tools/run-smoke.ps1 からヘッドレスのブラウザで開き、結果を <pre id="result"> に書き出す。
  ブラウザで直接開いても実行できる(画面の下に結果が出る)。
-->
<html lang="ja"><head><meta charset="UTF-8"><base href="../"><!-- 画像などのパスをプロジェクト直下から解決する --><title>ドローン君 スモークテスト</title><style>body{margin:0}</style></head>
<body><div id="Bigbox"><canvas id="Canvas"></canvas></div><pre id="result">running...</pre>
<script>
var errors = [];
window.addEventListener("error", function(e){ errors.push(e.message + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno); });
</script>
<script src="scripts/drone/common.js"></script>
<script src="scripts/drone/sound.js"></script>
<script src="scripts/drone/equipment.js"></script>
<script src="scripts/drone/bosses.js"></script>
<script src="scripts/drone/startScreen.js"></script>
<script src="scripts/drone/mainScreen.js"></script>
<script src="scripts/drone/dragons.js"></script>
<script src="scripts/drone/forces.js"></script>
<script src="scripts/drone/upgradeScreen.js"></script>
<script src="scripts/drone/gameoverScreen.js"></script>
<script src="scripts/drone/story.js"></script>
<script src="lib/peerjs.min.js"></script>
<script src="scripts/drone/coop.js"></script>
<script src="scripts/drone/versus.js"></script>
<script src="scripts/drone/rogue.js"></script>
<script src="scripts/drone/draw.js"></script>
<script>
var out = [], fails = 0;
function L(s){ out.push(s); }
function check(name, ok, detail){ if(!ok) fails++; L((ok ? "OK   " : "NG   ") + name + (detail ? "  (" + detail + ")" : "")); }
function draw1(){ ctx.fillStyle = "white"; ctx.fillRect(0,0,CW,CH); screens[page.number].draw(); }
var frames = 0;
//よけながら円を描いて飛ぶボット
function bot(){
    frames++; MouseIn = true;
    MouseX = 480 + 300*Math.cos(frames/60); MouseY = 270 + 170*Math.sin(frames/45);
    var tx = 0, ty = 0, list = enemyShots.concat(enemies.filter(function(e){ return !e.harmless; }));
    for(var i=0; i<list.length; i++){ var o = list[i], dx = drone.X - o.x, dy = drone.Y - o.y, d = Math.hypot(dx,dy) || 1, R = (o.r || 5) + 90; if(d < R){ tx += dx/d*(R-d); ty += dy/d*(R-d); } }
    if(tx || ty){ MouseX = drone.X + tx*2; MouseY = drone.Y + ty*2; }
    MouseX = Math.max(30, Math.min(CW-30, MouseX)); MouseY = Math.max(30, Math.min(CH-30, MouseY));
}
function skipStory(){ var n = 0; while(page.number == 4 && n < 300){ Click = 1; storyScreen.update(); Click = 0; n++; } }
function setup(w, owned, slots, lv){ save.clear(); game.reset(); game.wave = w; game.owned = owned; game.slots = slots; game.slotCount = 3; for(var k in game.level) game.level[k] = lv; game.seen = { prologue:true, s3:true, s5:true, s8:true, s10:true, s12:true, reveal:w > REVEAL_WAVE, s17:true, s19:true }; }

try{
    var keepSave = localStorage.getItem("dronekun_save"), keepBest = localStorage.getItem("dronekun_best"), keepClear = localStorage.getItem("dronekun_cleared");

    // 1. ストーリーと画面の流れ
    save.clear(); game.reset(); page.change(0); draw1();
    MouseIn = true; MouseX = startButton.X + 10; MouseY = startButton.Y + 10; Click = 1; startScreen.update(); Click = 0;
    check("はじめから → プロローグ", page.number == 4 && storyScreen.id == "prologue");
    draw1(); skipStory();
    check("プロローグ → WAVE1", page.number == 1 && game.wave == 1);
    var flow = [];
    [3,5,15,19].forEach(function(w){
        game.wave = w; page.change(1);
        enemies = []; mainScreen.toSpawn = 0; mainScreen.state = "clear"; mainScreen.stateTime = 149; mainScreen.update();
        flow.push(w + ":" + (page.number == 4 ? storyScreen.id : "-"));
        draw1(); skipStory();
    });
    check("WAVEクリア後のストーリー", flow.join(" ") == "3:s3 5:s5 15:reveal 19:s19", flow.join(" "));
    game.wave = FINAL_WAVE; page.change(1); enemies = []; mainScreen.toSpawn = 0; mainScreen.state = "clear"; mainScreen.stateTime = 149; mainScreen.update();
    skipStory(); draw1();
    check("WAVE20クリア → エンディング", page.number == 5);

    // 2. 通常の戦闘(序盤・人間との戦い・ボス)
    [[2,"序盤"],[17,"人間との戦い"],[5,"ボス 女王蜂"],[10,"ボス 移動要塞"],[20,"ボス ドローン君改"]].forEach(function(c){
        setup(c[0], { gun:3, missile:2, tesla:2 }, ["gun","missile","tesla"], 4);
        page.change(1); var f = 0, before = errors.length;
        while(page.number == 1 && f < 60*25){ bot(); f++; mainScreen.hp = 9; if(f % 200 == 0) Click = 1; mainScreen.update(); Click = 0; if(f % 10 == 0) draw1(); }
        check("戦闘 WAVE" + c[0] + "（" + c[1] + "）を25秒", errors.length == before, "敵" + enemies.length + " 弾" + enemyShots.length);
    });

    // 燃料切れ：遅くなり、ドローン君のまわりに知らせが出て、燃料が戻ると解除
    setup(2, { gun:1 }, ["gun",null,null], 1);
    page.change(1); mainScreen.update();
    mainScreen.fuel = 0.01; MouseX = drone.X + 200; MouseY = drone.Y;
    mainScreen.update(); mainScreen.update(); draw1();
    var outNow = mainScreen.fuelOut && drone.slow;
    mainScreen.fuel = FUEL_RESUME + 1; MouseX = drone.X; MouseY = drone.Y;
    mainScreen.update();
    check("燃料切れで遅くなり、回復で戻る", outNow && !mainScreen.fuelOut && !drone.slow);

    // 3. 全シナジー
    SYNERGIES.forEach(function(s){
        setup(7, {}, [s.a, s.b, null], 5); game.owned[s.a] = 3; game.owned[s.b] = 3;
        page.change(1); var f = 0, before = errors.length;
        while(page.number == 1 && f < 60*12){ bot(); f++; mainScreen.hp = 9; mainScreen.update(); if(f % 10 == 0) draw1(); }
        check("シナジー " + s.name, errors.length == before);
    });

    // 4. 強化画面・報酬・能力リセット
    setup(4, { gun:1 }, ["gun",null,null], 3); game.parts = 50; game.pendingReward = 2;
    page.change(2); draw1();
    MouseX = rewardCards[0].X + 20; MouseY = rewardCards[0].Y + 20; Click = 1; upgradeScreen.update(); Click = 0;
    MouseX = rewardCards[1].X + 20; MouseY = rewardCards[1].Y + 20; Click = 1; upgradeScreen.update(); Click = 0;
    check("報酬を2回選べる", upgradeScreen.state == "main" && game.pendingReward == 0);
    upgradeScreen.tab = "stats"; var refund = upgradeScreen.refundValue();
    MouseX = resetButton.X + 10; MouseY = resetButton.Y + 10; Click = 1; upgradeScreen.update(); Click = 0; Click = 1; upgradeScreen.update(); Click = 0;
    check("能力リセットでパーツ返却", game.level.speed == 1 && refund > 0, "返却 " + refund);
    upgradeScreen.tab = "equip"; draw1();

    // 5. ストーリー確認モード(Qキー)
    page.change(0);
    document.dispatchEvent(new KeyboardEvent("keydown", { code:"KeyQ" }));
    check("Qキーでストーリー確認モード", page.number == 4 && storyDebug.active);
    document.dispatchEvent(new KeyboardEvent("keydown", { code:"Escape" }));
    check("Escでタイトルへ", page.number == 0 && !storyDebug.active);

    // 6. ローグライト
    var keepRgMeta = localStorage.getItem(RG_META_KEY), keepRgRun = localStorage.getItem(RG_RUN_KEY);
    localStorage.removeItem(RG_META_KEY); localStorage.removeItem(RG_RUN_KEY);
    save.clear(); game.reset(); game.wave = 7; save.write();
    var storyBefore = localStorage.getItem("dronekun_save");
    function rgFight(_max){ var f = 0; while(page.number == 1 && f < _max){ bot(); f++; mainScreen.hp = mainScreen.maxHp; mainScreen.update(); if(f % 30 == 0) draw1(); } return f; }
    page.change(8); draw1();
    MouseX = rgStartButton.X + 5; MouseY = rgStartButton.Y + 5; Click = 1; rogueHub.update(); Click = 0;
    check("ローグライト：ランを始めるとマップへ", page.number == 9 && rogue.active && rogue.stage == 1 && arms.equipped().length == 1);
    draw1();
    //マップ：どのマスにも入口から行けて、どのマスからもボスへ行ける
    var mapOk = true;
    for(var n=0; n<30; n++){
        var mp = rogue.makeMap();
        for(var l=0; l<mp.length; l++){
            for(var j=0; j<mp[l].length; j++){
                if(l < mp.length - 1 && mp[l][j].next.length == 0) mapOk = false;
                if(l > 0){ var inc = false; for(var k=0; k<mp[l-1].length; k++) if(mp[l-1][k].next.indexOf(j) >= 0) inc = true; if(!inc) mapOk = false; }
                if(l == 0 && mp[l][j].type != "battle") mapOk = false;
            }
        }
        if(mp[mp.length - 1][0].type != "boss") mapOk = false;
    }
    check("ローグライト：マップのつながり（30枚）", mapOk);
    var ch = rogue.choices(); rogue.go(ch[0][0], ch[0][1]);
    check("ローグライト：戦闘マスで戦闘へ", page.number == 1 && game.wave == 1 && mainScreen.toSpawn == RG_SPAWN_BASE + RG_SPAWN_PER, "敵" + mainScreen.toSpawn);
    rgFight(60*90);
    check("ローグライト：勝つと報酬カード", page.number == 2 && upgradeScreen.state == "reward", "page" + page.number);
    MouseX = rewardCards[0].X + 5; MouseY = rewardCards[0].Y + 5; Click = 1; upgradeScreen.update(); Click = 0; draw1();
    check("ローグライト中はストーリーのセーブを書き換えない", localStorage.getItem("dronekun_save") == storyBefore && rogue.hasRun());
    MouseX = nextButton.X + 5; MouseY = nextButton.Y + 5; Click = 1; upgradeScreen.update(); Click = 0;
    check("ローグライト：強化画面からマップへ", page.number == 9 && rogueMap.mode == "map" && rogue.layer == 0);
    //宝箱・ショップ・休憩
    rogue.items = []; rogueMap.open("chest"); draw1();
    var c0 = rgCard(0, rogueMap.offers.length); MouseX = c0.X + 5; MouseY = c0.Y + 5; Click = 1; rogueMap.update(); Click = 0;
    check("ローグライト：宝箱でアイテム", rogue.items.length == 1 && rogueMap.mode == "map");
    game.parts = 100; rogueMap.open("shop"); draw1();
    var s0 = rgCard(0, rogueMap.offers.length); MouseX = s0.X + 5; MouseY = s0.Y + 5; Click = 1; rogueMap.update(); Click = 0;
    var bought = game.parts < 100;
    MouseX = rgLeaveButton.X + 5; MouseY = rgLeaveButton.Y + 5; Click = 1; rogueMap.update(); Click = 0;
    check("ローグライト：ショップで買える", bought && rogueMap.mode == "map");
    rogue.lost = 2; rogueMap.open("rest"); draw1();
    MouseX = rgRestButtons[0].X + 5; MouseY = rgRestButtons[0].Y + 5; Click = 1; rogueMap.update(); Click = 0;
    check("ローグライト：休憩で回復", rogue.lost == 0);
    //アイテムの効き目
    rogue.items = ["armor","battery","scope"];
    rogue.battleType = "battle"; game.wave = 2; page.change(1);
    check("ローグライト：アイテムの効果（耐久・燃料・射程）",
          mainScreen.maxHp == game.stat("armor") + RG_BASE_HP + 1 && mainScreen.maxFuel == game.stat("fuel") + 30 && game.range() == 170 + game.level.brain*30 + 50);
    //ボスを倒すと次のステージ(アイテムを選んでから強化画面)
    game.owned = { gun:3, missile:3, tesla:3 }; game.slots = ["gun","missile","tesla"]; game.slotCount = 3;
    for(var k in game.level) game.level[k] = 5;
    rogue.layer = rogue.map.length - 1; rogue.node = 0; rogue.battleType = "boss"; game.wave = rogue.level(rogue.layer, "boss");
    page.change(1);
    var bossName = enemies.length;
    rgFight(60*120);
    check("ローグライト：ボスを倒すとステージ2へ", rogue.stage == 2 && page.number == 9 && rogueMap.mode == "chest" && rogue.layer == -1, "stage" + rogue.stage + " page" + page.number + " " + rogueMap.mode);
    draw1();
    //中断して、続きから
    rogueMap.open("map");
    MouseX = rgQuitButton.X + 5; MouseY = rgQuitButton.Y + 5; Click = 1; rogueMap.update(); Click = 0;
    var quit = page.number == 0 && !rogue.active;
    page.change(8); draw1();
    MouseX = rgResumeButton.X + 5; MouseY = rgResumeButton.Y + 5; Click = 1; rogueHub.update(); Click = 0;
    check("ローグライト：中断して続きから", quit && page.number == 9 && rogue.active && rogue.stage == 2);
    //撃墜されるとラン終了。コアがたまり、条件を満たすと解放
    ch = rogue.choices(); rogue.go(ch[0][0], ch[0][1]);
    var f2 = 0; mainScreen.hp = 1; mainScreen.invincible = 0; mainScreen.guard = 0; mainScreen.damage();
    while(page.number == 1 && f2 < 300){ mainScreen.update(); f2++; }
    draw1();
    check("ローグライト：撃墜でラン終了・コア獲得", page.number == 9 && rogueMap.mode == "over" && !rogue.active && !rogue.hasRun() && rogue.meta.cores > 0,
          "コア" + rogue.meta.cores);
    check("ローグライト：ステージ1のボスで「火薬袋」が解放", rogue.itemPool().indexOf("powder") >= 0 && rogue.weaponPool().indexOf("emp") >= 0);
    rogueMap.t = 99; MouseX = rgResultButton.X + 5; MouseY = rgResultButton.Y + 5; Click = 1; rogueMap.update(); Click = 0;
    draw1();
    //永続強化を買う
    var coresBefore = rogue.meta.cores;
    MouseX = rgUpButtons[1].X + 5; MouseY = rgUpButtons[1].Y + 5; Click = 1; rogueHub.update(); Click = 0;
    check("ローグライト：研究所で永続強化", page.number == 8 && rogue.up("parts") == 1 && rogue.meta.cores == coresBefore - RG_UPGRADES[1].cost[0]);
    localStorage.removeItem(RG_META_KEY); localStorage.removeItem(RG_RUN_KEY);
    if(keepRgMeta) localStorage.setItem(RG_META_KEY, keepRgMeta);
    if(keepRgRun) localStorage.setItem(RG_RUN_KEY, keepRgRun);
    page.change(0);

    //テスト前のセーブ等を戻す
    save.clear();
    if(keepSave) localStorage.setItem("dronekun_save", keepSave);
    if(keepBest) localStorage.setItem("dronekun_best", keepBest);
    if(keepClear) localStorage.setItem("dronekun_cleared", keepClear); else localStorage.removeItem("dronekun_cleared");
}catch(e){ fails++; L("NG   例外 " + e.stack); }

check("スクリプトエラーなし", errors.length == 0, errors.slice(0,5).join(" / "));
L("");
L(fails == 0 ? "RESULT: OK" : "RESULT: NG (" + fails + "件)");
document.getElementById("result").textContent = out.join("\n");
</script>
</body></html>
