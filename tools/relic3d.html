<!DOCTYPE html>
<!--
  3Dの構造物(scripts/drone/relic3d.js)を見るページ。Blender で作った形(models/relicModel.js)を WebGL でその場で描く。
    ふつう：ゆっくり回し続ける(主な光も回る)。上に1コマを描く時間と FPS
    #film ：向きを変えた6枚を並べ、絵の大きさごとの描く時間を測る(GPU の処理が終わるまで待つ)
  撮るとき: msedge --headless=new --use-angle=d3d11 --window-size=1280,560 --virtual-time-budget=4000 --screenshot=<出力.png> "file:///.../tools/relic3d.html#film"
  ゲームの中で見るときは index.html#relic
-->
<html lang="ja"><head><meta charset="UTF-8"><base href="../"><title>3Dの構造物</title><style>
body{ margin:0; background:#111; color:#eee; font:13px sans-serif; }
canvas{ display:block; }
pre{ margin:6px 10px; }
</style></head>
<body><canvas id="out"></canvas><pre id="result">running...</pre>
<script src="models/relicModel.js"></script>
<script>var CW = 960, CH = 540;</script>
<script src="scripts/drone/relic3d.js"></script>
<script>
var out = document.getElementById("out"), g = out.getContext("2d"), res = [];
function bg(x, y, w, h){
    var gr = g.createLinearGradient(x, y, x + w, y + h);
    gr.addColorStop(0, "#0a1640"); gr.addColorStop(1, "#1b3f9a");
    g.fillStyle = gr; g.fillRect(x, y, w, h);
}
if(/film/.test(location.hash)){
    var VIEWS = [["正面", 0, 0], ["右へ30°", 0.52, 0.1], ["左へ55°", -0.95, -0.15], ["上から", 0.2, 0.6], ["横", 1.45, 0.05], ["後ろ寄り", 2.4, 0.2]];
    var P = 200;
    out.width = VIEWS.length*(P + 10) + 10; out.height = P + 40;
    g.fillStyle = "#111"; g.fillRect(0, 0, out.width, out.height);
    VIEWS.forEach(function(v, i){
        var x = 10 + i*(P + 10), y = 30;
        bg(x, y, P, P);
        relic3d.draw(g, x + P/2, y + P/2, P, v[1], v[2], 1.0 + i*0.7);
        g.fillStyle = "#eee"; g.font = "bold 13px sans-serif"; g.fillText(v[0], x + 4, 18);
    });
    //描く時間：大きさごとに 30 回の平均(最後に1点を読んで、GPU の処理が終わるまで待つ)
    var px = new Uint8Array(4);
    [200, 400, 800].forEach(function(s){
        relic3d.render(s, 0.3, 0.1, 0);
        var gl = relic3d.gl; gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
        var t0 = performance.now();
        for(var i=0; i<30; i++){ relic3d.render(s, 0.3 + i*0.05, 0.1, i/60); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
        res.push(s + "px: " + ((performance.now() - t0)/30).toFixed(2) + "ms");
    });
    document.getElementById("result").textContent = "WebGL: " + (relic3d.ok ? "使えた" : "使えない " + relic3d.fail) + "  三角形 " + relic3d.n/3 + "\n1コマを描く時間  " + res.join("  ");
}else{
    out.width = 640; out.height = 520;
    var last = 0, frames = 0, fps = 0, t0 = performance.now();
    (function loop(now){
        var t = (now || 0)/1000;
        bg(0, 0, 640, 520);
        relic3d.draw(g, 320, 260 + Math.sin(t*1.3)*8, 440, t*RELIC_SPIN, Math.sin(t*0.7)*RELIC_TILT, t);
        frames++; if(now - last > 1000){ fps = frames; frames = 0; last = now; }
        g.fillStyle = "#eee"; g.font = "13px sans-serif";
        g.fillText("FPS " + fps + "   描く時間 " + relic3d.msAvg.toFixed(2) + "ms(JavaScript の側)   三角形 " + relic3d.n/3, 10, 18);
        requestAnimationFrame(loop);
    })();
    document.getElementById("result").textContent = relic3d.ok ? "" : "使えない " + relic3d.fail;
}
</script>
</body></html>
